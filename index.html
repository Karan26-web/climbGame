  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #1b1410; color: #ECEFF1;
    font-family: "Nunito", "Baloo 2", "Trebuchet MS", "Avenir Next", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: linear-gradient(#FBC58C, #2F4A93); z-index: 10;
    transition: opacity .45s ease; font-weight: 800; letter-spacing: .06em;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #bar { width: min(60vw, 320px); height: 14px; border-radius: 99px;
         background: rgba(43,33,24,.35); overflow: hidden;
         box-shadow: inset 0 2px 6px rgba(43,33,24,.4); }
  #fill { height: 100%; width: 0%; border-radius: 99px;
          background: linear-gradient(#FFD54F, #FFA000); transition: width .2s ease; }
  #boot h1 { margin: 0; font: 400 clamp(40px, 10vw, 96px)/1 "Lilita One", "Nunito", sans-serif;
             letter-spacing: .02em; display: flex; gap: .28em; }
  #boot h1 span { background: linear-gradient(#FFF6B8 0%, #FFE14A 46%, #FFC21A 50%, #FF8A12 100%);

<!-- every word on screen, in each language (tools/build_i18n.js wraps i18n/strings.json) -->

<script>
/* =====================================================================
   CLIMB — a side-scrolling physics climber.
   Single file by design: open index.html directly, no server needed.

   Layout of this script:
     PHYSICS-CORE   maths, procedural terrain, vehicle dynamics  (headless-
                    testable: tools/sim_test.js extracts this block verbatim
                    and runs it under Node, so it must not touch the DOM)
     ASSETS         image loading
     AUDIO          WebAudio engine/tyre synthesis, sampled one-shots (sfx.js)
     WORLD          deterministic chunked props, particles
     RENDER         parallax, terrain ribbon, vehicle assembly, HUD
     GAME           loop, camera, input, screens
   ===================================================================== */

/* ============================ PHYSICS-CORE-START ============================ */
/* Shared math + small helpers. No DOM access — this file must run under Node
   so the physics can be validated headlessly (see tools/sim_test.js). */
var CG = globalThis.CG = globalThis.CG || {};

CG.TAU = Math.PI * 2;

CG.clamp = function (v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; };
CG.lerp = function (a, b, t) { return a + (b - a) * t; };
CG.smoothstep = function (e0, e1, x) {
  var t = CG.clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
};
CG.sign = function (v) { return v < 0 ? -1 : v > 0 ? 1 : 0; };
CG.approach = function (cur, target, rate, dt) {
  // frame-rate independent exponential approach
  return target + (cur - target) * Math.exp(-rate * dt);
};

/* Deterministic hash noise — the terrain is a pure function of x, so the track
   is infinite and needs no stored heightmap. */
CG.hash1 = function (i, seed) {
  // Math.imul, not `*`: plain multiplication of two 32-bit ints exceeds 2^53,
  // silently loses the low bits and leaves the hash badly non-uniform.
  var h = (Math.imul(i | 0, 374761393) + Math.imul(seed | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = h ^ (h >>> 16);
  return (h >>> 0) / 4294967296;
};

/* Value noise with smoothstep interpolation: C1 continuous, so the terrain has
   no slope discontinuities for the wheels to catch on. */
CG.vnoise = function (x, seed) {
  var i = Math.floor(x), f = x - i;
  var a = CG.hash1(i, seed), b = CG.hash1(i + 1, seed);
  return a + (b - a) * (f * f * (3 - 2 * f));
};

/* Seeded RNG for world decoration (props) — mulberry32. */
CG.rng = function (seed) {
  var s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

};

CG.fmt = function (n, d) { return n.toFixed(d === undefined ? 0 : d); };

/* Infinite procedural terrain.
   The surface is a PURE FUNCTION of x — nothing is stored, so the track is
   endless, deterministic per seed, and identical on every replay of that seed. */
(function (CG) {
  'use strict';

  CG.PPM = 50;          // pixels per metre (world scale, per the art brief)
  CG.BASE_Y = 300;      // surface y at the start line (y grows downward)

  var FEAT_SPACING = 1700;

  var Terrain = CG.Terrain = {
    seed: 1,
    track: null,

    setSeed: function (s) { this.seed = (s | 0) || 1; },

    /* A stage hands the terrain an authored pathway (see the PATHWAY module).
       With no track set the old endless noise field is used instead, which is
       what the title screen and the unlocked endless mode still run on. */
    setTrack: function (t) { this.track = t || null; },

    /* Sparse launch ramps / big rollers, laid down on top of the noise so the
       track has deliberate jumps instead of only rolling hills. */
    features: function (x) {
      var sum = 0, sd = this.seed * 7919;
      var k0 = Math.floor(x / FEAT_SPACING) - 1;
      for (var k = k0; k <= k0 + 2; k++) {
        if (k < 1) continue;
        var r1 = CG.hash1(k, 901 + sd), r2 = CG.hash1(k, 902 + sd), r3 = CG.hash1(k, 903 + sd);
        if (r1 < 0.42) continue;
        var cx = k * FEAT_SPACING + r2 * 1100;
        var w = 100 + r3 * 110;
        var t = (x - cx) / w;
        if (t < -3.5 || t > 5) continue;
        var amp = 30 + r1 * 80;
        sum += amp * Math.exp(-t * t);
        // A third of them are kickers: the ramp is followed by a dip, so the
        // ground falls away at the crest instead of catching the car again.
        if (r1 > 0.72) sum -= amp * 0.55 * Math.exp(-(t - 1.9) * (t - 1.9));
      }
      return sum;
    },

    /* Height above the base line. Grows rougher with distance. */
    elevation: function (x) {
      if (this.track) {
        /* fine grain on top of the authored curve: too small to change where
           the car lands, big enough that the ground is not visibly synthetic.
           A chasm part opts out: its two lips ARE the plotted points, and a
           point that is 3px off its own grid line is a point a child cannot
           read. */
        var part = this.track.at(x);
        if (part && part.exact) return this.track.elevation(x);
        return this.track.elevation(x) + CG.vnoise(x / 74, 67 + this.seed * 7919) * 3;
      }
      /* Endless splices chasms into the noise — see the ENDLESS GAPS module.
         Outside every chasm's window (and its short blend margin) this falls
         straight through to rawElevation, same as always. */
      var patch = CG.Endless && CG.Endless.sample(x);
      if (patch !== null && patch !== undefined) return patch;
      return this.rawElevation(x);
    },

    /* The plain noise formula, with no chasm splicing — what elevation() falls
       back to outside any chasm window, and what a chasm's own blend margin
       joins back into. Grows rougher with distance. */
    rawElevation: function (x) {
      var sd = this.seed * 7919;
      var diff = 1 - Math.exp(-Math.max(0, x) / 7000);   // 0 -> 1 difficulty ramp
      var h = 0;
      // Difficulty rides mainly on the LONG wavelengths: that buys tall climbs
      // without creating walls the car physically cannot get up.
      // Amplitudes are chosen from the slope each octave contributes
      // (d/dx of smoothstep value noise ~= 0.5 * amp / wavelength).
      h += CG.vnoise(x / 1600, 11 + sd) * (128 + 320 * diff);
      h += CG.vnoise(x / 900, 23 + sd) * (100 + 102 * diff);
      h += CG.vnoise(x / 380, 37 + sd) * (48 + 24 * diff);
      h += CG.vnoise(x / 165, 53 + sd) * (14 + 7 * diff);
      h += CG.vnoise(x / 72, 67 + sd) * (3 + 2 * diff);
      h += this.features(x) * (0.45 + 0.55 * diff);
      return h;
    },

    /* Bare ground y in world space — the dirt, with no planks laid over it.
       The first 900px are flattened to the start height so the player always
       begins on level ground. The renderer draws THIS, so a chasm still looks
       like a chasm once it has been bridged. */
    ground: function (x) {
      var h = this.elevation(x);
      var s = CG.smoothstep(120, 1000, x);
      if (s < 1) h = CG.lerp(this.elevation(0), h, s);
      return CG.BASE_Y - h;
    },

    /* PLANKS — the bridges the player earns by answering. Each is a straight
       driving surface {x0,y0,x1,y1} (top edge, x0 < x1) laid over the ground;
       the car drives on whichever is higher, so a plank over a pit is a road
       and a plank that stops short is a road that ends in mid-air. Planks are
       part of the physics surface, not decoration: the vehicle, the bot in
       tools/stage_test.js and the game all see exactly the same thing. */
    planks: [],
    setPlanks: function (list) { this.planks = list || []; },
    addPlank: function (p) { this.planks.push(p); },

    /* Driving surface y in world space: ground, or a plank if one is higher. */
    y: function (x) {
      var y = this.ground(x), ps = this.planks, i, p;
      for (i = 0; i < ps.length; i++) {
        p = ps[i];
        if (x < p.x0 || x > p.x1) continue;
        var py = p.y0 + (x - p.x0) * (p.y1 - p.y0) / (p.x1 - p.x0);
        if (py < y) y = py;
      }
      return y;
    },

    /* Is x on a plank (rather than on the ground)? Used to tell a car that
       drove off the END of a short plank from one that never got on it. */
    onPlank: function (x) {
      var ps = this.planks, i;
      for (i = 0; i < ps.length; i++) if (x >= ps[i].x0 && x <= ps[i].x1) return ps[i];
      return null;
    },

    /* Ground-only sample, for placing props and drawing the dirt. */
    gsample: function (x, out) {
      out = out || {};
      var d = 1.5, y = this.ground(x);
      var m = (this.ground(x + d) - this.ground(x - d)) / (2 * d);
      var L = Math.sqrt(1 + m * m);
      out.x = x; out.y = y; out.m = m;
      out.nx = m / L; out.ny = -1 / L; out.tx = 1 / L; out.ty = m / L;
      out.ang = Math.atan2(m, 1);
      return out;
    },

    /* Surface point, slope and up-normal at x. */
    sample: function (x, out) {
      out = out || {};
      var d = 1.5;
      var y = this.y(x);
      var m = (this.y(x + d) - this.y(x - d)) / (2 * d);   // dy/dx
      var L = Math.sqrt(1 + m * m);
      out.x = x; out.y = y; out.m = m;
      out.nx = m / L; out.ny = -1 / L;      // unit normal, points up (-y)
      out.tx = 1 / L; out.ty = m / L;       // unit tangent, points +x
      out.ang = Math.atan2(m, 1);
      return out;
    }
  };
})(CG);

/* ================================== PATHWAY =================================
   Authored track parts ("the pathway"), stitched into a stage.

   A part is a height curve h(t), t in [0,1], measured RELATIVE to the height
   the previous part ended at. The contract that makes parts interchangeable:

       h(0) = 0        and      h'(0) = h'(1) = 0

   i.e. every part enters and leaves level, so any two parts join without a
   kink the wheels could catch on. INSIDE a part anything goes — a kicker
   wants a sharp lip, a drop-off wants a cliff. Those discontinuities are
   deliberate and always land away from a join.

   Everything here is a pure function of (stage plan, seed): no state, no
   stored heightmap, identical on every replay, and DOM-free so
   tools/sim_test.js can drive every part headlessly before it ships.        */
(function (CG) {
  'use strict';

  var TAU = CG.TAU, PI = Math.PI;
  function ss(t) { return t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t); }

     tools/sim_test.js, not taste:
         climbs a sustained 30 deg, stalls into wheelspin past 35,
         tops out at 76 km/h, brakes from that in 23 m.
     So every part keeps its SUSTAINED slope under 30 deg. The only ground
     steeper than that is a take-off lip (short, arrived at with speed, exits
     downhill) or a cliff face (which the car flies off, never up). And no pit
     is ever a trap: every hole has an escape ramp under 30 deg, so missing a
     jump costs time, never the run. tools/stage_test.js re-checks all of this
     on every stage, so a part that breaks the budget fails the build. */
  var MAX_TAN = 0.55;                    // tan(29 deg) — sustained ground
  var LIP_TAN = 0.80;                    // tan(39 deg) — take-off lips only

  /* Shortest length that keeps a height change of H inside a slope budget.
     `k` is the curve's peak derivative: 1.5 for smoothstep, PI for sin^2. */
  function fit(H, k, tan) { return Math.abs(H) * k / (tan || MAX_TAN); }

  /* Each builder takes (d, r): d = stage difficulty 0..1, r = seeded rng.
     Returns { len, h, tags } — tags drive decoration:
       rest  flat enough to park on        air   expect the car to leave the ground
       grind sustained traction demand     risk  a real chance of ending the run  */
  var PARTS = CG.PARTS = {

    /* Level ground. The run always opens on one so the player can settle. */
    start: function () {
      return { len: 1000, h: function () { return 0; }, tags: 'rest' };
    },

    flat: function (d, r) {
      var L = 460 + r() * 320;
      return { len: L, h: function () { return 0; }, tags: 'rest' };
    },

    /* Rolling whoops. The bread and butter: teaches throttle modulation,
       because flooring it here bounces the nose up and loses drive. */
    rollers: function (d, r) {
      var n = 2 + Math.floor(r() * 3), L = 620 + n * 300;
      var a = Math.min(30 + d * 58, MAX_TAN * L / (Math.PI * n));
      return { len: L, tags: 'flow',
               h: function (t) { return a * 0.5 * (1 - Math.cos(CG.TAU * n * t)); } };
    },

    /* Fast, shallow chatter — shakes the suspension without threatening. */
    washboard: function (d, r) {
      var n = 5 + Math.floor(r() * 4), L = 700 + n * 120;
      var a = Math.min(10 + d * 12, MAX_TAN * L / (Math.PI * n));
      return { len: L, tags: 'flow',
               h: function (t) { return a * 0.5 * (1 - Math.cos(CG.TAU * n * t)); } };
    },

    /* Sustained ascent. Net elevation gain — the stage climbs as it runs. */
    climb: function (d, r) {
      var H = 150 + d * 300 + r() * 90, L = Math.max(820 + H * 1.35, fit(H, 1.5));
      return { len: L, tags: 'grind',
               h: function (t) { return H * ss(t); } };
    },

    /* The payback: a long descent, free speed, easy to over-commit into. */
    descent: function (d, r) {
      var H = 140 + d * 260 + r() * 80, L = Math.max(780 + H * 1.15, fit(H, 1.5));
      return { len: L, tags: 'flow',
               h: function (t) { return -H * ss(t); } };
    },

    /* A big smooth hump. The far side is blind from the approach. */
    crest: function (d, r) {
      var H = 150 + d * 230 + r() * 70, L = Math.max(980, fit(H, Math.PI));
      return { len: L, tags: 'flow', h: function (t) { return H * sin2(t); } };
    },

    /* A bowl. Bottoms the suspension out at speed and compresses the exit. */
    basin: function (d, r) {
      var D = 150 + d * 250 + r() * 80, L = Math.max(900, fit(D, Math.PI));
      return { len: L, tags: 'flow', h: function (t) { return -D * sin2(t); } };
    },

    /* Ramp that falls away at the lip: the ground leaves before the car does,
       so this is the part that actually produces air time. The lip is the one
       place a steep face is allowed — it is short and it exits downhill. */
    kicker: function (d, r) {
      var H = 110 + d * 130 + r() * 50, pit = 60 + d * 80;
      var L = Math.max(900 + d * 300, fit(H, 1.7 / 0.45, LIP_TAN),
                       fit(H + pit, Math.PI));
      return { len: L, tags: 'air',
        h: function (t) {
          if (t < 0.45) return H * Math.pow(t / 0.45, 1.7);
          var u = (t - 0.45) / 0.55;
          return H * (1 - ss(u)) - pit * sin2(u);
        } };
    },

    /* Take-off lip, a hole, a landing ramp. Clear it and you keep your speed;
       miss it and you drive out of the bottom — slowly. Never a dead end. */
    gap: function (d, r) {
      var H = 100 + d * 90, D = 130 + d * 120;
      /* the escape ramp (t 0.55 -> 0.90) carries the whole depth plus the
         landing lip, and it is what sets the part's length */
      var L = Math.max(1200 + d * 500 + r() * 160, fit(D + H * 0.7, 1.5) / 0.35);
      return { len: L, tags: 'air risk',
        h: function (t) {
          if (t < 0.22) return H * Math.pow(t / 0.22, 1.8);        // take-off
          if (t < 0.55) {                                          // the hole
            var u = (t - 0.22) / 0.33;
            return H - (H + D) * ss(u);
          }
          if (t < 0.90) {                                          // escape ramp
            var w = (t - 0.55) / 0.35;
            return -D + (D + H * 0.7) * ss(w);
          }
          return H * 0.7 * (1 - ss((t - 0.90) / 0.10));

    },

    /* Rock steps. Each step needs momentum, not throttle — but no single step
       is steeper than the car can walk up from a standstill. */
    stairs: function (d, r) {
      var n = 3 + Math.floor(d * 3 + r()), rise = 55 + d * 55;
      var L = Math.max(300 * n + 380, n * fit(rise, 1.5));
      return { len: L, tags: 'grind risk',
        h: function (t) {
          var s = t * n, i = Math.floor(s), f = s - i;
          if (i >= n) return n * rise;
          return (i + ss(f)) * rise;
        } };
    },

       run-out below is long and level, so a good landing is rewarded with
       speed rather than a second obstacle. */
    dropoff: function (d, r) {
      var H = 150 + d * 150 + r() * 60, L = Math.max(1500, H * 4.6);
      return { len: L, tags: 'air risk',
        h: function (t) {
          if (t < 0.28) return 0;
          return -H * ss(Math.min(1, (t - 0.28) / 0.26));   // rest is run-out
        } };
    },

    /* Raised rest shelf. Checkpoints live here: level, generous, safe to
       respawn onto, and visibly a place to breathe. */
    shelf: function (d, r) {
      var H = 60 + d * 120, L = Math.max(900 + r() * 200, fit(H, 1.5) / 0.45);
      return { len: L, tags: 'rest',
               h: function (t) { return H * ss(Math.min(1, t / 0.45)); } };
    },

    /* Long level run-out so a player who crosses the line at speed can stop. */
    finish: function () {
      return { len: 1900, h: function () { return 0; }, tags: 'rest' };
    },

    /* THE CHASM — the part the game is now about.
       A level approach, a sheer drop, a pit, a sheer rise to the far lip
       (which may be higher or lower than the near one), and a level run-out.
       The two lips are the two points (x1,y1) and (x2,y2) of a distance-formula
       question, plotted on a grid CG.UNIT px per unit, and the only way across
       is a plank exactly sqrt(dx^2 + dy^2) units long. The car is stopped on
       the approach, asked, and the plank it earns becomes part of the driving
       surface (see Terrain.planks). Nothing here is random: the part is a pure
       function of the authored coordinates, so a question is the same on every
       replay and tools/stage_test.js can check every one of its three outcomes.
       `spec` is [x1, y1, x2, y2]; x2 must exceed x1. */
    chasm: function (d, r, spec) {
      var U = CG.UNIT, W = CG.CHASM;
      var dx = (spec[2] - spec[0]) * U, dyH = (spec[3] - spec[1]) * U;
      if (dx <= 0) throw new Error('chasm: x2 must be greater than x1');
      var floor = Math.min(0, dyH) - W.PIT;          // pit floor, relative height
      var L = W.APP + dx + W.RUN, wall = W.WALL;
      return { len: L, tags: 'rest math',
        gapX: [W.APP, W.APP + dx],                   // lips, relative to x0
        floor: floor, rise: dyH,
        h: function (t) {
          var x = t * L;
          if (x < W.APP) return 0;
          if (x < W.APP + wall) return floor * ss((x - W.APP) / wall);
          if (x < W.APP + dx - wall) return floor;
          if (x < W.APP + dx) return floor + (dyH - floor) * ss((x - (W.APP + dx - wall)) / wall);
          return dyH;
        } };
    }
  };

  /* Grid scale and chasm geometry, in world px. One unit is 72px, so the
     240px car spans about three units and the narrowest gap in the game (4
     units) is wider than the car — at a smaller scale a car that drove off a
     short plank simply rested its nose on the far wall, and the lesson was
     lost. PIT is deep enough that a wedged over-long plank (which digs
     sqrt(L^2 - dx^2) below the near lip) stays clear of the floor, and that a
     fall reads as a fall before the reset. */
  CG.UNIT = 72;
  /* THE ROW AT A GAP: the truck, the plank generator console (the ruler
     stands on it), the saw, the plane - each a hand's width from the next
     (see Gaps.holdFor, which works out where the truck is held). APP is the
     level approach, long enough that even the furthest hold (a tall plane,
     the camera zoomed right out) has the whole truck on the level: the road
     before it is whatever the last part left, up to 40px off. BRAKE is the
     run the auto-brake gets to bring the truck to its hold. The saw stands
     MACH_CLEAR clear of the plane's left edge, never nearer the lip than
     MACH_OUT nor further back than MACH_SET; KEYS_ROOM is the screen px the
     console and ruler take between truck and saw, gaps included. */
  CG.CHASM = { APP: 1100, RUN: 640, PIT: 1500, WALL: 10, CHUTE: 600,
               STOP: 720, STOP_MIN: 420, TAIL_ROOM: 140, BRAKE: 570,
               MACH_W: 280, MACH_OUT: 4, MACH_CLEAR: 16, MACH_SET: 260, KEYS_ROOM: 168 };

  /* -------------------------------------------------------------- builder */

     that follows) and 'FINISH' (the line is at the start of that part). */

  /* Landing insurance. Every part starts level by contract, but a part that
     RISES hard just after an air part still flips a car that is coming down
     fast — and that is a crash the player could not have avoided. So the
     builder inserts a run-out rather than trusting the plan to be careful.
     tools/stage_test.js is what found this, on GOLDEN SUMMIT. */
  var AIR = { kicker: 1, gap: 1, dropoff: 1 };
  var NO_LAND = { climb: 1, stairs: 1, crest: 1, shelf: 1, gap: 1, kicker: 1, chasm: 1 };

  /* A plan entry is a part name, a marker, or a chasm spec `{ c: [x1,y1,x2,y2] }`. */
  function nameOf(e) { return typeof e === 'string' ? e : 'chasm'; }

  function expand(plan) {
    var out = [], i, prev = '', n;

       lowered further at runtime if frames run long. */

    /* Landscape fits to height and widens; anything narrower than 5:4 fits to

     view, so unmirrored the same three cherry trees came round about every
     two seconds of driving. Both layers are hazed and carry no strongly
     directional highlights, so a flipped copy reads as more of the same
     hedgerow rather than as a reflection. */

  /* A tile row is laid out in BACKING-STORE pixels, not in renderer units.

     the right tile the other ~65%, and compositing them one after the other
     leaves ~23% of whatever is behind them still showing through. Over an
     opaque bush against a darker sky that is a dark hairline straight down
     the join — the line that makes one painted row read as separate pasted
     cut-outs. Rounding the tile size and every tile origin to whole backing
     pixels makes the joins exact. The cached tile is built at the device size

     for the three parallax layers that turns the per-frame blit from a 2.1x

    if (R.ox > 0) xD -= period;
    c.save();

  /* Everything painted behind the world, in three passes that each fade:

  /* The horizon the ground haze sits on: the terrain averaged over 2 km

  /* ------------------------------------------------------------ colour grade

     low sun, a violet multiply for the shade it leaves behind. Drawn after the
     world and before the HUD, so the interface keeps its own contrast. */

     warm screen and a violet shade come up together (the old evening look,
     at its peak); at night a deep blue multiply takes most of the light out

     fog lifts everything toward pale, snow lifts it toward cold white. */

                       and the contrast and takes about a third of the light:

     desaturate ('saturation' + 'multiply' composites) measured 5.6 ms a

  /* ---------------------------------------------------------------- weather

        if (p.x < -20) p.x += W + 40; else if (p.x > W + 20) p.x -= W + 40;

      if (flakes.length > n) flakes.length = n;
      c.save();
      c.fillStyle = 'rgba(255,255,255,0.85)';
      for (i = 0; i < flakes.length; i++) {

       out 3x3, scale that, then cut the centre tile: its edges then resample
       against real neighbouring content. */

    big.width = big.height = patTile * 3;

     vertical ribbing. Baking it in also lets the bottom rows fade out, so the
     cap melts into the tiled soil instead of ending on a hard line. */
  function makeCapTile(tw, th, gt) {
    if (!gt) return null;
    /* Two copies side by side: a slice near the end of the tile can then read
       past the period without wrapping. Clamping the source x instead left a
       visible texture jump once every period. */
    var off = document.createElement('canvas');
    off.width = tw * 2; off.height = th;
    var oc = off.getContext('2d');
    oc.imageSmoothingQuality = 'high';
    oc.drawImage(gt, 0, 0, gt.width, GRASS_SRC_ROWS, 0, 0, tw, th);
    oc.drawImage(gt, 0, 0, gt.width, GRASS_SRC_ROWS, tw, 0, tw, th);
    var g = oc.createLinearGradient(0, 0, 0, th);
    g.addColorStop(0, 'rgba(43,33,24,0)');
    g.addColorStop(0.40, 'rgba(43,33,24,0.05)');
    g.addColorStop(1, 'rgba(43,33,24,0.32)');
    oc.fillStyle = g;
    /* BOTH copies: the ribbon reads past tw on purpose, so shading only the
       first one left every slice that crossed the period a shade lighter than
       its neighbours — a bright vertical band, one slice wide, once per 840
       world px of ground. */
    oc.fillRect(0, 0, off.width, th);

       (see drawTerrain), and any semi-transparent rows would double up in the
       overlaps as dark streaks. So the bottom rows are blended in RGB toward
       the tiled soil's mean tone instead of toward transparency: the join is
       then a texture change with no tonal step, and no alpha to compound. */

         space - one tile is patTile world px - so it moves and zooms exactly
         with the ground and the grass on it. It used to be a fixed-size
         screen pattern that only scrolled with the camera; every zoom change

     strip follows the ground exactly.

     the terrain curves, neighbouring slices splay apart and open a thin
     wedge down to the full depth of the cap — which showed up as dark
     streaks hanging into the soil. The fix is to overrun each slice by CAP_PAD
     at both ends so neighbours always overlap by more than any wedge can
     open. The overrun is applied to the source and destination equally, so
     the blit stays 1:1, and the cap is opaque, so overlapping is invisible. */

      c.strokeStyle = SPAN_COL; c.beginPath(); c.moveTo(ax, ay); c.lineTo(cx, cy); c.stroke();
      if (q.dy) { c.strokeStyle = LEG_Y; c.beginPath(); c.moveTo(cx, cy); c.lineTo(bx, by); c.stroke(); }
      var ll = R.legLabels(gap);
      haloText(ll[0].t, ll[0].x, ll[0].y, ll[0].s, SPAN_COL, 'center', HALO_DARK);
      if (ll[1]) haloText(ll[1].t, ll[1].x, ll[1].y, ll[1].s, LEG_Y, 'center', HALO_DARK);
    }
    /* THE SPAN TO MEASURE: a dashed line from point to point - the plank's
       own line, which is what the question asks the length of. It goes
       with the plane once the answer is in: the plank takes its place. */

      c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.stroke();

       the question builds itself in front of the player rather than appearing
       fully formed; their coordinates follow, each lighting up as it lands */

      if (p[3] <= 0.01) return;

      gl.addColorStop(0, 'rgba(255,159,28,0.5)'); gl.addColorStop(1, 'rgba(255,159,28,0)');

         with a pop of its own and lit in orange for a moment - the thing to
         read is here */

      c.globalAlpha = p[3] * la;

      c.translate(lb.x, lb.y); c.scale(lp, lp); c.translate(-lb.x, -lb.y);
      if (hi > 0.01) {

        c.save();

      c.lineWidth = Math.max(1.5, lb.fs * 0.1); c.strokeStyle = hi > 0.01 ? 'rgba(255,159,28,' + (0.45 + 0.55 * hi).toFixed(3) + ')' : LABEL_EDGE; c.stroke();

  /* A plank. `pose` is the midpoint of its TOP edge, its angle, its length in

    c.translate(R.sx(pose.x), R.sy(pose.y));
    c.rotate(pose.ang);

    c.scale(sc, sc);

         strap-centre, so the straps land on the unit marks and every seam
         hides under one - the length can still be counted by eye. The four
         painted tiles take turns so the grain does not visibly repeat; the
         rounded caps sit over the half-straps at the two ends. Tiles overlap
         a hair so no background shows through at a seam. */

      }

      c.drawImage(im, cl[0], 0, cl[1], P.h, -L / 2, top, cl[1] * hs, hh);
      c.drawImage(im, cr[0], 0, cr[1], P.h, L / 2 - cr[1] * hs, top, cr[1] * hs, hh);
      if (pose.bad > 0) {                              // a wrong board, gone red
        c.save();

        c.globalAlpha *= pose.bad;
        R.roundRect(-L / 2, 1, L, T - 2, (T - 2) / 2); c.fillStyle = '#FF6A5C'; c.fill();
        c.restore();
        c.save();
        c.globalAlpha *= pose.bad;

        c.lineWidth = 3; c.strokeStyle = 'rgba(255,70,58,0.95)'; c.stroke();
        c.restore();

    g.addColorStop(0, '#D9A05B'); g.addColorStop(0.5, '#B87A3A'); g.addColorStop(1, '#8A5424');
    c.fillStyle = g;
    R.roundRect(-L / 2, 0, L, T, 3); c.fill();
    c.lineWidth = 2; c.strokeStyle = '#5B3616'; c.stroke();

    c.beginPath();
    for (var i = 1; i < 3; i++) { c.moveTo(-L / 2 + 6, T * i / 3 + 1); c.lineTo(L / 2 - 6, T * i / 3 - 1); }
    c.stroke();
    /* bracing straps every ~unit so the length can be counted by eye */
    c.fillStyle = 'rgba(70,40,15,0.45)';
    var n = Math.max(1, Math.round(L / CG.UNIT));
    for (var k = 1; k < n; k++) c.fillRect(-L / 2 + k * (L / n) - 1.5, 0, 3, T);
    /* top highlight */
    c.fillStyle = 'rgba(255,240,200,0.35)';
    c.fillRect(-L / 2 + 2, 1, L - 4, 2);
    if (label) {
      c.rotate(-pose.ang);
      haloText(label, 0, -24, 18, '#FFFFFF', 'center', 'rgba(27,42,94,0.7)');
    }

  /* Planks already fixed into the world (see Terrain.planks). */

    for (i = 0; i < ps.length; i++) {

    }

  /* ----------------------------------------------------- the plank machine

     drop, its conveyor's end at the near lip. The plank the player asked for
     is cut by it and fed out over the hole, then dropped across. Where it
     is, in world px, for a gap: its art's origin and scale, the blade, the

             bladeX: x0 + M.blade[0] * k, bladeY: y0 + M.blade[1] * k, bladeR: M.blade[2] * k,

  /* The wrong-plank cross: a red disc with a white X, popping in over where

    var c = R.ctx, t = b.t, z = R.cam.z;
    if (t > 1.3) return;
    var k = CG.clamp(t / 0.22, 0, 1), s = 1 + 2.7 * Math.pow(k - 1, 3) + 1.7 * Math.pow(k - 1, 2);
    var x = R.sx(b.x), y = R.sy(b.y) - 48 * z, r = Math.max(16, 24 * z) * s;
    if (r <= 0) return;
    c.save();
    c.globalAlpha = CG.clamp((1.3 - t) / 0.3, 0, 1);
    var gl = c.createRadialGradient(x, y, r * 0.6, x, y, r * 2.3);
    gl.addColorStop(0, 'rgba(255,60,50,0.45)'); gl.addColorStop(1, 'rgba(255,60,50,0)');

    c.beginPath(); c.arc(x, y, r, 0, CG.TAU);
    c.fillStyle = '#FF4D4D'; c.fill();
    c.lineWidth = Math.max(2.5, r * 0.13); c.strokeStyle = '#FFFFFF'; c.stroke();
    c.lineCap = 'round'; c.lineWidth = Math.max(3.5, r * 0.2);

    c.moveTo(x - r * 0.4, y - r * 0.4); c.lineTo(x + r * 0.4, y + r * 0.4);
    c.moveTo(x + r * 0.4, y - r * 0.4); c.lineTo(x - r * 0.4, y + r * 0.4);
    c.stroke();
    c.restore();
  };

  /* The reverse blocker (see backLimit in the game): a tyre stack between
     two cones on the road behind the truck, rising out of the ground as the
     truck backs towards it - `k` 0..1 is how close it is. */

    if (k <= 0.01) return;

    var up = k * k * (3 - 2 * k), parts = [['cone', -40, 36], ['tyres', 0, 60], ['cone', 40, 36]];
    c.save();
    c.globalAlpha = Math.min(1, k * 1.6);

      var im = I[parts[i][0]];
      if (!im) continue;

      var ww = hh * im.width / im.height;

    }

  };

  /* The machine in layers, back to front: the body with its parts out, the
     rollers and cog in their holes, the plank being fed (clipped at the
     blade, so it comes out of the cut rather than out of the housing), the
     blade in its cavity, then every bit of body that sits in front of the
     blade, the lever and the lamp. `st` is the game's animation state:

    var jx = st.jolt ? st.jolt * 0.5 * Math.sin(st.clock * 57) : 0;
    var jy = st.jolt ? st.jolt * 0.3 * Math.sin(st.clock * 43 + 1.3) : 0;

      c.translate(R.sx(f.x0 + jx), R.sy(f.y0 + dy + jy));

    function spin(im, x, y, s, a, alpha) {
      if (!im || alpha <= 0) return;
      c.save();
      c.globalAlpha = alpha;
      c.translate(x, y); c.rotate(a); c.scale(s, s);
      c.drawImage(im, -im.width / 2, -im.height / 2);
      c.restore();
    }
    c.save();
    if (st.sink > 0) {                      // going down through the grass
      c.beginPath(); c.rect(0, 0, R.W, R.sy(g.ay) + 2); c.clip();
    }
    c.save();
    frame();
    c.drawImage(I.machBack, 0, 0);
    var i, rs = M.roller[1];
    for (i = 0; i < M.rollers.length; i++) spin(I.roller, M.rollers[i][0], M.rollers[i][1], rs, st.roll + i, 1);

      c.drawImage(I.lever, -L[2], -L[3]);

      c.globalAlpha = st.lamp;

      gl.addColorStop(0, 'rgba(170,255,90,0.55)'); gl.addColorStop(1, 'rgba(120,255,40,0)');
      c.fillStyle = gl; c.fillRect(lx - 46, ly - 46, 92, 92);
    }
    c.restore();
    c.restore();
  };

  /* ---------------------------------------------------------------- vehicle */

  R.farWheel = function (wheel) {

  /* A coil-over from its chassis mount M to the hub H, in body space. The

  var STRUT_INK = '#15141c';

    c.strokeStyle = col; c.lineWidth = w;
    c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.stroke();
  }
  R.drawStrut = function (c, mx, my, hx, hy) {
    var A = V.ART, dx = hx - mx, dy = hy - my, len = Math.hypot(dx, dy) || 1;
    var ux = dx / len, uy = dy / len, nx = -uy, ny = ux, k;
    c.lineCap = 'round';
    /* rod: can -> hub */
    strokeSeg(c, mx + ux * 60 * A, my + uy * 60 * A, hx, hy, 18 * A, STRUT_INK);
    strokeSeg(c, mx + ux * 60 * A, my + uy * 60 * A, hx, hy, 10 * A, '#aab0bc');
    /* damper can */
    var cx = mx + ux * 85 * A, cy = my + uy * 85 * A;
    strokeSeg(c, mx, my, cx, cy, 40 * A, STRUT_INK);
    strokeSeg(c, mx, my, cx, cy, 30 * A, '#4e525e');
    strokeSeg(c, mx + nx * 6 * A, my + ny * 6 * A, cx - ux * 5 * A + nx * 6 * A,

    var s0 = 40 * A, s1 = Math.max(len - (V.WHEEL_R / A - 10) * A, s0 + 30 * A);
    var N = 4, hw = 34 * A, tilt = 7 * A;

      var t = s0 + (s1 - s0) * (k + 0.5) / N, px = mx + ux * t, py = my + uy * t;
      var x0 = px - nx * hw + ux * tilt, y0 = py - ny * hw + uy * tilt;
      var x1 = px + nx * hw - ux * tilt, y1 = py + ny * hw - uy * tilt;
      strokeSeg(c, x0, y0, x1, y1, 24 * A, STRUT_INK);
      strokeSeg(c, x0, y0, x1, y1, 16 * A, '#de301e');
      strokeSeg(c, px - nx * hw * 0.6 - ux * 3 * A, py - ny * hw * 0.6 - uy * 3 * A,
                px + nx * hw * 0.2 - ux * 5 * A, py + ny * hw * 0.2 - uy * 5 * A, 4 * A, '#ff9a78');
    }
  };

  R.drawVehicle = function (v, dt) {
    var c = R.ctx, z = R.cam.z, ART = V.ART, i, w;
    var car = CG.img.car, wheel = CG.img.wheel, well = CG.img.well;
    c.save();
    c.translate(R.sx(v.x), R.sy(v.y));
    c.rotate(v.a);
    c.scale(z, z);

    /* back to front: arch shadow, far tyres, struts, near tyres, body. The
       arch shadow fills what cutting the tyres out of the body left open, so
       a drooping wheel shows chassis between it and the fender, not sky. */
    if (well) {
      c.drawImage(well, V.bodyOrigin.x, V.bodyOrigin.y,
                  well.width * ART, well.height * ART);
    }

    /* wheels first — they sit behind the chassis and protrude below the arches.
       Each axle draws its FAR tyre too, shaded and set back up-and-rearward
       where the painter put it (import_truck.py FAR_OFF), so the truck keeps
       its depth; it rides the same spring and turns with the near one. */

      var wd = 2 * V.WHEEL_R * (wheel.width / (2 * 175.5));  // 175.5px = tyre radius in art
      var far = R.farWheel(wheel), fox = 100 * ART, foy = -10 * ART;
      for (i = 0; i < 2; i++) {
        w = v.wheels[i];
        c.save();
        c.translate(w.ax + fox, w.ay + w.s + foy);
        c.rotate(w.ang || 0);
        c.drawImage(far, -wd / 2, -wd / 2, wd, wd);
        c.restore();
      }
      R.drawStrut(c, V.strutRear.x, V.strutRear.y, v.wheels[0].ax, v.wheels[0].ay + v.wheels[0].s);
      R.drawStrut(c, V.strutFront.x, V.strutFront.y, v.wheels[1].ax, v.wheels[1].ay + v.wheels[1].s);
      for (i = 0; i < 2; i++) {
        w = v.wheels[i];
        c.save();
        c.translate(w.ax, w.ay + w.s);
        c.rotate(w.ang || 0);
        c.drawImage(wheel, -wd / 2, -wd / 2, wd, wd);
        c.restore();
      }
    }
    if (car) {
      c.drawImage(car, V.bodyOrigin.x, V.bodyOrigin.y,
                  car.width * ART, car.height * ART);
    }
    /* no driver: the cabin is tinted glass, and the car is the character */

    /* headlamps: a cone of light ahead of the lamp cluster once it gets dark,
       additive so it lifts whatever it falls on rather than painting over it */
    var night = CG.Env.night;
    if (night > 0.04) {

      gl.addColorStop(0, 'rgba(255,246,200,' + (0.9 * night).toFixed(3) + ')');
      gl.addColorStop(1, 'rgba(255,246,200,0)');

    green: ['#F1FFD0', '#C6F26A', '#8DD838', '#4DA51E'],
    red:   ['#FFE3D6', '#FF9C7A', '#FF6A4A', '#D8331E'],

  /* A chunky game title: extruded depth, fat ink outline, glossy gradient.

/* ================================== STAGES ==================================
   The objective. A run is one stage: fit every plank and reach the flag
   before the three hearts run out. Stars are the hearts still held at the
   flag — one for finishing, three for a clean run — so a stage stays worth
   replaying after it is beaten.

   `plan` is the pathway: the ordered list of parts from the PATHWAY module.
   'CP' plants a checkpoint flag on the part that follows (a `shelf` — level
   ground; the flag is the one pacing beat on a long climb); 'FINISH' puts
   the line at the start of the part after it, which is always the long
   level `finish` run-out.

   its length, time, chasm count, respawns and steepest grade. Re-run it
   after changing a plan, to be sure it can still be finished.               */

  'use strict';

     horizontal gap, or one of the six Pythagorean triples with a
     hypotenuse of 20 or less laid on its side:
       3-4-5    6-8-10   9-12-15   12-16-20    one shape, x1 x2 x3 x4 (37 deg)
       5-12-13  8-15-17                         the two others (23, 28 deg)

     sustained 30 deg at most, so the only UPHILL triples are 5-12-13 and
     8-15-17; the 3-4-5 family always runs downhill, and its two big ones
     only on the long side (12-16-20 laid on its short side, 53 deg, is a
     drop the truck noses into). Stage 1 is plain - level gaps, count
     across - and each stage after it brings in one new triple, smallest
     hypotenuse first, reviewing the ones before: 3-4-5, 6-8-10, 5-12-13,
     9-12-15, 8-15-17, 12-16-20, and GOLDEN SUMMIT asks all six. From the
     first answer longer than 14 (stage 5) the ruler is the long one
     (`ruler`, see CG.Gaps.RULER; stages without one get the short ruler).
     `name` is the stage's label in the tools (stage_test prints it); what
     the player reads - the name in their language, and the one-line
     subtitle - is stages.<id> in i18n/strings.json. */

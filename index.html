    var words = str.split(' '), lines = [], cur = '', i, t;
    for (i = 0; i < words.length; i++) {
      t = cur ? cur + ' ' + words[i] : words[i];
      if (cur && c.measureText(t).width > maxW) { lines.push(cur); cur = words[i]; } else cur = t;
    }
    if (cur) lines.push(cur);
    return lines;
  }

  /* The three lines, one at a time on a glass card at the top, each fading
     in and out; three dots under it say where in the three we are. While
     the lesson has the screen nothing is drawn - unless it never came up,
     when the way on is offered instead. */
  function drawIntroCard(q) {
    var c = R.ctx, W = R.W, H = R.H, u = uiScale(), i;
    if (q.phase === 'lesson') {
      if (G.lesson.up) return;
      dim(0.45);
      var bottom = headline(T('intro.noLessonTitle'), 'gold', null, null, T('intro.noLessonStrap'), u);
      bigButton('lessonskip', W / 2, Math.min(bottom + 90 * u, H - 80 * u), 300 * u, 80 * u,
                T('intro.continue'), 'green', 'iconRestart', T('intro.continueSub'));
      return;
    }
    var s = q.step, b = INTRO[s];
    var k = Math.min(CG.clamp(q.stepT / INTRO_IN, 0, 1), CG.clamp((b.t - q.stepT) / INTRO_OUT, 0, 1));
    if (k <= 0.01) return;
    k = k * k * (3 - 2 * k);
    /* the plate (R.plate): the words sit in its cream, between the screws
       and the bottom step; the side padding keeps them off the hazard tabs */
    var fs = Math.round(CG.clamp(W * 0.028, 17, 24)), pad = 46, maxW = Math.min(W - 32, 680);
    var P = R.PLATE, band = P.text.bottom - P.text.top;
    c.save();
    c.font = R.font(fs, false, R.CW);
    var lines = wrapText(c, T(b.key), maxW - pad * 2), tw = 0;
    for (i = 0; i < lines.length; i++) tw = Math.max(tw, c.measureText(lines[i]).width);
    var lh = fs * 1.3, h = Math.max(fs * 4.1, (lines.length * lh + 26) / band), w = Math.max(tw + pad * 2, h * 1.6);
    var x = W / 2 - w / 2, y = x > HUD_X + 150 ? 14 : 72;     // clear of the hearts
    y += (1 - k) * -12;
    c.globalAlpha = k;
    R.plate(x, y, w, h);
    var ty = y + h * (P.text.top + band / 2) - lines.length * lh / 2;
    for (i = 0; i < lines.length; i++) {
      R.text(lines[i], W / 2, ty + lh * (i + 0.5) + 1, fs, R.NAVY, 'center', 0, false, R.CW);
    }
    for (i = 0; i < INTRO.length; i++) {
      c.beginPath(); c.arc(W / 2 + (i - 1) * 16, y + h + 10, 4, 0, CG.TAU);
      c.fillStyle = i <= s ? '#FF9F1C' : 'rgba(255,255,255,0.5)'; c.fill();
    }
    c.restore();
  }

  function drawGapUI() {
    var q = G.gap, g = q.g, c = R.ctx, W = R.W, H = R.H;
    if (q.phase === 'intro' || q.phase === 'lesson') { drawIntroCard(q); return; }
    R.avoid = null;                    // drawRuler sets it again if the ruler is up
    if (q.phase === 'ask' && q.panel > 0.01) {
      var gb = R.gridBox(g), ra = rulerAnchor();
      c.save();
      c.globalAlpha = q.panel;
      /* The question sits on a frosted glass pill with a ruler icon, in the
         strip to the right of the hearts card; where that strip is too
         narrow (a phone) it drops below the buttons, beside the ruler. */
      var rulerRight = q.ruler.down ? 0 : ra.x + RULER_BOX / 2 + RULER_W / 2 + 16;   // a ruler opening down leaves the top free
      var bandL = Math.max(HUD_X + HUD_W + 14, rulerRight), bandR = W - 150, ty = 50, sh = 58;
      if (bandR - bandL < 420) { bandL = Math.max(rulerRight, 16); bandR = W - 16; ty = 150; sh = 52; }
      var pw = CG.clamp(bandR - bandL, 260, 580);
      var tx = CG.clamp((gb.left + gb.right) / 2, bandL + pw / 2, Math.max(bandL + pw / 2, bandR - pw / 2));
      var drop = (1 - q.panel) * -30, py = ty + drop;
      R.glass(tx - pw / 2, py - sh / 2, pw, sh, sh / 2);
      /* said the way a friend beside you would, not set as a test question:
         the task is to pick a length, and after a miss, to pick another */
      var QUESTION = T(q.tries === 0 ? 'gap.questionFirst' : 'gap.questionAgain');
      var ic = sh * 0.58, qs = R.fit(QUESTION, sh * 0.37, pw - ic * 2.4 - 40, false, R.CW);
      c.font = R.font(qs, false, R.CW);
      var qw = c.measureText(QUESTION).width;
      var gx0 = tx - (qw + ic * 1.9) / 2;
      R.rulerIcon(gx0 + ic * 0.4, py, ic);
      R.flick(gx0 + ic * 0.72, py + ic * 0.38, ic * 0.5, 1, 0.6);
      R.text(QUESTION, gx0 + ic * 1.35, py + 1, qs, R.NAVY, 'left', 0, false, R.CW);
      R.flick(gx0 + ic * 1.35 + qw + ic * 0.08, py, ic * 0.62, 1);
      /* NO HINT after a miss - no legs on the plane, no formula: the game
         does not teach the distance formula, it sits inside the lesson that
         does. A miss costs a heart and asks again with new numbers; the
         only line under the question is the first gap's nudge. */
      var subY = py + sh / 2 + 26;
      /* THE NUDGE (first gap only, see G.learned): one line on what to do
         next, and the control it means lit and pointed at (drawRuler). It
         speaks to the interaction - open, pick, cut - never to the maths. */
      var ru = q.ruler;
      var step = !ru.target ? 'open' : ru.cursor && !q.wrong[ru.cursor] ? 'drop' : 'pick';
      var tip = G.learned[step] ? '' : T({ open: 'gap.tipOpen', pick: 'gap.tipPick', drop: 'gap.tipDrop' }[step]);
      q.tipStep = tip ? step : '';
      var tipY = subY;
      c.restore();
      /* the ruler is the last thing to arrive, and the first thing the player
         can touch — nothing is tappable until the question is fully up */
      if (q.rulerIn > 0.01) {
        c.save();
        c.globalAlpha = q.rulerIn;
        if (tip) {
          c.font = R.font(15, false, R.CW);
          var tw2 = c.measureText(tip).width + 40, tcx = CG.clamp(tx, tw2 / 2 + 16, W - tw2 / 2 - 16);
          R.glass(tcx - tw2 / 2, tipY - 17, tw2, 34, 17, { edgeW: 1.5 });
          R.text(tip, tcx, tipY + 1, 15, R.NAVY, 'center', 0, false, R.CW);
        }
        drawRuler(q);
        c.restore();
      }
    } else if (q.plank && (q.phase === 'spawn' || q.phase === 'place' || (q.phase === 'drive' && q.ruler.open > 0.02))) {
      q.tipStep = '';
      drawRuler(q);                    // folding away, the chosen number still in the box
    }
    if (q.fade > 0.005) {
      c.save();
      c.globalAlpha = q.fade;
      c.fillStyle = '#140E0A';
      c.fillRect(0, 0, W, H);
      c.restore();
    }
  }

  /* ruler controls: the arrow, a mark, or the keyboard. Nothing responds
     until the reveal has finished putting the ruler on screen — a keyboard
     player hammering Enter would otherwise answer a question still arriving. */
  function asking(q) { return q && q.phase === 'ask' && q.rulerIn > 0.5; }
  G.rulerToggle = function (open) {
    var q = G.gap;
    if (!asking(q)) return;
    q.ruler.target = open === undefined ? (q.ruler.target ? 0 : 1) : (open ? 1 : 0);
    if (q.ruler.target) learn('open');
    A.sfx('click');
  };
  /* highlight a mark; the plank does not drop until the button confirms */
  G.rulerPick = function (k) {
    var q = G.gap;
    if (!asking(q) || k < 1 || k > q.g.ruler || q.wrong[k]) return;
    if (!q.ruler.target) q.ruler.target = 1;
    q.ruler.cursor = k;
    learn('open'); learn('pick');
    A.sfx('click');
  };
  G.rulerConfirm = function () {
    var q = G.gap;
    if (!asking(q)) return;
    var k = q.ruler.cursor;
    if (q.ruler.target && k && !q.wrong[k]) G.answer(k);
  };
  /* the amber button: open when folded, drop when a mark is lit, fold otherwise */
  G.rulerButton = function () {
    var q = G.gap;
    if (!asking(q)) return;
    if (!q.ruler.target) G.rulerToggle(true);
    else if (q.ruler.cursor && !q.wrong[q.ruler.cursor]) G.rulerConfirm();
    else G.rulerToggle(false);
  };
  G.rulerKey = function (k) {
    var q = G.gap, ru;
    if (!asking(q)) return false;
    ru = q.ruler;
    var N = q.g.ruler;
    if (k === 'Enter') { G.rulerButton(); return true; }
    if (k === 'ArrowUp' || k === 'ArrowDown') {
      /* the highlight moves the way the key points: up the ruler is bigger
         numbers when it opens up, smaller when it hangs down */
      var n0 = CG.clamp((ru.cursor || 0) + ((k === 'ArrowUp') !== !!ru.down ? 1 : -1), 1, N);
      G.rulerPick(n0); if (!ru.target) ru.target = 1;
      return true;
    }
    if (k >= '0' && k <= '9') {
      /* two digits typed quickly make one number (1 then 3 -> 13) */
      var d = +k, n = ru.keyT > 0 ? ru.cursor * 10 + d : d;
      if (n < 1 || n > N) n = d;
      if (n >= 1 && n <= N) { G.rulerPick(n); ru.keyT = 0.8; }
      return true;
    }
    return false;
  };

  /* Chunky 3D pill: a dark lip underneath, a glossy gradient face, a fat ink
     outline, the icon on the left and an optional one-line promise under the
     label ("Hit the road and beat your best!"). */
  var BTN = {
    green:  { top: '#A6EC5E', bottom: '#4CAE22', lip: '#2E7A12', sub: '#EFFFD6' },
    orange: { top: '#FFD66E', bottom: '#FF9F1A', lip: '#C2620A', sub: '#FFF3D6' },
    blue:   { top: '#8CC4FF', bottom: '#3F7FD6', lip: '#244F93', sub: '#E3F0FF' }
  };
  var BTN_ALIAS = { '#7CB342': 'green', '#FFA000': 'orange', '#607D8B': 'blue' };

  /* The play button is a tyre: a chunky off-road wheel, bevelled lugs and a
     dark sidewall, with a big gold hub cap and a blue play triangle - the
     title's own two colours (CLIFF gold, CROSS blue) and the truck's. Green
     would sink into the grass band behind it, and orange and red already mean
     brake and wrong plank in this game. The tread turns slowly while the hub
     holds still, as if the button were about to roll off. Drawn procedurally
     so it stays crisp at every size and needs no extra art. */
  function tyreButton(id, cx, cy, rad, pulse) {
    var c = R.ctx, ink = Math.max(2.5, rad * 0.04), i;
    btn(id, cx - rad, cy - rad, rad * 2, rad * 2, rad);      // circular hit test
    c.save();
    c.translate(cx, cy);
    if (pulse) { var k = 1 + 0.025 * Math.sin(G.time * 4); c.scale(k, k); }
    /* --- the tread, turning --- */
    c.save();
    c.rotate(G.time * 0.7);
    var n = 18, lw = CG.TAU * rad * 0.88 / n * 0.78, lr = Math.max(2, rad * 0.06), body = rad * 0.78;
    /* one silhouette: an ink pass under everything, then the lugs and the
       sidewall filled over it, so the outline hugs lugs and grooves alike */
    c.lineJoin = 'round'; c.lineWidth = ink * 2; c.strokeStyle = R.INK;
    for (i = 0; i < n; i++) {
      c.save(); c.rotate(i / n * CG.TAU);
      R.roundRect(rad * 0.62, -lw / 2, rad * 0.38, lw, lr); c.stroke();
      c.restore();
    }
    c.beginPath(); c.arc(0, 0, body + ink, 0, CG.TAU); c.fillStyle = R.INK; c.fill();
    for (i = 0; i < n; i++) {
      c.save(); c.rotate(i / n * CG.TAU);
      R.roundRect(rad * 0.62, -lw / 2, rad * 0.38, lw, lr); c.fillStyle = '#585D69'; c.fill();
      /* the lug's bevelled top face: a light slab on the outer half */
      R.roundRect(rad * 0.815, -lw / 2 + ink, rad * 0.15, lw - ink * 2, lr * 0.7);
      c.fillStyle = '#8E93A3'; c.fill();
      R.roundRect(rad * 0.815, -lw / 2 + ink, rad * 0.15, (lw - ink * 2) * 0.3, lr * 0.5);
      c.fillStyle = 'rgba(255,255,255,0.22)'; c.fill();
      /* its shaded flank toward the sidewall */
      R.roundRect(rad * 0.74, -lw / 2 + ink, rad * 0.06, lw - ink * 2, lr * 0.5);
      c.fillStyle = 'rgba(0,0,0,0.2)'; c.fill();
      c.restore();
    }
    c.beginPath(); c.arc(0, 0, body, 0, CG.TAU);
    c.fillStyle = barGrad(-body, body * 2, '#454954', '#2B2E36'); c.fill();
    /* the sidewall's bead: a dark groove with a light rim, the 'seam' that shows it turning */
    c.beginPath(); c.arc(0, 0, rad * 0.69, 0, CG.TAU);
    c.lineWidth = rad * 0.04; c.strokeStyle = 'rgba(0,0,0,0.25)'; c.stroke();
    c.beginPath(); c.arc(0, 0, rad * 0.69, Math.PI * 1.05, Math.PI * 1.8);
    c.lineWidth = rad * 0.02; c.strokeStyle = 'rgba(255,255,255,0.14)'; c.stroke();
    c.restore();

    /* --- the hub, still --- */
    var hr = rad * 0.58;
    c.lineWidth = ink; c.strokeStyle = R.INK;
    c.beginPath(); c.arc(0, 0, hr + ink * 1.6, 0, CG.TAU); c.fillStyle = '#1F2229'; c.fill();   // dark well
    c.beginPath(); c.arc(0, 0, hr, 0, CG.TAU);
    c.fillStyle = barGrad(-hr, hr * 2, '#FFE96B', '#FFAD05'); c.fill(); c.stroke();
    c.beginPath(); c.arc(0, 0, hr * 0.86, 0, CG.TAU);
    c.lineWidth = Math.max(1.5, rad * 0.018); c.strokeStyle = 'rgba(190,105,0,0.55)'; c.stroke();
    c.beginPath(); c.ellipse(-hr * 0.22, -hr * 0.5, hr * 0.5, hr * 0.22, -0.35, 0, CG.TAU);
    c.fillStyle = 'rgba(255,255,255,0.42)'; c.fill();

    /* the play triangle: blue, rounded, nudged right to sit optically centred */
    var s = hr * 0.62, ox = hr * 0.1;
    function tri(dy) {
      c.beginPath();
      c.moveTo(ox - s * 0.8, -s * 0.92 + dy); c.lineTo(ox + s * 0.92, dy); c.lineTo(ox - s * 0.8, s * 0.92 + dy);
      c.closePath();
    }
    c.lineJoin = 'round'; c.lineWidth = ink * 1.1;
    tri(hr * 0.09); c.fillStyle = 'rgba(120,70,0,0.45)'; c.fill();
    tri(0); c.fillStyle = barGrad(-s, s * 2, '#4A8CF0', '#163C8C'); c.fill();
    c.strokeStyle = R.INK; c.stroke();
    c.beginPath(); c.moveTo(ox - s * 0.62, -s * 0.66); c.lineTo(ox + s * 0.3, -s * 0.16);
    c.lineWidth = Math.max(1.5, rad * 0.03); c.lineCap = 'round';
    c.strokeStyle = 'rgba(255,255,255,0.35)'; c.stroke();
    c.restore();
  }

  function bigButton(id, cx, cy, w, h, label, colour, icon, sub, pulse) {
    var c = R.ctx, P = BTN[BTN_ALIAS[colour] || colour] || BTN.green;
    btn(id, cx - w / 2, cy - h / 2, w, h, h / 2);
    c.save();
    if (pulse) {
      var k = 1 + 0.025 * Math.sin(G.time * 4);
      c.translate(cx, cy); c.scale(k, k); c.translate(-cx, -cy);
    }
    var x = cx - w / 2, y = cy - h / 2, r = h / 2, d = Math.max(5, h * 0.1), ol = Math.max(3, h * 0.05);
    c.beginPath(); c.ellipse(cx, y + h + d + 2, w * 0.46, h * 0.16, 0, 0, CG.TAU);
    c.fillStyle = 'rgba(10,8,20,0.28)'; c.fill();
    R.roundRect(x, y + d, w, h, r); c.fillStyle = P.lip; c.fill();
    c.lineWidth = ol; c.strokeStyle = R.INK; c.stroke();
    R.roundRect(x, y, w, h, r); c.fillStyle = barGrad(y, h, P.top, P.bottom); c.fill();
    c.stroke();
    /* gloss */
    R.roundRect(x + r * 0.45, y + h * 0.09, w - r * 0.9, h * 0.34, h * 0.17);
    c.fillStyle = 'rgba(255,255,255,0.3)'; c.fill();
    var tx = cx, im = icon && CG.img[icon], avail = w;
    if (im) {
      var s = h * 0.66, ix = x + h * 0.14;
      c.drawImage(im, ix, cy - s / 2, s, s);
      tx = (ix + s + x + w) / 2 - h * 0.06; avail = x + w - (ix + s) - h * 0.3;
    }
    var fs = R.fit(label, sub ? h * 0.36 : h * 0.44, avail, true);
    var ly = sub ? cy - h * 0.1 : cy + 1;
    R.text(label, tx, ly + 2, fs, 'rgba(59,31,12,0.5)', 'center', fs * 0.24, true);
    R.text(label, tx, ly, fs, '#FFFFFF', 'center', fs * 0.24, true);
    if (sub) {
      var ss = R.fit(sub, h * 0.155, avail);
      R.text(sub, tx, cy + h * 0.24, ss, P.sub, 'center', 0);
    }
    c.restore();
  }

  /* One size knob per screen: every layout below is designed at 900x720
     and scaled, so a phone gets the same composition, smaller. */
  function uiScale() {
    return CG.clamp(Math.min(R.W / 900, R.H / 720), 0.55, 1.3);
  }

  function dim(alpha) {
    var c = R.ctx;
    c.fillStyle = 'rgba(20,14,10,' + alpha + ')';
    c.fillRect(0, 0, R.W, R.H);
  }

  /* n filled of 3. `t` staggers them in on the stage-clear screen. */
  function starRow(cx, cy, n, size, t) {
    var c = R.ctx, im = CG.img.star, gap = size * 1.12, i, x, pop;
    for (i = 0; i < 3; i++) {
      x = cx + (i - 1) * gap;
      pop = t === undefined ? 1 : CG.clamp((t - 0.35 - i * 0.42) * 3.2, 0, 1);
      var sc = i < n ? (0.7 + 0.3 * pop) * (1 + 0.25 * Math.sin(pop * Math.PI)) : 1;
      c.save();
      c.translate(x, cy);
      c.scale(sc, sc);
      c.globalAlpha = i < n ? pop : 0.22;
      if (im) c.drawImage(im, -size / 2, -size / 2, size, size);
      else {
        c.beginPath(); c.arc(0, 0, size / 2, 0, CG.TAU);
        c.fillStyle = i < n ? '#FFD54F' : '#455A64'; c.fill();
      }
      c.restore();
    }
  }

  function drawTitle() {
    var c = R.ctx, W = R.W, H = R.H, u = uiScale();
    /* a soft wash behind the logo instead of dimming the whole scene */
    var wash = c.createLinearGradient(0, 0, 0, H * 0.42);
    wash.addColorStop(0, 'rgba(20,16,40,0.38)'); wash.addColorStop(1, 'rgba(20,16,40,0)');
    c.fillStyle = wash; c.fillRect(0, 0, W, H * 0.42);
    var ts = Math.min(124 * u, W * 0.14), ty = H * 0.17 + ts * 0.1;
    var tw = R.title([[T('title.word1'), 'gold'], [T('title.word2'), 'blue']], W / 2, ty, ts, { t: G.time });

    /* the tyre: big enough to be the one thing to press; no label, the triangle says it */
    var pr = 84 * u, py = Math.min(H * 0.78, H - pr - 30 * u);
    tyreButton('play', W / 2, py, pr, true);

    iconBtn('mute', W - 46, 46, 26, G.muted ? 'soundOff' : 'soundOn', false);
  }

  /* ------------------------------------------------------------ stage map */
  function drawSelect() {
    var c = R.ctx, W = R.W, H = R.H, n = CG.Stages.length, u = uiScale();
    dim(0.5);
    var ts = Math.min(62 * u, W * 0.08);
    R.title([[T('select.title1'), 'gold'], [T('select.title2'), 'blue']], W / 2, H * 0.1, ts, { wobble: 0.6 });
    R.ribbon(T('select.stars', { n: G.totalStars(), total: n * 3 }), W / 2, H * 0.1 + ts * 0.85, Math.max(12, 16 * u));

    var cols = 4, rows = Math.ceil(n / cols);
    var gap = 18, cw = Math.min(250, (W - 80 - gap * (cols - 1)) / cols), ch = 118;
    var gx = (W - (cw * cols + gap * (cols - 1))) / 2, gy = H * 0.225;

    for (var i = 0; i < n; i++) {
      var st = CG.Stages[i], open = G.unlocked(i), rec = G.record(st.id);
      var x = gx + (i % cols) * (cw + gap), y = gy + Math.floor(i / cols) * (ch + gap);
      if (open) btn('s' + i, x, y, cw, ch, 16);
      R.card(x, y, cw, ch, 16, open ? { edge: 'rgba(198,242,106,0.55)' }
                                    : { top: 'rgba(30,36,52,0.6)', bottom: 'rgba(20,24,36,0.62)' });
      /* number medallion */
      c.beginPath(); c.arc(x + 26, y + 30, 16, 0, CG.TAU);
      c.fillStyle = open ? barGrad(y + 14, 32, '#FFE680', '#FFAE1F') : '#4A5468'; c.fill();
      c.lineWidth = 3; c.strokeStyle = R.INK; c.stroke();
      R.text(String(st.id), x + 26, y + 31, 19, open ? '#FFFFFF' : '#9AA6BA', 'center', open ? 4 : 0, true);
      var nm = open ? stageName(st) : T('select.locked');
      R.text(nm, x + 50, y + 31, R.fit(nm, 19, cw - 60, true), open ? '#FFF' : '#8190A8', 'left', 0, true);
      if (open) {
        R.text(stageSub(st), x + 16, y + 58, 13, '#A9C3E6', 'left', 0);
        starRow(x + cw / 2, y + 86, rec ? rec.s : 0, 26);
        if (rec) R.text(fmtTime(rec.t), x + cw - 14, y + 108, 13, '#C6F26A', 'right', 0);
      } else {
        R.text(T('select.clearFirst', { n: i }), x + 16, y + 78, 14, '#8190A8', 'left', 0);
      }
    }

    var by = Math.min(gy + rows * (ch + gap) + 30, H - 56), bh = 64 * Math.min(1, u);
    if (G.endlessOpen()) {
      bigButton('endless', W / 2 - 130, by, 240, bh, T('select.endless'), 'orange', null);
      bigButton('home', W / 2 + 130, by, 200, bh, T('select.home'), 'blue', 'iconHome');
    } else {
      bigButton('home', W / 2, by, 240, bh, T('select.home'), 'blue', 'iconHome');
    }
    iconBtn('mute', W - 46, 46, 26, G.muted ? 'soundOff' : 'soundOn', false);
  }

  /* A hanging wooden headline sign with up to two title lines and a strap
     under it. Returns the y of the sign's bottom edge. */
  function headline(l1, g1, l2, g2, strap, u) {
    var W = R.W, H = R.H;
    var sw = Math.min(560 * u, W - 32), s1 = R.fit(l1, 60 * u, sw * 0.96, true);
    var s2 = l2 ? R.fit(l2, 46 * u, sw * 0.96, true) : 0;
    var sh = s1 * 1.35 + (l2 ? s2 * 1.2 : 0) + 34 * u;
    var cy = Math.max(sh / 2 + 18 * u, H * 0.06 + sh / 2);
    R.woodSign(W / 2, cy, sw, sh, { ropes: true });
    var y1 = cy - sh / 2 + 18 * u + s1 * 0.62;
    R.title(l1, W / 2, y1, s1, { grad: g1, t: G.time });
    if (l2) R.title(l2, W / 2, y1 + s1 * 0.62 + s2 * 0.72, s2, { grad: g2, wobble: 0.5 });
    if (strap) R.ribbon(strap, W / 2, cy + sh / 2 + 4 * u, Math.max(12, 17 * u), { maxW: W - 40 });
    return cy + sh / 2;
  }

  /* -------------------------------------------------------------- the win
     YOU DID IT: the sign comes down over the first second, while the truck
     is still rolling to a stop under it, then the hearts held come up as
     stars. A mission (endless) offers the same two ways on as running out
     of hearts does; a stage keeps its map. */
  var WIN_IN = 0.9;
  function drawWin() {
    var c = R.ctx, W = R.W, H = R.H, st = G.stage, u = uiScale();
    var k = CG.clamp(G.winT / WIN_IN, 0, 1);
    k = k * k * (3 - 2 * k);
    c.save();
    c.globalAlpha = k;
    dim(0.5);
    var bottom = headline(T('win.title'), 'green', null, null, st ? stageName(st) : T('win.mission'), u);
    var sy = bottom + 70 * u;
    starRow(W / 2, sy, G.stars, 76 * u, Math.max(0, G.winT - WIN_IN * 0.6));

    /* one line of results: the planks, and how many fitted first time */
    var pw = Math.min(470 * u, W - 32), px = W / 2 - pw / 2, rh = 34 * u, ly = sy + 70 * u;
    R.card(px, ly - 26 * u, pw, rh + 18 * u, 16 * u);
    R.label(T('win.planks'), px + 24 * u, ly, 12 * u);
    R.text(G.firstTry + ' / ' + G.gapCount, px + pw * 0.58, ly, 22 * u,
           G.firstTry === G.gapCount ? '#C6F26A' : '#FFFFFF', 'right', 0);
    R.text(T('win.firstTry'), px + pw - 20 * u, ly, 13 * u, '#8FA6C6', 'right', 0);
    var by = ly + rh + 20 * u;
    if (st && G.newBest) R.badge(T('win.newBest'), W / 2, by + 14 * u, 17 * u, G.winT);

    var bh = 76 * u, y2 = Math.min(by + 80 * u, H - 150 * u);
    /* the buttons arrive with the sign, and are not tappable before they
       can be seen: the gas finger is still on the screen at the line */
    if (k < 0.5) { c.restore(); return; }
    if (st) {
      var last = G.stageIdx >= CG.Stages.length - 1;
      bigButton(last ? 'map' : 'next', W / 2 - 115 * u, y2, 250 * u, bh,
                T(last ? 'win.map' : 'win.next'), 'green', 'iconPlay', last ? null : T('win.nextSub'), true);
      bigButton('retry', W / 2 + 125 * u, y2, 210 * u, bh, T('win.retry'), 'orange', 'iconRestart', T('win.retrySub'));
      bigButton('map', W / 2, y2 + bh + 22 * u, 220 * u, 56 * u, T('win.stageMap'), 'blue', 'iconHome');
    } else {
      bigButton('retry', W / 2, y2, 340 * u, bh, T('win.playAgain'), 'green', 'iconRestart', T('win.playAgainSub'), true);
      bigButton('learn', W / 2, y2 + bh + 26 * u, 340 * u, bh, T('win.lesson'), 'blue', 'iconHome',
                T('win.lessonSub'));
    }
    c.restore();
  }

  /* PAUSED: no menu - the world just holds still under a light shade, and
     the forward pedal (drawn over it by drawHUD) glows until it is pressed. */
  function drawPaused() {
    dim(0.22);
  }

  /* OUT OF HEARTS. The run is over, and there are exactly two ways on,
     said plainly: back to the lesson the game sits inside, or another run
     at the mission. Nothing to read but that - no score to compare, no
     stats to weigh; the hearts were the whole account. */
  function drawOver() {
    var c = R.ctx, W = R.W, H = R.H, u = uiScale();
    dim(0.5);
    var bottom = headline(T('over.title'), 'gold', null, null, T('over.strap'), u);
    var y = bottom + 60 * u;
    /* the three, all grey: what ran out */
    var hi = CG.img.heart, hs = 46 * u, i;
    for (i = 0; i < LIVES; i++) {
      c.save();
      c.globalAlpha = 0.35;
      if (hi) c.drawImage(hi, W / 2 + (i - 1) * hs * 1.3 - hs / 2, y - hs / 2, hs, hs);
      c.restore();
    }
    if (G.crossed > 0) {
      R.label(T('over.fitted', { n: G.crossed }), W / 2, y + hs * 0.9, 13 * u, '#FFE7A8', 'center');
    }

    var ty = Math.min(y + hs + 80 * u, H - 190 * u), bh = 86 * u;
    bigButton('learn', W / 2, ty, 340 * u, bh, T('over.lesson'), 'blue', 'iconHome', T('over.lessonSub'), true);
    bigButton('retry', W / 2, ty + bh + 26 * u, 340 * u, bh, T('over.playAgain'), 'green', 'iconRestart',
              T('over.playAgainSub'));
  }

  /* a wrong plank: the edges of the screen flush red for a moment */
  function redFlash(k) {
    var c = R.ctx, W = R.W, H = R.H;
    var g = c.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.32, W / 2, H / 2, Math.max(W, H) * 0.72);
    g.addColorStop(0, 'rgba(255,50,40,0)');
    g.addColorStop(1, 'rgba(255,50,40,' + (0.34 * k).toFixed(3) + ')');
    c.save(); c.fillStyle = g; c.fillRect(0, 0, W, H); c.restore();
  }

  /* ② the falling plank, with two fading copies of where it just was */
  function drawFall(q) {
    var c = R.ctx;
    for (var g = 2; g >= 1; g--) {
      var gp = G.fallPose(Math.max(0, q.t - g * 0.045));
      gp.alpha = 0.16 * (3 - g);
      R.drawPlank(gp, null);
    }
    R.drawPlank(G.plankPose(), q.t < PLACE_T * 0.78 ? T('gap.units', { n: q.len }) : null);
  }

  /* ③ the landing: short bursts of light either side of the plank's middle */
  function drawImpact(q) {
    var c = R.ctx, p = q.plank, k = q.t / 0.45, z = R.cam.z;
    var mx = R.sx((p.x0 + p.x1) / 2), my = R.sy((p.y0 + p.y1) / 2) - 18 * z;
    c.save();
    c.globalAlpha = 1 - k;
    c.strokeStyle = '#FFD23F'; c.lineCap = 'round'; c.lineWidth = Math.max(3, 4 * z);
    var r0 = (14 + 26 * ease(k)) * z, r1 = r0 + 16 * z, a = [-2.35, -2.0, -1.65, -1.49, -1.14, -0.79];
    c.beginPath();
    for (var i = 0; i < a.length; i++) {
      var ux = Math.cos(a[i]), uy = Math.sin(a[i]);
      c.moveTo(mx + ux * r0 * 1.6, my + uy * r0); c.lineTo(mx + ux * r1 * 1.6, my + uy * r1);
    }
    c.stroke();
    c.restore();
  }

  /* The live gap's machine as the renderer wants it: the animation state,
     the blade's blur from its speed, and the board on the belt while it is
     being cut. */
  function machineView(q) {
    var m = q.mach, f = R.machineFrame(q.g);
    return { sink: m.sink, ang: m.ang, cog: m.cog, roll: m.roll, lever: m.lever, lamp: m.lamp,
             jolt: m.jolt, squash: m.squash, clock: G.clock,
             blur: CG.clamp((m.spin - MACH.BLUR0) / (MACH.BLUR1 - MACH.BLUR0), 0, 1),
             plank: q.phase === 'spawn' && q.run && f ? { pose: feedPose(q, q.t), clipX: f.bladeX } : null };
  }

  /* The plank machine: only the live gap's, and only once the truck has
     stopped and it has come up out of the road (stepMachine) - every other
     chasm's waits underground, so the approach shows the hole and nothing
     else. While a board is fed out, its count so far rides above it - the
     same number the straps show, said out loud. */
  function drawMachines(src, q) {
    if (!src || !src.chasms.length || !q) return;
    R.drawMachine(q.g, machineView(q));
    var f = q.run && q.phase === 'spawn' ? R.machineFrame(q.g) : null;
    if (f && q.run.units > 0) {
      var p = feedPose(q, q.t), front = p.x + p.len / 2, z = R.cam.z;
      var lx = (Math.max(f.bladeX + f.bladeR, front - p.len) + front) / 2, n = q.run.units;
      var pop = 1 + 0.3 * CG.clamp(1 - (q.t - q.run.unitT) / 0.18, 0, 1);   // each count lands with a pop
      R.haloText(T('gap.units', { n: n }), R.sx(lx), R.sy(p.y - 26), 19 * z * pop,
                 '#FFFFFF', 'center', 'rgba(27,42,94,0.7)');
    }
  }

  /* --------------------------------------------------------------- draw */
  function draw(dt) {
    var c = R.ctx;
    buttons.length = 0;
    R.begin();
    var q = G.gap;
    var chasmSrc = G.track || (G.mode === 'endless' ? CG.Endless : null);
    R.drawBackground();
    R.horizon();
    R.drawGroundHaze();
    R.drawProps(true);
    R.drawFocusMute();
    if (chasmSrc) R.drawChasmDepth(chasmSrc);
    R.drawTerrain();
    if (chasmSrc) R.drawChasmWalls(chasmSrc);
    R.drawProps(false);
    R.drawFinish(G.track ? G.track.finishX : (G.mode === 'endless' ? CG.Endless.finishX : 0), G.time);
    R.drawFX(false);
    R.legsUp = false;
    R.sheet = null;
    if (q) R.drawGrid(q.g, q.grid, q.axes);          // the plane, over the world
    drawMachines(chasmSrc, q);                        // on the plane, like the truck
    R.drawPlanks(q && q.plank);
    if (q && q.plank && q.phase !== 'ask') {
      /* the length is labelled while the plank falls into place; once down
         it is road, and the label would only peek out from under the truck.
         On the belt (spawn) it is drawn by the machine, clipped at the blade. */
      if (q.phase === 'place') drawFall(q);
      else if (q.phase !== 'spawn') {
        var pp = G.plankPose();
        pp.bad = q.bad ? CG.clamp(q.bad.t / 0.12, 0, 1) : 0;
        /* the slam bounces it once, a hand's breadth, before it lies still -
           drawn only: the road it has become does not move */
        if (q.phase === 'drive' && q.t < 0.3) pp.y -= 7 * Math.sin(Math.PI * q.t / 0.3) * (1 - q.t / 0.3);
        R.drawPlank(pp, null);
      }
    }
    if (q && q.phase === 'intro') drawIntroWorld(q);   // the broken road, marked
    if (q) R.drawGapPoints(q.g, { a: q.ptA, b: q.ptB, la: q.lblA, lb: q.lblB, ha: q.hiA, hb: q.hiB,
                                  span: q.plane });
    if (G.state === 'play' || G.state === 'paused') drawBlocker();
    R.drawVehicle(G.v, dt);
    if (q && q.bad) R.drawBadMark(q.bad);
    R.calm = CG.approach(R.calm, q && q.phase !== 'done' && G.state === 'play' ? 1 : 0, 3, dt || 0.016);
    R.drawFX(true);
    R.drawForeground();
    R.drawGrade();
    if (q) R.drawVignette((R.sx(q.g.ax) + R.sx(q.g.bx)) / 2, R.sy(Math.min(q.g.ay, q.g.by)) - 0.08 * R.H);
    R.drawWeather(dt);
    R.drawTexts();

    if (G.state === 'title') drawTitle();
    else if (G.state === 'select') drawSelect();
    else {
      if (G.state === 'paused') drawPaused();          // under the HUD: the glowing pedal must read
      drawHUD(dt);
      if (q && G.state === 'play') drawGapUI();
      if (q && q.bad && q.bad.t < 0.45) redFlash(1 - q.bad.t / 0.45);
      if (q && q.plank && q.plank.kind === 'exact' && q.phase === 'drive' && q.t < 0.45) drawImpact(q);   // only a fit gets the burst
      if (G.state === 'over') drawOver();
      else if (G.state === 'win') drawWin();
    }
  }

  /* --------------------------------------------------------------- loop */
  var last = 0, emaMs = 8, adjustAt = 0, showStats = false;

  /* If frames run long, render fewer pixels rather than dropping frames. */
  function autoQuality(now, ms) {
    emaMs += (ms - emaMs) * 0.1;
    if (now < adjustAt) return;
    if (emaMs > 21 && R.quality > 0.56) {
      adjustAt = now + 1600; R.setQuality(R.quality - 0.15); emaMs = 12;
    } else if (emaMs < 10.5 && R.quality < 1) {
      adjustAt = now + 3000; R.setQuality(R.quality + 0.15); emaMs = 12;
    }
  }

  function frame(ts) {
    var t0 = performance.now();
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
    last = ts;
    G.clock += dt;                     // wall time, for what animates even while paused
    lessonTick(dt);
    if (G.state === 'play') {
      updatePlay(dt);
      updateCamera(dt, false);
      FX.update(dt);
    } else if (G.state === 'title' || G.state === 'select') {
      G.time += dt;
      stepPhysics(dt, false);
      updateCamera(dt * 0.6, false);
      FX.update(dt);
    } else if (G.state === 'win') {
      G.winT += dt;
      stepPhysics(dt, false, SLOWDOWN);      // the driver eases to a stop
      updateCamera(dt, false);
      FX.update(dt);
      A.drive(0, 0, 0, false);
      /* one chime per star, timed to the pop in starRow() */
      var want = 0;
      for (var si = 0; si < G.stars; si++) if (G.winT > 0.35 + si * 0.42) want++;
      if (want > G.starsPopped) { G.starsPopped = want; A.sfx('star'); }
    } else if (G.state === 'over') {
      G.time += dt;
      stepPhysics(dt, false);
      updateCamera(dt, false);
      FX.update(dt);
      A.drive(0, 0, 0, false);
    }
    if (G.state !== 'play' && A.screechV) A.screechRelease();
    CG.World.prune(R.cam.x - R.W / R.cam.z);
    draw(dt);
    if (showStats) {
      R.panel(R.W / 2 - 108, 8, 216, 30, 10, 'rgba(43,33,24,0.6)');
      R.text(emaMs.toFixed(1) + ' ms   q' + R.quality.toFixed(2) +
             '   ' + Math.round(1000 / Math.max(0.1, emaMs)) + ' fps',
             R.W / 2, 23, 17, '#AED581', 'center', 3);
    }
    autoQuality(t0, performance.now() - t0);
    requestAnimationFrame(frame);
  }

  /* -------------------------------------------------------------- input */
  function hit(b, x, y) {
    if (b.r >= b.h / 2) {                      // circular button
      var cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      return Math.hypot(x - cx, y - cy) <= b.w / 2 + 6;
    }
    return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
  }

  function press(id) {
    A.sfx('click');
    if (id === 'rulopen') { G.rulerButton(); return; }
    if (id.slice(0, 3) === 'rul') {
      var k = +id.slice(3);
      if (G.gap && G.gap.ruler.cursor === k) G.rulerConfirm(); else G.rulerPick(k);   // twice = go
      return;
    }
    if (id.charAt(0) === 's' && id.length > 1 && id !== 'select') {
      var i = +id.slice(1);
      if (i === i && G.unlocked(i)) G.startStage(i);
      return;
    }
    switch (id) {
      case 'play': G.startEndless(); A.music(true); break;
      case 'retry': G.restart(); break;
      case 'learn': G.toLearn(); break;
      case 'lessonskip': lessonOver(); break;
      case 'next': G.startStage(G.stageIdx + 1); break;
      case 'map': G.toSelect(); break;
      case 'endless': G.startEndless(); break;
      case 'home': G.toTitle(); break;
      case 'pause': if (G.state === 'play') G.state = 'paused'; break;
      case 'resume': if (G.state === 'paused') G.state = 'play'; break;
      case 'mute':
        G.muted = !G.muted; A.setMuted(G.muted); save(); break;
    }
  }

  function toLogical(e) {
    var r = R.canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * R.W, y: (e.clientY - r.top) / r.height * R.H };
  }

  function onDown(e) {
    A.init(); A.resume();
    var p = toLogical(e), i, b;
    try { R.canvas.setPointerCapture && R.canvas.setPointerCapture(e.pointerId); } catch (err) {}   // a synthetic pointer has no capture
    /* UI first */
    for (i = buttons.length - 1; i >= 0; i--) {
      b = buttons[i];
      if (b.id === 'gas' || b.id === 'brake') continue;
      if (hit(b, p.x, p.y)) { pointers[e.pointerId] = b.id; press(b.id); return; }
    }
    /* a pause has no menu: a touch carries on, and on the forward side it
       also drives - which is what the glowing pedal is asking for */
    if (G.state === 'paused') press('resume');
    /* the road being explained: a tap moves it on */
    if (G.state === 'play' && G.gap && G.gap.phase === 'intro') { introAdvance(); return; }
    if (G.state !== 'play') {
      /* a tap anywhere on the title screen starts a run */
      if (G.state === 'title') { pointers[e.pointerId] = 'play'; press('play'); }
      return;
    }
    if (G.gap && G.gap.phase !== 'drive' && G.gap.phase !== 'done') return;   // pedals are away
    /* whole bottom half is a pedal — forgiving on touch */
    var side = p.x > R.W / 2 ? 'gas' : 'brake';
    pointers[e.pointerId] = side;
    G.input[side] = 1;
  }

  function onUp(e) {
    var id = pointers[e.pointerId];
    delete pointers[e.pointerId];
    if (id === 'gas' || id === 'brake') {
      /* only release if no other pointer still holds that side */
      for (var k in pointers) if (pointers[k] === id) return;
      G.input[id] = 0;
    }
  }

  function syncKeys() {
    G.input.gas = (keys.right || keys.space) ? 1 : 0;
    G.input.brake = keys.left ? 1 : 0;
  }

  function onKey(e, dn) {
    var k = e.key;
    if (dn && G.state === 'play' && G.gap && G.gap.phase === 'ask' && G.rulerKey(k)) {
      e.preventDefault(); return;
    }
    if (dn && G.state === 'play' && G.gap && G.gap.phase === 'intro' && (k === 'Enter' || k === ' ' || k === 'ArrowRight')) {
      introAdvance(); e.preventDefault(); return;
    }
    /* paused: forward carries on (and keeps driving while it is held) */
    if (dn && G.state === 'paused' && /^(ArrowRight|ArrowUp|[dDwW ])$/.test(k)) press('resume');
    if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = dn;
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = dn;
    else if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') keys.space = dn;
    else if (dn && (k === 'p' || k === 'P' || k === 'Escape')) {
      press(G.state === 'paused' ? 'resume' : 'pause');
    } else if (dn && (k === 'r' || k === 'R')) {
      if (G.state !== 'title') press('retry');
    } else if (dn && (k === 'm' || k === 'M')) press('mute');
    else if (dn && (k === 'Enter') && G.state !== 'play') {
      if (G.state === 'title') press('play');
      else if (G.state === 'win') press(!G.stage ? 'retry' : G.stageIdx >= CG.Stages.length - 1 ? 'map' : 'next');
      else if (G.state === 'select') press('s' + G.stageIdx);
      else press('retry');
    } else return;
    if (dn) { A.init(); A.resume(); }
    e.preventDefault();
    syncKeys();
  }

  /* --------------------------------------------------------------- boot */
  /* Dev hooks: ?seed=123 replays an exact track, ?demo=1 auto-drives. */
  function urlOpts() {
    var o = {}, q = (location.search || '').replace(/^\?/, '').split('&');
    for (var i = 0; i < q.length; i++) {
      var kv = q[i].split('=');
      if (kv[0]) o[kv[0]] = kv.length > 1 ? decodeURIComponent(kv[1]) : '1';
    }
    return o;
  }

  CG.boot = function () {
    CG.i18n.refresh();                    // over http: the JSON itself, not the built copy
    var canvas = document.getElementById('c');
    R.attach(canvas);
    load();
    A.muted = G.muted;

    window.addEventListener('resize', function () { R.resize(); });
    window.addEventListener('orientationchange', function () { setTimeout(R.resize, 120); });
    canvas.addEventListener('pointerdown', onDown);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    window.addEventListener('keydown', function (e) { onKey(e, true); });
    window.addEventListener('keyup', function (e) { onKey(e, false); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && G.state === 'play') G.state = 'paused';
    });

    var fill = document.getElementById('fill'), boot = document.getElementById('boot');
    var msg = document.getElementById('bootmsg');

    /* Never fail to a blank canvas — say what broke, on screen. */
    window.addEventListener('error', function (e) {
      boot.classList.remove('gone');
      boot.style.display = 'flex';
      msg.textContent = T('boot.error', { msg: e.message || e.type }) +
        (e.lineno ? T('boot.errorLine', { n: e.lineno }) : '');
    });

    /* the canvas UI measures text every frame; make sure it measures the
       real faces, not the fallback, from the first title screen on */
    if (document.fonts && document.fonts.load) {
      document.fonts.load('40px "Lilita One"');
      document.fonts.load('900 20px "Nunito"');
    }

    var opts = urlOpts();
    showStats = !!opts.stats;
    if (opts.q) R.setQuality(+opts.q);
    if (opts.learn) G.learnUrl = opts.learn;          // an external lesson instead of learn/
    if (opts.lesson === '1') G.lesson.force = true;   // play the lesson again at the first chasm
    else if (opts.lesson === '0') G.lesson.off = true;  // never open it (the tools)
    CG.loadAssets(
      function (p) { fill.style.width = Math.round(p * 100) + '%'; },
      function (failed) {
        if (failed.length) msg.textContent = T('boot.missing', { n: failed.length });
        CG.loadThemes();
        /* ?season=winter&clock=0.95&weather=snow pins the scene, for looking */
        if (opts.season || opts.clock || opts.weather) {
          CG.Env.force = { season: opts.season || undefined,
                           clock: opts.clock !== undefined ? +opts.clock : undefined,
                           weather: opts.weather || undefined };
        }
        G.toTitle();
        if (opts.demo || opts.seed || opts.stage) {
          if (opts.seed) {
            /* ?seed=123 is an endless replay of one exact noise field */
            G.startEndless();
            G.seed = (+opts.seed) | 0 || 1;
            CG.Terrain.setSeed(G.seed);
            CG.Terrain.setTrack(null);
            CG.Endless.reset(G.seed);
            CG.World.init(G.seed, null);
            G.v.reset(160);
            R.cam.x = G.v.x; R.cam.y = G.v.y;
          } else {
            G.startStage(((+opts.stage) | 0 || 1) - 1);
          }
          if (opts.demo) G.input.gas = 1;
        }
        requestAnimationFrame(frame);
        setTimeout(function () {
          boot.classList.add('gone');
          setTimeout(function () { boot.style.display = 'none'; }, 500);
        }, failed.length ? 900 : 180);
      }
    );
  };
})(CG);

CG.boot();
</script>

       under the fade (resetGap). */
    var down = ph === 'drive' || ph === 'fail' || ph === 'done' || (ph === 'place' && t > PLACE_T * 0.3);
    if (down && m.sink < 1) {
      if (m.sink === 0) {
        A.sfx('sink');                 // the hydraulics let go
        FX.poof(f.left + 30, q.g.ay, 90); FX.poof(f.right - 30, q.g.ay, 90);
      }
      m.sink = Math.min(1, m.sink + dt / MACH.SINK_T);
      m.jolt = Math.max(m.jolt, 2.5);
      m.dustT -= dt;
      if (m.dustT <= 0) {
        m.dustT = 0.05;
        FX.dust(CG.lerp(f.left, f.right, Math.random()), q.g.ay, (Math.random() - 0.5) * 120, -30, 0.7);
      }
    }
  }

  /* THE STOP, AND THE REVEAL AFTER IT.

     The stop is ONE braking action. The moment the truck is within braking
     distance of its hold the driver stands on the brake and keeps it there:
     the speed it may still have with `rem` to go is what STOP_DECEL can
     stop from (v = sqrt(2 a rem)), and the tyres are held to that line -
     the tyre model gives the screech, the smoke and the nose-dive, the
     scripted part only makes sure it stands exactly on the mark instead of
     rolling the last metres or meeting the barrier. Dust pours off both
     tyres the whole way and bursts as it stands.

     Then the question is built in front of the player one piece at a time,
     each with its own cue, from the instant the truck stands:
       mach   the plank machine rises out of the road ahead of it
       ptA/B  the two points land on the lips, one after the other
       pane   the coordinate plane is drawn in behind them, then its axes
       lblA/B each point's coordinates light up beside it
       ask    the question
       ruler  the console and ruler, the first thing that can be touched
     Everything arriving at once buried the stop it was supposed to be the
     answer to; a beat that follows from the last is what makes it one
     event. A retry starts again from the points (resetGap): the machine and
     the plane are already there. */
  var STOP_DECEL = 620;                                  // px/s^2: a hard stop, ~12 m/s^2
  var REVEAL = { mach: 0.1, ptA: 0.75, ptB: 0.95, pane: 1.2, axes: 1.4, lblA: 1.7, lblB: 1.9, ask: 2.2, ruler: 2.5 };
  var REVEAL_T = 0.3, HILITE_T = 0.9;

  /* How far a truck at speed `sp` needs to stand on its mark. */
  function brakeRoom(sp) { return sp * sp / (2 * STOP_DECEL) + 40; }

  function revealAt(q, t0) {
    return q.out * CG.clamp((q.reveal - t0) / REVEAL_T, 0, 1);
  }

  function nextChasm() {
    var cs = G.track ? G.track.chasms : (G.mode === 'endless' ? CG.Endless.chasms : []), i;
    for (i = 0; i < cs.length; i++) if (!cs[i].solved) return cs[i];
    return null;
  }

  /* The truck's hold, re-planned for THIS screen and this question's lines
     of tips (Gaps.holdFor plans a 16:9 landscape by default, which is what
     the stage test drives): a phone held upright frames the row tighter, and
     needs the truck further back for the console to fit beside the saw.
     Early enough that the auto-brake just aims for it. */
  function replanHold(q) {
    var g = q.g;
    g.stopX = g.ax - CG.Gaps.holdFor(g, R.W, R.H, subLines(q));
  }

  function armGap(v) {
    if (G.gap) return;
    var g = nextChasm();
    if (!g || v.x > g.bx) return;
    /* the pedals go the moment the truck is within braking distance of its
       hold - never earlier than armX, so a fast truck gets the whole run */
    var sp = Math.max(0, v.forwardSpeed());
    if (v.x < Math.max(g.armX, g.stopX - brakeRoom(sp))) return;
    G.gap = { g: g, phase: 'approach', t: 0, plank: null, len: 0, tries: 0,
              wrong: {}, fade: 0, tipped: false, pose0: null,
              grid: 0, axes: 0, ptA: 0, ptB: 0, lblA: 0, lblB: 0, hiA: 0, hiB: 0, plane: 1,
              panel: 0, rulerIn: 0, skidT: 0, retry: false, lost: false,
              reveal: 0, out: 1, beat: 0, run: null, mach: newMachine(false),
              ruler: { open: 0, target: 0, cursor: 0, value: 0, keyT: 0, down: false } };
    replanHold(G.gap);
    /* The driver sees it and stands on the brake. The faster the arrival, the
       bigger the moment: the screech and the gravel under it, smoke off both
       tyres, a kick through the camera. A truck already crawling gets the
       sound and little else. */
    var lv = CG.clamp(sp / 700, 0.3, 1);
    A.brakeGrab(lv);
    if (sp > 90) {
      R.shake = Math.max(R.shake, Math.min(11, 3 + sp * 0.022));
      for (var k = 0; k < 10; k++) {
        var w = v.wheels[k & 1];
        var px = w.contact ? w.cpx : v.x, py = w.contact ? w.cpy : v.y + 30;
        FX.dust(px, py, -sp * (0.2 + Math.random() * 0.2), -20 - Math.random() * 50,
                0.9 + Math.random() * 0.6);
      }
    }
  }

  /* THE TRUCK STANDS: the brakes let go with a hiss, a thud through the
     springs, dust bursting off both tyres and rolling on ahead of them with
     the momentum the truck just lost, and a kick through the camera. */
  function stopBurst(v, sp) {
    var k = CG.clamp(sp / 500, 0.35, 1), i, w;
    A.brakeStop(k);
    R.shake = Math.max(R.shake, 4 + 6 * k);
    for (i = 0; i < 2; i++) {
      w = v.wheels[i];
      var px = w.contact ? w.cpx : v.x + (i ? 60 : -60), py = w.contact ? w.cpy : v.y + 30;
      FX.poof(px + 10, py + 2, 120 + 60 * k, 0.5);
      for (var d = 0; d < 5; d++) {
        FX.dust(px, py, 60 + 180 * k * Math.random(), -30 - Math.random() * 50, 0.8 + 0.6 * k);
      }
    }
  }

  /* Park the car dead: no creep while the player is thinking. */
  function holdCar(v) {
    v.vx = 0; v.vy = 0; v.av = 0;
    v.wheels[0].omega = 0; v.wheels[1].omega = 0;
  }

  function clearCrash(v) {
    v.crashed = false; v.crashReason = ''; v.upsideTime = 0; v.headLean = 0;
  }

  /* Per-frame control of the sequence. Returns an input override for the
     physics, or null when the player has the pedals. */
  /* The speed the truck may still have with `rem` px to its mark: the hard
     stop's own curve, bent down to a walk over the last few px so it stands
     on the mark rather than at the barrier. */
  function stopSpeed(rem) {
    return Math.min(Math.sqrt(2 * STOP_DECEL * Math.max(0, rem)), rem * 4 + 16);
  }

  function gapControl(dt) {
    var q = G.gap, g = q.g, v = G.v;
    q.t += dt;
    /* nothing of the question exists until the car has stopped - and, the
       first time, until the road has been explained and the lesson had */
    if (q.phase !== 'approach' && q.phase !== 'intro' && q.phase !== 'lesson') q.reveal += dt;
    q.out = CG.approach(q.out, q.phase === 'done' ? 0 : 1, 2.4, dt);
    /* THE PLANE GOES WITH THE ANSWER: the moment GO is pressed the sheet,
       the rules and the axes fade, and only the two points stay - so the
       board being cut, swung across and fitted between them is the whole
       picture. It comes back with the question after a miss. */
    var asking = q.phase === 'ask' || q.phase === 'approach' || q.phase === 'intro' || q.phase === 'lesson';
    q.plane = CG.approach(q.plane, asking ? 1 : 0, asking ? 6 : 3.4, dt);
    var up = q.retry ? q.out : 0;                          // a retry's plane is already up
    q.grid = Math.max(up, revealAt(q, REVEAL.pane)) * q.plane;
    q.axes = Math.max(up, revealAt(q, REVEAL.axes)) * q.plane;
    q.ptA = revealAt(q, REVEAL.ptA);
    q.ptB = revealAt(q, REVEAL.ptB);
    q.lblA = revealAt(q, REVEAL.lblA);
    q.lblB = revealAt(q, REVEAL.lblB);
    /* each label lights up as it lands and the light dies over HILITE_T */
    q.hiA = q.reveal > REVEAL.lblA ? CG.clamp(1 - (q.reveal - REVEAL.lblA) / HILITE_T, 0, 1) * q.out : 0;
    q.hiB = q.reveal > REVEAL.lblB ? CG.clamp(1 - (q.reveal - REVEAL.lblB) / HILITE_T, 0, 1) * q.out : 0;
    q.panel = revealAt(q, REVEAL.ask);
    q.rulerIn = revealAt(q, REVEAL.ruler);
    if (q.phase === 'intro') introControl(q, dt);   // the three lines light the pieces themselves
    /* one cue per piece as it lands, so the build is heard as well as seen
       (the machine has its own, in stepMachine) */
    if (q.phase === 'ask' && q.out > 0.5) {
      if (q.beat === 0 && q.reveal >= REVEAL.ptA) { q.beat = 1; A.sfx('click'); }
      else if (q.beat === 1 && q.reveal >= REVEAL.ptB) { q.beat = 2; A.sfx('click'); }
      else if (q.beat === 2 && q.reveal >= REVEAL.lblA) { q.beat = 3; A.sfx('click', { rate: 1.32 }); }
      else if (q.beat === 3 && q.reveal >= REVEAL.lblB) { q.beat = 4; A.sfx('click', { rate: 1.32 }); }
      else if (q.beat === 4 && q.reveal >= REVEAL.ask) { q.beat = 5; A.sfx('check'); }
      else if (q.beat === 5 && q.reveal >= REVEAL.ruler) { q.beat = 6; A.sfx('click', { rate: 0.8 }); }
    }
    q.ruler.open = CG.approach(q.ruler.open, q.ruler.target, 10, dt);
    if (q.ruler.keyT > 0) q.ruler.keyT -= dt;
    if (q.bad) q.bad.t += dt;
    stepMachine(q, dt);
    switch (q.phase) {
      case 'approach': {
        /* ONE BRAKING ACTION (see STOP_DECEL): the brake is held while the
           truck is above the stopping curve, and the curve is also enforced
           directly in gapAfterStep, so the stop lands on the mark. A truck
           arriving slower than the curve is walked up to it. */
        var rem = g.stopX - v.x, sp = v.forwardSpeed();
        var want = stopSpeed(rem);
        /* A truck that went over anyway (landed on its roof, or settled
           upside down) is set back on its wheels where it is: the question is
           never asked of a wreck, and a flip on the approach is not a crash
           the player caused. */
        if (v.crashed || v.upsideTime > 0.25) {
          v.reset(Math.min(v.x, g.stopX)); clearCrash(v); holdCar(v);
          for (var d0 = 0; d0 < 5; d0++) FX.dust(v.x, v.y + 30, 0, -40, 0.8);
          A.sfx('land');
          return COAST;
        }
        /* Brakes only bite on the ground. In the air the brake pedal is air
           control - it pitches the nose down - so a truck arriving over a
           crest with the brake locked used to land on its roof at the lip. */
        if (!v.onGround) return COAST;
        if (rem < 8 && Math.abs(sp) < 30) {
          /* Stopped - but a fast arrival meets the barrier and rocks on its
             springs, and the question freezes the truck wherever it is. So it
             is asked once the truck sits on both wheels, not mid-bounce; if it
             will not settle (or stopped tipped over on the lip) it is set
             square after a moment. */
          q.stillT = (q.stillT || 0) + dt;
          var settled = v.wheelsDown === 2 && Math.abs(v.av) < 0.5 && Math.abs(v.vy) < 50 && v.ca > 0.8;
          if (!settled && q.stillT < 1.2) return COAST;
          if (!settled) { v.reset(g.stopX); clearCrash(v); }
          holdCar(v);
          stopBurst(v, q.arriveV || 0);
          /* the first chasm ever: the road is explained and the lesson had
             before the question is asked (THE LESSON) */
          if (lessonWanted()) introStart(q); else { q.phase = 'ask'; q.t = 0; }
          return COAST;
        }
        /* dust off both tyres for as long as the brakes are on */
        if (sp > want * 0.9 && sp > 60) {
          q.arriveV = Math.max(q.arriveV || 0, sp);
          q.skidT -= dt;
          if (q.skidT <= 0) {
            q.skidT = 0.035;
            for (var d = 0; d < 2; d++) {
              var w = v.wheels[d];
              if (w.contact) FX.dust(w.cpx, w.cpy, -sp * 0.3, -30, 0.7 + sp / 900);
            }
          }
        }
        if (sp > want) return HARD;
        if (sp < want - 40 && rem > 30) return CREEP;
        return COAST;
      }
      case 'spawn': {
        /* THE CUT (see MACH): the board comes out through the blade a unit
           at a time, each strap counted with a tick and a spray of chips, and
           the chop as its tail clears the teeth */
        var r = q.run, m = q.mach, f = R.machineFrame(g);
        if (!f) { q.pose0 = { x: (q.plank.x0 + q.plank.x1) / 2, y: g.ay - 90, ang: 0 }; q.phase = 'place'; q.t = 0; return COAST; }
        var cutX = f.bladeX + f.bladeR * 0.8, cutY = f.beltY - R.PLANK_T * 0.6;
        var fed = travel(r, q.t - MACH.UP);
        if (fed > 0 && fed < r.L) {
          var units = Math.min(q.len, Math.floor(fed / r.L * q.len + 1e-6));
          if (units > r.units) {
            r.units = units; r.unitT = q.t;
            A.sfx('tick', { rate: Math.pow(2, Math.min(12, units - 1) / 12) });   // the count climbs
            FX.chips(cutX, cutY, 4);
            m.jolt = Math.max(m.jolt, 1.2);
          }
          r.chipT -= dt;
          if (r.chipT <= 0) { r.chipT = 0.045; FX.chips(cutX, cutY, 1); }
        }
        if (!r.chopped && fed >= r.L) {
          /* the last unit is done the instant the cut is: its tick rides
             with the chop, so the ear hears as many ticks as there are units */
          if (r.units < q.len) A.sfx('tick', { rate: Math.pow(2, Math.min(12, q.len - 1) / 12) });
          r.chopped = true; r.units = q.len; r.unitT = q.t;
          A.sfx('chop'); FX.chips(cutX, cutY, 7);
          m.jolt = Math.max(m.jolt, 2.2); m.sqV -= 1.8;
        }
        if (q.t >= r.end) {
          /* off the end of the belt: the drop starts from exactly here */
          q.pose0 = feedPose(q, r.end);
          q.phase = 'place'; q.t = 0;
          A.sfx('plank');
          m.sqV += 2.6;
        }
        return COAST;
      }
      case 'intro':                    // the road explained (introControl)
      case 'lesson':                   // Swifty has the screen (lessonTick)
        return COAST;
      case 'place':
        if (q.t >= PLACE_T) landPlank();
        return COAST;
      case 'drive': {
        /* the player has the pedals - on the leash until it is across (see
           Gaps.leash); an override only while it is actually holding back */
        var li = CG.Gaps.leash(v, g, G.input);
        return li === G.input ? null : li;
      }
      case 'fail':
        q.fade = CG.clamp((q.t - (FAIL_T - FADE_T)) / FADE_T, 0, 1);
        if (q.t >= FAIL_T) { if (q.lost) loseRun(); else resetGap(); }
        return COAST;
      case 'done':
        if (q.out < 0.02) G.gap = null;
        return null;
    }
    return null;
  }

  /* THE ROAD EXPLAINED - once, at the first chasm, before the lesson: three
     lines, each with the thing it names lit. The broken road is outlined
     and badged for the first; the two ends land (with the dashed span
     between them) for the second; the plane comes up for the third. Each
     holds for its `t` seconds or until a tap, then the lesson opens. */
  var INTRO = [                            // the words: intro.line1..3 in i18n/strings.json
    { t: 3.8, key: 'intro.line1' },
    { t: 5.4, key: 'intro.line2' },
    { t: 4.4, key: 'intro.line3' }
  ];
  var INTRO_LEAD = 0.7, INTRO_IN = 0.35, INTRO_OUT = 0.3, INTRO_MIN = 0.9;

  function introStart(q) {
    q.phase = 'intro'; q.t = 0; q.step = 0; q.stepT = -INTRO_LEAD; q.said = false;
    q.ringK = 0; q.roadK = 0;
    loadLesson();                          // fetched under the three lines
  }

  /* a tap, a key, or the line's time: the next line - or the lesson */
  function introAdvance() {
    var q = G.gap;
    if (!q || q.phase !== 'intro' || q.stepT < INTRO_MIN) return;
    q.step++; q.stepT = 0;
    if (q.step >= INTRO.length) {
      q.phase = 'lesson'; q.t = 0;
      showLesson(lessonOver);
    } else A.sfx('click');
  }

  /* back from the lesson: the question, built from nothing as it always is
     (the reveal starts under the overlay's fade, so the machine rises as
     the road comes back into view) */
  function lessonOver() {
    var q = G.gap;
    if (!q || q.phase !== 'lesson') return;
    q.phase = 'ask'; q.t = 0; q.reveal = -0.5; q.beat = 0; q.stillT = 0;
    q.ptA = q.ptB = q.lblA = q.lblB = q.hiA = q.hiB = q.grid = q.axes = q.panel = q.rulerIn = 0;
    q.ringK = q.roadK = 0;
  }

  function introControl(q, dt) {
    var s = q.step;
    q.stepT += dt;
    if (!q.said && q.stepT >= 0) { q.said = true; A.sfx('check'); }
    if (q.stepT >= INTRO[s].t) { introAdvance(); if (q.phase !== 'intro') return; s = q.step; }
    var pulse = 0.5 + 0.5 * Math.sin(G.clock * 4.5);
    /* what each line points at: the hole, then the ends, then the plane */
    var inA = s > 1 ? 1 : s === 1 ? CG.clamp(q.stepT / 0.45, 0, 1) : 0;
    var inB = s > 1 ? 1 : s === 1 ? CG.clamp((q.stepT - 0.3) / 0.45, 0, 1) : 0;
    var inP = s > 2 ? 1 : s === 2 ? CG.clamp(q.stepT / 0.7, 0, 1) : 0;
    q.roadK = s === 0 ? CG.clamp((q.stepT + 0.3) / 0.4, 0, 1) : Math.max(0, 1 - q.stepT / 0.4);
    q.ptA = inA; q.ptB = inB;
    q.lblA = q.lblB = q.hiA = q.hiB = 0;
    q.ringK = s === 1 ? Math.min(inA, inB) * (0.55 + 0.45 * pulse) : s > 1 ? 0.3 : 0;
    q.grid = inP * (s === 2 ? 0.7 + 0.3 * pulse : 1);
    q.axes = inP;
    q.panel = q.rulerIn = 0;
  }

  /* The player read a length off the ruler. */
  G.answer = function (len) {
    var q = G.gap;
    if (!q || q.phase !== 'ask') return;
    len = len | 0;
    if (len < 1 || len > q.g.ruler || q.wrong[len]) return;
    q.len = len;
    q.ruler.value = len;                 // the number stays in the box...
    q.ruler.target = 0;                  // ...and the ruler folds: the machine takes it from here
    learn('drop');
    q.plank = CG.Gaps.plankFor(q.g, len);
    q.run = machineRun(q);
    q.phase = 'spawn'; q.t = 0;
    /* the lever goes down, the motor catches */
    q.mach.leverV = 9; q.mach.sqV = -2.4;
    A.sfx('lever');
    A.saw(MACH.UP, q.run.chopT - MACH.UP);
  };

  function ease(k) { k = CG.clamp(k, 0, 1); return k * k * (3 - 2 * k); }

  /* Where the plank is right now, for the renderer. */
  function plankPose() {
    var q = G.gap, p = q.plank;
    var L = Math.hypot(p.x1 - p.x0, p.y1 - p.y0), ang1 = Math.atan2(p.y1 - p.y0, p.x1 - p.x0);
    var tx = (p.x0 + p.x1) / 2, ty = (p.y0 + p.y1) / 2;
    if (q.phase === 'spawn') {                  // on the belt - drawn by the machine, clipped at the blade
      return q.run && R.machineFrame(q.g) ? feedPose(q, q.t) : { x: tx, y: ty, ang: ang1, len: L, alpha: 0 };
    }
    if (q.phase === 'place') return fallPose(q, q.t, L, tx, ty, ang1);
    return { x: tx, y: ty, ang: ang1, len: L };
  }
  G.plankPose = plankPose;

  /* ② THE FALL, as a pose at time t: the board hops off the end of the
     belt (a small kick up, then accelerating down), drifts across to the
     hole fast at first and settling late, and tips from level to the angle
     between the lips a moment before it touches. Every term lands exactly
     on the placed pose at t = PLACE_T, so the hand-off to the terrain has
     no jump. */
  var FALL_HOP = 42;
  function fallPose(q, t, L, tx, ty, ang1) {
    var k = CG.clamp(t / PLACE_T, 0, 1), p0 = q.pose0;
    var kx = 1 - (1 - k) * (1 - k);
    var y = p0.y + (ty - p0.y) * k * k - FALL_HOP * 4 * k * (1 - k) * (1 - k);
    return { x: CG.lerp(p0.x, tx, kx), y: y, ang: CG.lerp(0, ang1, ease(k / 0.8)), len: L };
  }
  G.fallPose = function (t) {
    var q = G.gap, p = q.plank;
    return fallPose(q, t, Math.hypot(p.x1 - p.x0, p.y1 - p.y0), (p.x0 + p.x1) / 2, (p.y0 + p.y1) / 2,
                    Math.atan2(p.y1 - p.y0, p.x1 - p.x0));
  };

  function landPlank() {
    var q = G.gap, p = q.plank, v = G.v;
    CG.Terrain.addPlank(p);
    q.phase = 'drive'; q.t = 0; q.tipped = false;
    q.ruler.target = 0;                  // ③ down: now the ruler folds away
    A.sfx('slam');
    A.sfx('poof');                       // the comic dust has a sound too
    R.shake = Math.max(R.shake, 9);
    /* the comic burst where each end strikes rock, over a few loose motes;
       a short board's far end strikes nothing */
    FX.poof(p.x0, p.y0 + 4, 230, 0.5);
    for (var k = 0; k < 3; k++) FX.dust(p.x0, p.y0, -60, 0, 1);
    if (p.kind !== 'short') {
      FX.poof(p.x1, p.y1 + 4, 230, 0.5);
      for (k = 0; k < 3; k++) FX.dust(p.x1, p.y1, 60, 0, 1);
    }
    if (p.kind === 'exact') {
      FX.text((p.x0 + p.x1) / 2, Math.min(p.y0, p.y1) - 60, T('fx.perfect'), '#AED581', true);
    }
    FX.text(v.x, v.y - 110, T('fx.go'), '#FFD54F', true);
    A.sfx('go');
  }

  /* A wrong plank has done its work: the answer is crossed off, and a heart
     goes with it. The last heart ends the run once the fade is down. */
  function failGap() {
    var q = G.gap;
    if (q.phase !== 'drive') return;
    q.phase = 'fail'; q.t = 0;
    q.wrong[q.len] = true; q.tries++;
    G.lives = Math.max(0, G.lives - 1);
    G.heartT = 0.9;
    q.lost = G.lives <= 0;
    A.sfx('heart');
    R.shake = Math.max(R.shake, 12);
  }

  /* A WRONG PLANK SAYS SO WITHOUT WORDS: the board goes red, a red cross
     pops where it failed (the end that ran out, or the end that wedged),
     and the edges of the screen flush red for a moment. No "too short" or
     "too long" - the board falling or the truck going over says which. */
  function markWrong(q, x, y) {
    q.bad = { t: 0, x: x, y: y };
    R.shake = Math.max(R.shake, 10);
  }

  /* A NEW SET OF POINTS after a miss. The lips cannot move - they are the
     ground under the truck - so the plane slides under them instead: the
     origin shifts by whole units and both points take new coordinates, the
     same distance apart. The numbers change, so the length has to be worked
     out again rather than picked by elimination. The shift keeps the plane
     compact (the origin near the points), keeps the span off the axes where
     it can, and never repeats a set this hole has already shown. Seeded by
     the hole and the try, so a replay asks the same things. */
  function newPoints(q) {
    var g = q.g, U = CG.UNIT, rnd = CG.rng(((g.index + 1) * 7919 + q.tries * 104729) >>> 0);
    var best = null, tx, ty;
    q.shown = q.shown || {};
    q.shown[g.a + '|' + g.b] = 1;
    function onAxis(p) { return p[0] === 0 || p[1] === 0 ? 1.5 : 0; }
    for (tx = -4; tx <= 4; tx++) for (ty = -4; ty <= 4; ty++) {
      var a = [g.a[0] + tx, g.a[1] + ty], b = [g.b[0] + tx, g.b[1] + ty];
      if (q.shown[a + '|' + b]) continue;
      var w = Math.max(a[0], b[0], 0) - Math.min(a[0], b[0], 0);
      var hh = Math.max(a[1], b[1], 0) - Math.min(a[1], b[1], 0);
      var s = w + 1.5 * hh + onAxis(a) + onAxis(b) + 3 * rnd();
      if (!best || s < best.s) best = { s: s, a: a, b: b };
    }
    if (!best) return;
    g.a = best.a; g.b = best.b;
    g.ox = g.ax - g.a[0] * U; g.oy = g.ay + g.a[1] * U;
    g.q = CG.Gaps.question(g);
    replanHold(q);                            // a new plane is a new row: the saw and the hold move with it
  }

  function resetGap() {
    var q = G.gap, g = q.g, v = G.v;
    CG.Terrain.setPlanks(CG.Terrain.planks.filter(function (p) { return p !== q.plank; }));
    q.plank = null; q.tipped = false; q.run = null; q.bad = null;
    q.ruler.value = 0; q.ruler.cursor = 0;
    q.mach = newMachine(true);           // stood back up while the screen is black
    /* a fresh question for the same hole, so nothing on the ruler is
       crossed out any more */
    newPoints(q);
    q.wrong = {};
    v.reset(g.stopX);
    clearCrash(v);
    holdCar(v);
    /* back to the question: the plane is already up, the new points land on
       it one after the other as the screen clears, then their coordinates */
    q.phase = 'ask'; q.t = 0; q.fade = 1;
    q.retry = true;
    q.reveal = REVEAL.ptA - 0.1; q.beat = 0;
    /* this frame's alphas were read before the reset: nothing of the old
       question may show (or be tapped) for the one frame until they are
       read again */
    q.ptA = q.ptB = q.lblA = q.lblB = q.hiA = q.hiB = q.panel = q.rulerIn = 0;
  }

  /* The third heart went with that plank. The truck is set back on the lip
     under the fade and the run ends there, the question put away. */
  function loseRun() {
    var q = G.gap, g = q.g, v = G.v;
    CG.Terrain.setPlanks(CG.Terrain.planks.filter(function (p) { return p !== q.plank; }));
    v.reset(g.stopX);
    clearCrash(v);
    holdCar(v);
    G.gap = null;
    R.focus = 0;
    updateCamera(0, true);
    gameOver('hearts');
  }

  function solveGap() {
    var q = G.gap, g = q.g, v = G.v;
    g.solved = true;
    if (q.tries === 0) G.firstTry++;
    G.crossed++;
    FX.text(v.x, v.y - 110, T(q.tries === 0 ? 'fx.firstTry' : 'fx.across'), '#FFD54F', true);
    A.sfx('gem');
    q.phase = 'done'; q.t = 0;
  }

  /* After the physics step: the barrier, and the three verdicts. */
  function gapAfterStep(dt) {
    var q = G.gap, g = q.g, v = G.v, p = q.plank, k;
    if (q.phase === 'approach') {
      /* the stopping curve, held: whatever the tyres did not take off this
         frame comes off along the chassis axis, capped at a little over
         STOP_DECEL so it reads as the brakes and not as a wall */
      var rem = g.stopX - v.x, fwd = v.forwardSpeed(), over = fwd - stopSpeed(rem);
      if (over > 0 && v.onGround) {
        var dv = Math.min(over, STOP_DECEL * 1.3 * dt);
        v.vx -= dv * v.ca; v.vy -= dv * v.sa;
      }
      if (v.x > g.stopX) {
        var sp = v.vx;
        v.x = g.stopX;
        if (sp > 260) {
          A.sfx('thud'); R.shake = Math.max(R.shake, 6);
          for (k = 0; k < 4; k++) FX.dust(v.wheels[1].cpx, v.wheels[1].cpy, sp * 0.3, 0, 1);
        }
        v.vx = Math.min(0, v.vx);
      }
      return;
    }
    if (q.phase !== 'drive') return;
    var Gp = CG.Gaps, deep = Math.max(g.ay, g.by) + 130;
    if (p.kind === 'exact') {
      if (v.x > g.bx + 150 && v.onGround) solveGap();
      else if (v.crashed || v.y > deep) {
        /* the answer was right; only the driving went wrong — same plank, try again */
        v.reset(g.stopX); clearCrash(v); holdCar(v);
      }
      return;
    }
    if (p.kind === 'short') {
      if (!q.tipped && Gp.shortTripped(v, p)) {
        q.tipped = true; q.tipT = q.t;
        Gp.boardGives(v);
        A.sfx('wrong');
        markWrong(q, p.x1, p.y1);                      // where it ran out
      }
      if (q.tipped) {
        Gp.tipPlank(p, dt);                            // the board gives way under the car
        if (Math.random() < 0.5) FX.dust(p.x0, p.y0, -40, 0, 0.6);
      }
    } else {
      if (!q.tipped && Gp.longTripped(v, p)) {
        q.tipped = true; q.tipT = q.t;
        Gp.wallFlip(v);                                // into the wall, over the nose
        A.sfx('crash'); A.sfx('wrong'); R.shake = Math.max(R.shake, 14);
        for (k = 0; k < 8; k++) FX.dust(p.x1, v.y, -80, -40, 1);
        markWrong(q, p.x1, p.y1);                      // where it wedged
      }
    }
    if (q.tipped && Gp.failed(v, g, q.t - q.tipT)) failGap();
  }

  function stepPhysics(dt, live, force) {
    var v = G.v, i, w;
    var inp = force || (live ? G.input : COAST);

    acc += dt;
    var n = 0;
    while (acc >= SUB && n < 12) {
      v.step(SUB, inp);
      acc -= SUB; n++;
    }
    for (i = 0; i < 2; i++) {
      w = v.wheels[i];
      w.ang = (w.ang || 0) + w.omega * dt;
    }
    v.headLean = CG.approach(v.headLean || 0,
      CG.clamp(-v.av * 0.05, -0.34, 0.34), 11, dt);
  }

  /* Standing on the brake at speed squeals the tyres. Only on the press - a
     held brake is one screech, not a machine gun - only with rubber on the
     ground, and only while actually moving forward, so brake-as-reverse from
     a standstill stays quiet. Louder and a touch higher the faster the car;
     lifting off, stopping or leaving the ground fades it out. */
  var SCREECH_V0 = 250, SCREECH_V1 = 900;     // px/s: ~18 km/h starts, ~65 km/h is full
  var brakeHeld = false, screechCool = 0;
  function brakeScreech(v, dt, force) {
    var br = (force || G.input).brake > 0;
    var fwd = v.forwardSpeed(), grounded = v.wheels[0].contact || v.wheels[1].contact;
    screechCool = Math.max(0, screechCool - dt);
    if (br && !brakeHeld && grounded && fwd > SCREECH_V0 && screechCool === 0 && !force) {
      A.screech(CG.clamp((fwd - SCREECH_V0) / (SCREECH_V1 - SCREECH_V0), 0, 1));
      screechCool = 0.45;
    }
    if (!br || fwd < 60 || !grounded) { if (!force) A.screechRelease(); }
    brakeHeld = br;
  }

  function updatePlay(dt) {
    var v = G.v, i, w, force = null;

    /* idle: a free truck with no pedal down (see nudgeWanted) */
    var free = !G.gap || G.gap.phase === 'drive' || G.gap.phase === 'done';
    if (!free || G.input.gas > 0 || G.input.brake > 0) G.idleT = 0; else G.idleT += dt;
    /* the blocker's reference: the furthest the truck has got - restarted
       wherever the game puts it back (a respawn, a chasm reset: any jump
       backwards bigger than a frame's worth of driving) */
    if (v.x < G.lastX - 150) G.maxX = v.x;
    G.maxX = Math.max(G.maxX, v.x);
    G.blockGlow = G.input.gas > 0 ? 0 : Math.max(0, G.blockGlow - dt);

    if (G.mode === 'endless') CG.Endless.ensure(v.x);
    if (G.track || G.mode === 'endless') armGap(v);
    if (G.gap) {
      force = gapControl(dt);
      if (G.gap && (G.gap.phase === 'ask' || G.gap.phase === 'intro' || G.gap.phase === 'lesson')) {
        /* the world waits: the engine idling, the truck held */
        G.gap.fade = Math.max(0, G.gap.fade - dt / FADE_T);
        stepPhysics(dt, false);
        holdCar(v);
        A.drive(0.05, 0, 0, true);
        return;
      }
    }
    G.time += dt;
    if (G.heartT > 0) G.heartT = Math.max(0, G.heartT - dt);
    if (G.freePlay) freePlayTick(v, dt);

    if (G.invuln > 0) G.invuln -= dt;

    var wasAir = v.airTime;
    /* THE BLOCKER: at the limit, reverse does nothing (the brake still
       brakes a truck rolling forward) */
    var lim = backLimit();
    if (!force && free && G.input.brake > 0 && v.x <= lim + 6 && v.forwardSpeed() < 40) {
      force = { gas: G.input.gas, brake: 0, boost: false };
      G.blockGlow = 1.2;
    }
    stepPhysics(dt, true, force);
    if (G.gap) gapAfterStep(dt);
    if (free && v.x < lim) {               // rolled into it: it holds
      v.x = lim; if (v.vx < 0) v.vx = 0;
      G.blockGlow = 1.2;
    }
    G.lastX = v.x;

    /* distance (the season and the hour turn with it) */
    G.dist = Math.max(G.dist, v.x / CG.PPM);
    CG.Env.update(G.dist, dt);

    var fin = G.track ? G.track.finishX : (G.mode === 'endless' ? CG.Endless.finishX : 0);
    if (fin && v.x >= fin) { finishRun(); return; }
    if (v.onGround && Math.abs(v.a) < 0.5) {
      lastSafeT += dt;
      if (lastSafeT > 0.25) { lastSafeX = v.x; lastSafeT = 0; }
    }

    /* tyre dust + exhaust smoke */
    var skid = 0;
    dustT -= dt; smokeT -= dt;
    for (i = 0; i < 2; i++) {
      w = v.wheels[i];
      if (!w.contact) continue;
      skid = Math.max(skid, w.skid);
      if (w.skid > 0.22 && dustT <= 0) {
        FX.dust(w.cpx, w.cpy, -w.slip * 0.25, v.vy, w.skid);
        dustT = 0.05;
      }
    }
    brakeScreech(v, dt, force);
    if (G.input.gas > 0 && smokeT <= 0) {
      var ex = v.toWorld(V.exhaust.x, V.exhaust.y);
      FX.smoke(ex.x, ex.y, v.vx - v.ca * 90, v.vy);
      smokeT = 0.075;
    }

    /* landings */
    if (v.impact > 320) {
      var hard = v.impact > 760;
      A.sfx(hard ? 'thud' : 'land');
      R.shake = Math.max(R.shake, CG.clamp(v.impact / 90, 3, 20));
      for (i = 0; i < 2; i++) {
        w = v.wheels[i];
        if (w.contact) FX.dust(w.cpx, w.cpy, v.vx * 0.4, 0, 1);
      }
    }

    if (wasAir > 0.05 && v.airTime === 0) v.landedSpin = 0;

    if (v.crashed) {
      if (G.gap && G.gap.phase !== 'done') { /* handled by the chasm: a reset, not a heart */ }
      else if (G.invuln > 0) { v.crashed = false; v.crashReason = ''; v.upsideTime = 0; }
      else crashOut();
    }

    A.drive(v.rpm, v.engineLoad, skid, true);
  }

  /* ------------------------------------------------------------- camera */
  /* ------------------------------------------------------- gap camera
     Three framings of a chasm, all in world space:
       wide    while the auto-brake works: the truck and the whole hole ahead
               with room to spare - the establishing shot. Its left edge rides
               with the truck, so braking already draws the frame in a little.
       tight   once the truck has stopped: the coordinate plane, whole, as
               large as the screen allows between the question (and its
               tip or hint line) and the foreground grass - with the truck
               and the ruler keys beside it on the left.
       medium  after an answer: the car and both lips, room for the plank to
               swing across and for the drive over it.
     wide -> tight is THE PUSH-IN: not the chase-cam's lag but a scripted
     smootherstep (FOCUS_T), zooming about the one world point that holds
     still between the two frames, so the view closes on the hole instead
     of swinging to it. The world's focus treatment rises with it. */
  var FOCUS_DELAY = 0.12, FOCUS_T = 1.15;
  var reducedMotion = (function () {
    try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
  })();

  /* How many lines sit under the question pill: one for the nudge while
     any of its three steps is still to be done this run (see drawGapUI).
     Counted per question rather than per step, so the frame holds still
     while the nudge changes under it. */
  function subLines(q) {
    if (!q) return 0;
    var anyTip = !G.learned.open || !G.learned.pick || !G.learned.drop;
    return anyTip ? 1 : 0;
  }

  function gapFrame(g, v, mode) {
    var U = CG.UNIT, W = R.W, H = R.H, left, right, top, bottom, z;
    var lipY = (g.ay + g.by) / 2;
    if (mode === 'tight') {
      /* the plane whole, as large as the screen allows, the truck's tail at
         the left edge (see CG.Gaps.tightFrame - the same numbers the row at
         the gap was planned with) */
      var tf = CG.Gaps.tightFrame(g, Math.min(v.x, g.stopX) - 150, W, H, subLines(G.gap));
      g.padR = tf.padR;
      return { x: (tf.left + tf.right) / 2, z: tf.z,
               y: (tf.top + tf.bottom) / 2 - ((tf.bandT + tf.bandB) / 2 - H / 2) / tf.z };
    }
    var wide = mode === 'wide';
    left = Math.min(v.x, g.stopX) - (wide ? 260 : 170);
    right = g.bx + (wide ? 380 : 200);
    z = CG.clamp((wide ? 0.9 : 0.84) * W / (right - left), 0.5, 1.1);
    /* both lips in frame, sky above for the ruler */
    return { x: (left + right) / 2, y: lipY - (wide ? 0.12 : 0.15) * H / z, z: z };
  }

  function updateCamera(dt, snap) {
    var v = G.v;
    var spd = Math.hypot(v.vx, v.vy);
    /* zoom so the jeep reads about a fifth of the screen width, easing out
       as speed rises to keep the run-up visible */
    var tz = CG.lerp(1.18, 0.95, CG.clamp(spd / 1000, 0, 1)) * (v.onGround ? 1 : 0.95);
    var tx = v.x + 0.12 * R.W / tz + CG.clamp(v.vx * 0.28, -140, 260);
    var ty = v.y - 0.05 * R.H / tz + CG.clamp(v.vy * 0.16, -80, 130);
    var kx = 7.5, ky = 5.0;
    var q = G.gap;
    /* the world's focus treatment: up while the question and its answer
       play out, eased back down as the truck drives on */
    var fOn = q && (q.phase === 'ask' || q.phase === 'intro' || q.phase === 'spawn' || q.phase === 'place' || q.phase === 'fail');
    R.focus = snap ? (fOn ? 1 : 0) : CG.approach(R.focus, fOn ? 1 : 0, fOn ? 2.6 : 1.8, dt);
    if (q && q.phase !== 'done') {
      var g = q.g, f = gapFrame(g, v, q.phase === 'approach' ? 'wide'
                                     : q.phase === 'ask' || q.phase === 'spawn' || q.phase === 'place' ? 'tight' : 'medium');
      tx = f.x; ty = f.y; tz = f.z;
      kx = 4; ky = 4;
      if (q.phase === 'fail') { ty = CG.lerp(ty, v.y, 0.85); ky = 7; }   // watch it fall
      if (q.phase === 'ask' && !snap) {
        if (!q.cam0) q.cam0 = { x: R.cam.x, y: R.cam.y, z: R.cam.z };
        var k = reducedMotion ? 1 : CG.clamp((q.reveal - FOCUS_DELAY) / FOCUS_T, 0, 1);
        k = k * k * k * (k * (k * 6 - 15) + 10);                        // smootherstep
        var c0 = q.cam0, zk = c0.z * Math.pow(tz / c0.z, k);
        R.cam.z = zk;
        if (Math.abs(tz - c0.z) > 0.01) {
          /* the world point that sits at the same place on screen in both
             frames; zooming about it is a pure push, no sideways swing */
          var px = (c0.x * c0.z - tx * tz) / (c0.z - tz), py = (c0.y * c0.z - ty * tz) / (c0.z - tz);
          R.cam.x = px - (px - c0.x) * c0.z / zk;
          R.cam.y = py - (py - c0.y) * c0.z / zk;
        } else {
          R.cam.x = CG.lerp(c0.x, tx, k); R.cam.y = CG.lerp(c0.y, ty, k);
        }
        R.shake = CG.approach(R.shake, 0, 7, dt);
        return;
      }
    }
    if (snap) { R.cam.x = tx; R.cam.y = ty; R.cam.z = tz; return; }
    R.cam.z = CG.approach(R.cam.z, tz, 2.2, dt);
    R.cam.x = CG.approach(R.cam.x, tx, kx, dt);
    R.cam.y = CG.approach(R.cam.y, ty, ky, dt);
    R.shake = CG.approach(R.shake, 0, 7, dt);
  }

  /* ---------------------------------------------------------------- HUD */
  function btn(id, x, y, w, h, r) {
    var b = { id: id, x: x, y: y, w: w, h: h, r: r === undefined ? 14 : r };
    buttons.push(b);
    return b;
  }

  function barGrad(y, h, top, bottom) {
    var g = R.ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, top); g.addColorStop(1, bottom);
    return g;
  }

  /* round glass button: navy disc, white rim, a gloss cap */
  function iconBtn(id, cx, cy, rad, img, down) {
    var c = R.ctx;
    btn(id, cx - rad, cy - rad, rad * 2, rad * 2, rad);
    c.save();
    c.beginPath(); c.arc(cx, cy + 3, rad, 0, CG.TAU);
    c.fillStyle = 'rgba(8,12,26,0.35)'; c.fill();
    c.beginPath(); c.arc(cx, cy, rad, 0, CG.TAU);
    c.fillStyle = down ? barGrad(cy - rad, rad * 2, '#FFD36A', '#FF9A12')
                       : barGrad(cy - rad, rad * 2, 'rgba(44,62,104,0.9)', 'rgba(16,24,48,0.92)');
    c.fill();
    c.lineWidth = 3; c.strokeStyle = 'rgba(235,242,255,0.85)'; c.stroke();
    c.beginPath(); c.ellipse(cx, cy - rad * 0.45, rad * 0.62, rad * 0.3, 0, 0, CG.TAU);
    c.fillStyle = 'rgba(255,255,255,0.12)'; c.fill();
    var im = CG.img[img];
    if (im) {
      var s = rad * 1.15;
      c.drawImage(im, cx - s / 2, cy - s / 2, s, s);
    }
    c.restore();
  }

  /* The two controls the game cannot be played without, sitting on bright
     grass and busy soil. At 0.42 opacity over a dark wash they were a pair of
     ghost outlines: findable once you knew, invisible to a child meeting the
     game. They now carry a solid disc, a drop shadow to lift them off the
     ground texture, and a ring in their own action colour so gas and brake are
     told apart by colour rather than by which side of the screen they are on. */
  /* `glow` 0..1: a soft green halo that breathes round the pedal - the
     nudge to press it (idle too long, paused, or backed into the blocker) */
  function pedal(cx, cy, rad, dir, down, glow) {
    var c = R.ctx;
    btn(dir > 0 ? 'gas' : 'brake', cx - rad, cy - rad, rad * 2, rad * 2, rad);
    var hue = dir > 0 ? '#7CB342' : '#E53935';
    c.save();
    if (glow > 0.01 && !down) {
      var br = 0.5 + 0.5 * Math.sin(G.clock * 4.2);          // breathing, ~0.7 Hz
      var gr = rad * (1.28 + 0.14 * br);
      var hg = c.createRadialGradient(cx, cy, rad * 0.85, cx, cy, gr + rad * 0.35);
      hg.addColorStop(0, 'rgba(174,234,90,' + (glow * (0.42 + 0.28 * br)).toFixed(3) + ')');
      hg.addColorStop(1, 'rgba(174,234,90,0)');
      c.fillStyle = hg;
      c.beginPath(); c.arc(cx, cy, gr + rad * 0.35, 0, CG.TAU); c.fill();
      c.beginPath(); c.arc(cx, cy, rad + 5 + 3 * br, 0, CG.TAU);
      c.lineWidth = 3; c.strokeStyle = 'rgba(214,255,150,' + (glow * (0.5 + 0.35 * br)).toFixed(3) + ')';
      c.stroke();
    }
    c.beginPath(); c.arc(cx, cy, rad, 0, CG.TAU);
    c.shadowColor = 'rgba(20,14,8,0.55)';
    c.shadowBlur = 14;
    c.shadowOffsetY = 3;
    c.fillStyle = down ? hue : 'rgba(31,24,17,0.62)';
    c.fill();
    c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
    c.lineWidth = 4;
    c.strokeStyle = down ? 'rgba(255,255,255,0.92)' : 'rgba(236,239,241,0.82)';
    c.stroke();
    /* the action colour, on a ring inside the rim */
    c.beginPath(); c.arc(cx, cy, rad - 10, 0, CG.TAU);
    c.lineWidth = 3;
    c.globalAlpha = down ? 0.55 : 0.85;
    c.strokeStyle = down ? '#FFF' : hue;
    c.stroke();
    c.globalAlpha = 1;
    c.fillStyle = '#FFF';
    var k = rad * 0.34;
    for (var i = 0; i < 2; i++) {
      var ox = (i - 0.5) * k * 0.9 * dir;
      c.beginPath();
      c.moveTo(cx + ox - k * 0.35 * dir, cy - k);
      c.lineTo(cx + ox + k * 0.45 * dir, cy);
      c.lineTo(cx + ox - k * 0.35 * dir, cy + k);
      c.closePath(); c.fill();
    }
    c.restore();
  }

  /* `coarse` drops the tenths — used for par and best-time labels, where a
     decimal place is noise the player never acts on. */
  function fmtTime(t, coarse) {
    var m = Math.floor(t / 60), sec = t - m * 60;
    if (coarse) sec = Math.round(sec);
    if (coarse && sec === 60) { m++; sec = 0; }
    return m + ':' + (sec < 10 ? '0' : '') + (coarse ? sec : sec.toFixed(1));
  }

  /* THE HUD IS THE HEARTS. Three of them, top left, on one small card - the

    var q = G.gap, g = q.g, v = G.v;
    CG.Terrain.setPlanks(CG.Terrain.planks.filter(function (p) { return p !== q.plank; }));
    q.plank = null; q.tipped = false;
    q.ruler.value = 0; q.ruler.cursor = 0;
    v.reset(g.stopX);
    clearCrash(v);
    holdCar(v);
    /* straight back to the question: the build-up is for the first arrival */
    q.phase = 'ask'; q.t = 0; q.fade = 1;
    q.reveal = REVEAL_DONE; q.beat = 3;
  }

  function solveGap() {
    var q = G.gap, g = q.g, v = G.v;
    g.solved = true;
    var bonus = q.tries === 0 ? 30 : 10;
    if (q.tries === 0) G.firstTry++;
    G.coins += bonus;
    FX.text(v.x, v.y - 110, (q.tries === 0 ? 'FIRST TRY! +' : 'ACROSS! +') + bonus, '#FFD54F', true);
    A.sfx('gem');
    q.phase = 'done'; q.t = 0;
  }

  /* After the physics step: the barrier, and the three verdicts. */
  function gapAfterStep(dt) {
    var q = G.gap, g = q.g, v = G.v, p = q.plank, k;
    if (q.phase === 'approach') {
      if (v.x > g.stopX) {
        var sp = v.vx;
        v.x = g.stopX;
        if (sp > 260) {
          A.sfx('thud'); R.shake = Math.max(R.shake, 6);
          for (k = 0; k < 4; k++) FX.dust(v.wheels[1].cpx, v.wheels[1].cpy, sp * 0.3, 0, 1);
        }
        v.vx = Math.min(0, v.vx);
      }
      return;
    }
    if (q.phase !== 'drive') return;
    var Gp = CG.Gaps, deep = Math.max(g.ay, g.by) + 130;
    if (p.kind === 'exact') {
      if (v.x > g.bx + 150 && v.onGround) solveGap();
      else if (v.crashed || v.y > deep) {
        /* the answer was right; only the driving went wrong — same plank, try again */
        v.reset(g.stopX); clearCrash(v); holdCar(v);
      }
      return;
    }
    if (p.kind === 'short') {
      if (!q.tipped && Gp.shortTripped(v, p)) {
        q.tipped = true; q.tipT = q.t;
        Gp.boardGives(v);
        A.sfx('wrong');
        FX.text(v.x, v.y - 100, 'TOO SHORT!', '#EF5350', true);
      }
      if (q.tipped) {
        Gp.tipPlank(p, dt);                            // the board gives way under the car
        if (Math.random() < 0.5) FX.dust(p.x0, p.y0, -40, 0, 0.6);
      }
    } else {
      if (!q.tipped && Gp.longTripped(v, p)) {
        q.tipped = true; q.tipT = q.t;
        Gp.wallFlip(v);                                // into the wall, over the nose
        A.sfx('crash'); R.shake = Math.max(R.shake, 14);
        for (k = 0; k < 8; k++) FX.dust(p.x1, v.y, -80, -40, 1);
        FX.text(v.x, v.y - 100, 'TOO LONG!', '#EF5350', true);
      }
    }
    if (q.tipped && Gp.failed(v, g, q.t - q.tipT)) failGap();
  }

  function stepPhysics(dt, live, force) {
    var v = G.v, i, w;
    var fuelDead = G.fuel <= 0;
    G.input.boost = G.boostT > 0;
    var inp = force || (live && !fuelDead ? G.input : COAST);

    acc += dt;
    var n = 0;
    while (acc >= SUB && n < 12) {
      v.step(SUB, inp);
      acc -= SUB; n++;
    }
    for (i = 0; i < 2; i++) {
      w = v.wheels[i];
      w.ang = (w.ang || 0) + w.omega * dt;
    }
    v.headLean = CG.approach(v.headLean || 0,
      CG.clamp(-v.av * 0.05, -0.34, 0.34), 11, dt);
  }

  /* Standing on the brake at speed squeals the tyres. Only on the press - a
     held brake is one screech, not a machine gun - only with rubber on the
     ground, and only while actually moving forward, so brake-as-reverse from
     a standstill stays quiet. Louder and a touch higher the faster the car;
     lifting off, stopping or leaving the ground fades it out. */
  var SCREECH_V0 = 250, SCREECH_V1 = 900;     // px/s: ~18 km/h starts, ~65 km/h is full
  var brakeHeld = false, screechCool = 0;
  function brakeScreech(v, dt, force) {
    var br = (force || G.input).brake > 0;
    var fwd = v.forwardSpeed(), grounded = v.wheels[0].contact || v.wheels[1].contact;
    screechCool = Math.max(0, screechCool - dt);
    if (br && !brakeHeld && grounded && fwd > SCREECH_V0 && screechCool === 0 && !force) {
      A.screech(CG.clamp((fwd - SCREECH_V0) / (SCREECH_V1 - SCREECH_V0), 0, 1));
      screechCool = 0.45;
    }
    if (!br || fwd < 60 || !grounded) { if (!force) A.screechRelease(); }
    brakeHeld = br;
  }

  function updatePlay(dt) {
    var v = G.v, i, w, force = null;

    if (G.mode === 'endless') CG.Endless.ensure(v.x);
    if (G.track || G.mode === 'endless') armGap(v);
    if (G.gap) {
      force = gapControl(dt);
      if (G.gap && G.gap.phase === 'ask') {
        /* the world waits: no clock, no fuel, the engine idling */
        G.gap.fade = Math.max(0, G.gap.fade - dt / FADE_T);
        stepPhysics(dt, false);
        holdCar(v);
        A.drive(0.05, 0, 0, G.fuel > 0);
        return;
      }
    }
    G.time += dt;

    if (G.boostT > 0) G.boostT = Math.max(0, G.boostT - dt);
    if (G.invuln > 0) G.invuln -= dt;

    var wasAir = v.airTime;
    stepPhysics(dt, true, force);
    if (G.gap) gapAfterStep(dt);

    /* fuel */
    var eff = force || G.input;
    var throttling = (eff.gas > 0 || eff.brake > 0) && G.fuel > 0;
    G.fuel = Math.max(0, G.fuel - (throttling ? FUEL_DRIVE : FUEL_IDLE) * dt);
    if (G.fuel <= 0) {
      if (G.deadT === 0) FX.text(v.x, v.y - 100, 'OUT OF FUEL', '#EF5350', true);
      G.deadT += dt;
      var spd0 = Math.hypot(v.vx, v.vy);
      if (G.deadT > 1.1 && spd0 < 45) gameOver('fuel');
      else if (G.deadT > 8) gameOver('fuel');
    }

    /* distance + safe-ground memory for respawns */
    G.dist = Math.max(G.dist, v.x / CG.PPM);
    CG.Env.update(G.dist, dt);

    /* checkpoints: a refuel, a respawn point and the only pacing beat the
       player gets on a long stage */
    if (G.track) {
      var cps = G.track.cps;
      while (G.cpIdx + 1 < cps.length && v.x >= cps[G.cpIdx + 1]) {
        G.cpIdx++;
        G.cpX = cps[G.cpIdx];
        G.fuel = Math.min(FUEL_MAX, G.fuel + CP_FUEL);
        FX.text(v.x, v.y - 104, 'CHECKPOINT', '#AED581', true);
        A.sfx('check');
      }
      G.progress = CG.clamp(v.x / G.track.finishX, 0, 1);
      if (v.x >= G.track.finishX) { finishStage(); return; }
    }
    if (v.onGround && Math.abs(v.a) < 0.5) {
      lastSafeT += dt;
      if (lastSafeT > 0.25) { lastSafeX = v.x; lastSafeT = 0; }
    }

    /* tyre dust + exhaust smoke */
    var skid = 0;
    dustT -= dt; smokeT -= dt;
    for (i = 0; i < 2; i++) {
      w = v.wheels[i];
      if (!w.contact) continue;
      skid = Math.max(skid, w.skid);
      if (w.skid > 0.22 && dustT <= 0) {
        FX.dust(w.cpx, w.cpy, -w.slip * 0.25, v.vy, w.skid);
        dustT = 0.05;
      }
    }
    brakeScreech(v, dt, force);
    if (G.input.gas > 0 && G.fuel > 0 && smokeT <= 0) {
      var ex = v.toWorld(V.exhaust.x, V.exhaust.y);
      FX.smoke(ex.x, ex.y, v.vx - v.ca * 90, v.vy);
      smokeT = G.boostT > 0 ? 0.035 : 0.075;
    }

    /* landings */
    if (v.impact > 320) {
      var hard = v.impact > 760;
      A.sfx(hard ? 'thud' : 'land');
      R.shake = Math.max(R.shake, CG.clamp(v.impact / 90, 3, 20));
      for (i = 0; i < 2; i++) {
        w = v.wheels[i];
        if (w.contact) FX.dust(w.cpx, w.cpy, v.vx * 0.4, 0, 1);
      }
    }

    /* trick rewards, banked on landing */
    if (wasAir > 0.05 && v.airTime === 0) {
      var spin = Math.abs(v.landedSpin || 0);
      if (spin > 5.6) {
        var flips = Math.floor(spin / (Math.PI * 2));
        var bonus = 25 * Math.max(1, flips);
        G.coins += bonus;
        FX.text(v.x, v.y - 110, (flips > 1 ? flips + 'x FLIP! ' : 'FLIP! ') + '+' + bonus,
                '#FFD54F', true);
        A.sfx('flip');
      } else if (wasAir > 1.05) {
        G.coins += 12;
        FX.text(v.x, v.y - 110, 'BIG AIR +12', '#4FC3F7', true);
        A.sfx('flip');
      }
      v.landedSpin = 0;
    }

    collect(v);

    if (v.crashed) {
      if (G.gap && G.gap.phase !== 'done') { /* handled by the chasm: a reset, not a life */ }
      else if (G.invuln > 0) { v.crashed = false; v.crashReason = ''; v.upsideTime = 0; }
      else if (G.safety > 0) useSafety();
      else crashOut(v.crashReason);
    }

    A.drive(v.rpm, v.engineLoad, skid, G.fuel > 0);
  }

  /* ------------------------------------------------------------- camera */
  function updateCamera(dt, snap) {
    var v = G.v;
    var spd = Math.hypot(v.vx, v.vy);
    /* zoom so the jeep reads about a fifth of the screen width, easing out
       as speed rises to keep the run-up visible */
    var tz = CG.lerp(1.18, 0.95, CG.clamp(spd / 1000, 0, 1)) * (v.onGround ? 1 : 0.95);
    var tx = v.x + 0.12 * R.W / tz + CG.clamp(v.vx * 0.28, -140, 260);
    var ty = v.y - 0.05 * R.H / tz + CG.clamp(v.vy * 0.16, -80, 130);
    var kx = 7.5, ky = 5.0;
    if (G.gap && G.gap.phase !== 'done') {
      /* frame the whole question: car, both lips, and sky for the grid; the
         lips sit low in the frame so the plotted points have room above */
      var g = G.gap.g, left = Math.min(v.x, g.stopX) - 170, right = g.bx + 200;
      tz = CG.clamp(0.84 * R.W / (right - left), 0.55, 1.1);
      tx = (left + right) / 2;
      ty = (g.ay + g.by) / 2 - 0.15 * R.H / tz;      // both lips in frame, sky above for the ruler
      if (G.gap.phase === 'fail') { ty = CG.lerp(ty, v.y, 0.85); ky = 7; }   // watch it fall
      kx = 4; ky = 4;
    }
    if (snap) { R.cam.x = tx; R.cam.y = ty; R.cam.z = tz; return; }
    R.cam.z = CG.approach(R.cam.z, tz, 2.2, dt);
    R.cam.x = CG.approach(R.cam.x, tx, kx, dt);
    R.cam.y = CG.approach(R.cam.y, ty, ky, dt);
    R.shake = CG.approach(R.shake, 0, 7, dt);
  }

  /* ---------------------------------------------------------------- HUD */
  function btn(id, x, y, w, h, r) {
    var b = { id: id, x: x, y: y, w: w, h: h, r: r === undefined ? 14 : r };
    buttons.push(b);
    return b;
  }

  function barGrad(y, h, top, bottom) {
    var g = R.ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, top); g.addColorStop(1, bottom);
    return g;
  }

  /* round glass button: navy disc, white rim, a gloss cap */
  function iconBtn(id, cx, cy, rad, img, down) {
    var c = R.ctx;
    btn(id, cx - rad, cy - rad, rad * 2, rad * 2, rad);
    c.save();
    c.beginPath(); c.arc(cx, cy + 3, rad, 0, CG.TAU);
    c.fillStyle = 'rgba(8,12,26,0.35)'; c.fill();
    c.beginPath(); c.arc(cx, cy, rad, 0, CG.TAU);
    c.fillStyle = down ? barGrad(cy - rad, rad * 2, '#FFD36A', '#FF9A12')
                       : barGrad(cy - rad, rad * 2, 'rgba(44,62,104,0.9)', 'rgba(16,24,48,0.92)');
    c.fill();
    c.lineWidth = 3; c.strokeStyle = 'rgba(235,242,255,0.85)'; c.stroke();
    c.beginPath(); c.ellipse(cx, cy - rad * 0.45, rad * 0.62, rad * 0.3, 0, 0, CG.TAU);
    c.fillStyle = 'rgba(255,255,255,0.12)'; c.fill();
    var im = CG.img[img];
    if (im) {
      var s = rad * 1.15;
      c.drawImage(im, cx - s / 2, cy - s / 2, s, s);
    }
    c.restore();
  }

  /* The two controls the game cannot be played without, sitting on bright
     grass and busy soil. At 0.42 opacity over a dark wash they were a pair of
     ghost outlines: findable once you knew, invisible to a child meeting the
     game. They now carry a solid disc, a drop shadow to lift them off the
     ground texture, and a ring in their own action colour so gas and brake are
     told apart by colour rather than by which side of the screen they are on. */
  function pedal(cx, cy, rad, dir, down) {
    var c = R.ctx;
    btn(dir > 0 ? 'gas' : 'brake', cx - rad, cy - rad, rad * 2, rad * 2, rad);
    var hue = dir > 0 ? '#7CB342' : '#E53935';
    c.save();
    c.beginPath(); c.arc(cx, cy, rad, 0, CG.TAU);
    c.shadowColor = 'rgba(20,14,8,0.55)';
    c.shadowBlur = 14;
    c.shadowOffsetY = 3;
    c.fillStyle = down ? hue : 'rgba(31,24,17,0.62)';
    c.fill();
    c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetY = 0;
    c.lineWidth = 4;
    c.strokeStyle = down ? 'rgba(255,255,255,0.92)' : 'rgba(236,239,241,0.82)';
    c.stroke();
    /* the action colour, on a ring inside the rim */
    c.beginPath(); c.arc(cx, cy, rad - 10, 0, CG.TAU);
    c.lineWidth = 3;
    c.globalAlpha = down ? 0.55 : 0.85;
    c.strokeStyle = down ? '#FFF' : hue;
    c.stroke();
    c.globalAlpha = 1;
    c.fillStyle = '#FFF';
    var k = rad * 0.34;
    for (var i = 0; i < 2; i++) {
      var ox = (i - 0.5) * k * 0.9 * dir;
      c.beginPath();
      c.moveTo(cx + ox - k * 0.35 * dir, cy - k);
      c.lineTo(cx + ox + k * 0.45 * dir, cy);
      c.lineTo(cx + ox - k * 0.35 * dir, cy + k);
      c.closePath(); c.fill();
    }
    c.restore();
  }

  /* `coarse` drops the tenths — used for par and best-time labels, where a
     decimal place is noise the player never acts on. */
  function fmtTime(t, coarse) {
    var m = Math.floor(t / 60), sec = t - m * 60;
    if (coarse) sec = Math.round(sec);
    if (coarse && sec === 60) { m++; sec = 0; }
    return m + ':' + (sec < 10 ? '0' : '') + (coarse ? sec : sec.toFixed(1));
  }

  /* The route, drawn as one bar: where the checkpoints are, where the car is,
     how much is left. It is the only place the stage objective is visible
     while driving, so it stays readable at a glance and never moves. */
  function progressRibbon() {
    var c = R.ctx, W = R.W;
    /* The top row is clock | ribbon | fuel. The ribbon gets whatever is left
       between the other two, centred in THAT gap rather than on the screen —
       and if the gap is too small to be worth reading (portrait), it drops to
       its own row under the HUD instead of sliding under the fuel gauge. */
    var freeL = 246, freeR = W - 292, free = freeR - freeL;
    var narrow = free < 300;
    var bw = narrow ? Math.min(W - 40, 520) : Math.min(520, free - 28);
    var bx = narrow ? (W - bw) / 2 : freeL + (free - bw) / 2;
    var by = narrow ? 196 : 30, bh = 14;
    R.card(bx - 14, by - 15, bw + 28, bh + 30, 14);
    /* The percentage reads as part of the bar, so it lives INSIDE the panel on
       the bar's own centre line with its own reserved width. Hung under the
       right-hand end it was a loose number on the scenery, and it pushed the
       panel's only descender out past everything else in the top row. */
    var lw = 48, barw = bw - lw;
    R.roundRect(bx, by, barw, bh, bh / 2);
    c.fillStyle = 'rgba(43,33,24,0.55)'; c.fill();
    var k = CG.clamp(G.progress, 0, 1);
    if (k > 0.004) {
      R.roundRect(bx, by, Math.max(bh, barw * k), bh, bh / 2);
      c.fillStyle = barGrad(by, bh, '#C6F26A', '#5DB12A'); c.fill();
    }
    /* checkpoint pips */
    var cps = G.track.cps, i, f;
    for (i = 0; i < cps.length; i++) {
      f = CG.clamp(cps[i] / G.track.finishX, 0, 1);
      c.beginPath();
      c.arc(bx + barw * f, by + bh / 2, 6, 0, CG.TAU);
      c.fillStyle = i <= G.cpIdx ? '#FFD54F' : '#ECEFF1';
      c.fill();
      c.lineWidth = 2; c.strokeStyle = '#2B2118'; c.stroke();
    }
    /* chasm pips: a diamond per question, gold once it is bridged */
    var cs = G.track.chasms, g;
    for (i = 0; i < cs.length; i++) {
      g = cs[i];
      f = CG.clamp(g.ax / G.track.finishX, 0, 1);
      c.save();
      c.translate(bx + barw * f, by + bh / 2);
      c.rotate(Math.PI / 4);
      c.fillStyle = g.solved ? '#FFD54F' : '#C2185B';
      c.fillRect(-6, -6, 12, 12);
      c.lineWidth = 2; c.strokeStyle = '#2B2118'; c.strokeRect(-6, -6, 12, 12);
      c.restore();
    }
    /* the car */
    c.beginPath();
    c.arc(bx + barw * k, by + bh / 2, 9, 0, CG.TAU);
    c.fillStyle = '#E53935'; c.fill();
    c.lineWidth = 2.5; c.strokeStyle = '#2B2118'; c.stroke();
    R.text(Math.round(k * 100) + '%', bx + bw, by + bh / 2, 17, '#FFFFFF', 'right', 0);
    R.label(G.stage ? G.stage.name : '', bx, by - 5, 12, '#FFD86B');
  }

  /* The left-hand readouts are ONE card, not three.
     Clock, coins and lives used to be a 214-wide panel, a 140-wide panel and a
     row of hearts with no panel at all, so the corner had three different left
     edges and three different right edges and the hearts floated over the
     scenery. One card, one width, hair-line rules between the groups: the eye
     lands on the clock and walks down instead of hunting three shapes. */
  var HUD_X = 16, HUD_W = 214, HUD_PAD = 14;

  function hudRule(y) {
    var c = R.ctx;
    c.save();
    c.globalAlpha = 0.5;
    c.fillStyle = 'rgba(236,239,241,0.22)';
    c.fillRect(HUD_X + HUD_PAD, y, HUD_W - HUD_PAD * 2, 1);
    c.restore();
  }

  function drawHUD() {
    var c = R.ctx, W = R.W, i;
    var stage = G.mode === 'stage' && G.track;
    /* a single heart says nothing, so the endless run's one life is not shown;
       the row appears once there is a second heart to count */
    var hearts = (stage ? G.lives : 0) + G.safety;
    if (!stage && hearts < 2) hearts = 0;
    /* the card is sized to what it actually holds, so no empty ledge */
    var hudH = 134 + (hearts > 0 ? 42 : 0) + (stage ? 0 : 40);
    R.card(HUD_X, 14, HUD_W, hudH, 18);

    if (stage) {
      /* clock first — it is what the second star is scored on */
      var over = G.stage && G.time > G.stage.par;
      R.label('time', 30, 32, 11);
      R.text(fmtTime(G.time), 30, 57, 30, over ? '#FFB4A8' : '#FFF', 'left', 0);
      R.text('par ' + fmtTime(G.stage.par, true), 30, 83, 14, '#A9C3E6', 'left', 0);
      R.text(Math.round(Math.hypot(G.v.vx, G.v.vy) / CG.PPM * 3.6) + ' km/h',
             148, 83, 14, '#A9C3E6', 'left', 0);
      if (!(G.gap && G.gap.phase === 'ask')) progressRibbon();
    } else {
      R.label('distance', 30, 32, 11);
      R.text(Math.round(G.dist) + ' m', 30, 57, 30, '#FFF', 'left', 0);
      R.text(Math.round(Math.hypot(G.v.vx, G.v.vy) / CG.PPM * 3.6) + ' km/h',
             30, 83, 14, '#A9C3E6', 'left', 0);
      if (G.best > 0) {
        R.crown(141, 82, 7);
        R.text(Math.round(G.best) + ' m', 153, 83, 14, '#FFD86B', 'left', 0);
      }
    }

    /* coins */
    hudRule(96);
    var ci = CG.img.coin;
    if (ci) c.drawImage(ci, 0, 0, CG.SHEETS.coin.frame, CG.SHEETS.coin.frame, 30, 106, 28, 28);
    R.text(String(G.coins), 66, 121, 24, '#FFD54F', 'left', 0);

    /* lives, then any extra saves picked up this run — one row, dimmer for the
       extras, and the step tightens rather than running off the card */
    var rowY = 140;
    if (hearts > 0) {
      hudRule(rowY);
      var hi = CG.img.heart;
      var step = Math.min(28, (HUD_W - HUD_PAD * 2 - 26) / Math.max(1, hearts - 1));
      for (i = 0; i < hearts && hi; i++) {
        c.save();
        c.globalAlpha = i < (stage ? G.lives : 0) ? 1 : 0.7;
        c.drawImage(hi, 30 + i * step, rowY + 10, 26, 26);
        c.restore();
      }
      rowY += 42;
    }
    /* where and when: SUMMER · DUSK · RAIN — the thing this run is about */
    if (!stage) {
      hudRule(rowY);
      R.label(CG.Env.label(), 30, rowY + 22, 12, '#CFE3FF');
    }

    /* fuel */
    var fw = 210, fx = W - fw - 20, fy = 22;
    R.card(fx - 42, fy - 8, fw + 54, 40, 16);
    var fi = CG.img.fuel;
    if (fi) c.drawImage(fi, fx - 36, fy - 4, 28, 30);
    var k = G.fuel / FUEL_MAX;
    R.roundRect(fx, fy + 2, fw, 20, 10);
    c.fillStyle = 'rgba(5,9,20,0.6)'; c.fill();
    var col = k > 0.45 ? ['#C6F26A', '#5DB12A'] : k > 0.2 ? ['#FFE07A', '#FF9A12'] : ['#FF9C7A', '#E0301E'];
    if (k < 0.2 && Math.sin(G.time * 12) < 0) col = ['#FFE3DC', '#FFB4A8'];
    if (k > 0.005) {
      R.roundRect(fx + 2, fy + 4, Math.max(6, (fw - 4) * k), 16, 8);
      c.fillStyle = barGrad(fy + 4, 16, col[0], col[1]); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.35)';
      R.roundRect(fx + 8, fy + 6, Math.max(0, (fw - 4) * k - 14), 4, 2); c.fill();
    }

    /* top-right buttons */
    iconBtn('pause', W - 46, 84, 28, 'iconPause', false);
    iconBtn('mute', W - 112, 84, 28, G.muted ? 'soundOff' : 'soundOn', false);

    /* pedals — only while driving, so they cannot be mistaken for live
       controls on the pause or game-over screens */
    var held = G.gap && G.gap.phase !== 'drive' && G.gap.phase !== 'done';
    if (G.state === 'play' && !held) {
      var py = R.H - 96, pr = 62;
      pedal(104, py, pr, -1, G.input.brake > 0);
      pedal(W - 104, py, pr, 1, G.input.gas > 0);
    }

    /* boost flash */
    if (G.boostT > 0) {
      c.save();
      c.globalAlpha = 0.16 + 0.1 * Math.sin(G.time * 22);
      var g = c.createLinearGradient(0, 0, R.W, 0);
      g.addColorStop(0, '#FFD54F'); g.addColorStop(0.5, 'rgba(255,213,79,0)');
      g.addColorStop(1, '#FFD54F');
      c.fillStyle = g; c.fillRect(0, 0, R.W, R.H);
      c.restore();
    }
  }

  /* ------------------------------------------------------------ the ruler
     The answer is measured, not picked from a list. Beside the jeep sits a
     value box and an arrow. The arrow stretches a ruler up out of the box,
     one unit per mark, RULER_MAX marks; the player taps the number the plank
     needs, the ruler folds back with that number in the box, and the plank
     drops. Lengths already tried and failed are crossed out on the ruler.
     Screen-space: the ruler is a tool the player holds, not a thing in the
     world, and it must stay the same size at any camera zoom. */
  var RULER_W = 76, RULER_BOX = 52;

  /* Where the box sits: at roof height, ahead of the jeep, clear of the
     near lip's label. */
  function rulerAnchor() {
    var v = G.v, z = R.cam.z;
    return { x: R.sx(v.x) + 126 * z, y: R.sy(v.y) - 44 * z };
  }

  function drawRuler(q) {
    var c = R.ctx, ru = q.ruler, N = CG.Gaps.RULER_MAX, i;
    var a = rulerAnchor(), box = RULER_BOX;
    var vx = a.x, gx = a.x + box + 10, top = a.y - box / 2;      // value box, go button
    R.avoid = { l: vx - 6, r: gx + box + 6, t: top - 6, b: top + box + 10 };
    /* the ruler stands on the value box; the step shrinks on a short screen */
    var step = CG.clamp((top - 34) / N, 20, 34), full = N * step + 26;
    var h = full * ru.open, NAVY = R.NAVY, BLUE = R.Y_COL;
    if (h > 2) {
      var rx = vx + box / 2 - RULER_W / 2, ry = top - 12 - h;
      c.save();
      R.roundRect(rx - 6, ry - 6, RULER_W + 12, h + 14, 14); c.clip();
      /* a white school ruler in the same glass as the tiles */
      c.save();
      c.shadowColor = 'rgba(20,40,110,0.3)'; c.shadowBlur = 10; c.shadowOffsetY = 4;
      R.roundRect(rx, ry, RULER_W, full, 12);
      c.fillStyle = barGrad(ry, full, '#FFFFFF', '#EAF2FC'); c.fill();
      c.restore();
      R.roundRect(rx, ry, RULER_W, full, 12);
      c.lineWidth = 2; c.strokeStyle = '#C9DAEE'; c.stroke();
      c.fillStyle = 'rgba(31,107,255,0.06)'; c.fillRect(rx + 2, ry + 10, 14, full - 20);
      for (i = 1; i <= N; i++) {
        var y = ry + 14 + (N - i) * step + step / 2, dead = !!q.wrong[i], cur = ru.cursor === i;
        if (cur && !dead) {
          var hx = rx + 16, hw = RULER_W - 22, hh = step * 0.84;
          c.save();
          c.shadowColor = 'rgba(20,60,160,0.35)'; c.shadowBlur = 6; c.shadowOffsetY = 2;
          R.roundRect(hx, y - hh / 2, hw, hh, hh / 2);
          c.fillStyle = barGrad(y - hh / 2, hh, '#5FA0FF', '#1F5FE0'); c.fill();
          c.restore();
        }
        /* school-ruler ticks down the left edge: long per unit, short per quarter */
        c.strokeStyle = dead ? 'rgba(27,42,94,0.25)' : 'rgba(27,42,94,0.8)';
        c.lineWidth = 2;
        c.beginPath(); c.moveTo(rx + 2, y); c.lineTo(rx + 13, y); c.stroke();
        c.lineWidth = 1.1;
        c.beginPath();
        for (var qq = 1; qq < 4; qq++) {
          var yy = y - step * qq / 4, l = qq === 2 ? 8 : 5;
          c.moveTo(rx + 2, yy); c.lineTo(rx + 2 + l, yy);
        }
        c.stroke();
        c.save();
        if (dead) c.globalAlpha = 0.35;
        var ns = Math.min(18, step * 0.6);
        R.text(String(i), rx + 16 + (RULER_W - 22) / 2, y + 1, ns, cur && !dead ? '#FFFFFF' : NAVY, 'center', 0, false, R.CW);
        c.restore();
        if (dead) {
          c.lineCap = 'round'; c.strokeStyle = '#F0443A'; c.lineWidth = 3;
          c.beginPath(); c.moveTo(rx + 24, y); c.lineTo(rx + RULER_W - 10, y); c.stroke();
          c.lineCap = 'butt';
        }
        if (ru.open > 0.95 && !dead) btn('rul' + i, rx - 6, y - step / 2, RULER_W + 12, step, 4);
      }
      /* the little pointer down onto the box */
      c.beginPath(); c.moveTo(rx + RULER_W / 2 - 10, ry + full - 2); c.lineTo(rx + RULER_W / 2 + 10, ry + full - 2);
      c.lineTo(rx + RULER_W / 2, ry + full + 9); c.closePath();
      c.fillStyle = '#EAF2FC'; c.fill();
      c.lineJoin = 'round'; c.lineWidth = 2; c.strokeStyle = '#C9DAEE'; c.stroke();
      c.restore();
    }
    /* value box: a white glass tile - a dashed slot while empty, the number once chosen */
    c.save();
    R.roundRect(vx, top + 3, box, box, 13); c.fillStyle = '#B7CBE3'; c.fill();
    c.save();
    c.shadowColor = 'rgba(20,40,110,0.18)'; c.shadowBlur = 8; c.shadowOffsetY = 3;
    R.roundRect(vx, top, box, box, 13); c.fillStyle = barGrad(top, box, '#FFFFFF', '#E4EEFA'); c.fill();
    c.restore();
    R.roundRect(vx, top, box, box, 13); c.lineWidth = 1.5; c.strokeStyle = '#D3E1F1'; c.stroke();
    var shown = ru.value || ru.cursor;
    if (shown) {
      R.text(String(shown), vx + box / 2, top + box / 2 + 1, 26, ru.value ? BLUE : '#9DB0C8', 'center', 0, false, R.CW);
    } else {
      c.setLineDash([4, 4]); c.lineWidth = 1.75; c.strokeStyle = '#8AA4C6';
      R.roundRect(vx + 11, top + 11, box - 22, box - 22, 6); c.stroke();
      c.setLineDash([]);
    }
    c.restore();
    /* the amber play key: opens the ruler, then drops the plank */
    var ready = ru.target && ru.cursor && !q.wrong[ru.cursor] && q.phase === 'ask';
    var pulse = ready || !ru.target ? 1 + 0.05 * Math.sin(G.time * 7 + q.t * 7) : 1;
    c.save();
    c.translate(gx + box / 2, top + box / 2); c.scale(pulse, pulse); c.translate(-(gx + box / 2), -(top + box / 2));
    R.roundRect(gx, top + 3, box, box, 13); c.fillStyle = '#E39027'; c.fill();
    c.save();
    c.shadowColor = 'rgba(120,60,0,0.2)'; c.shadowBlur = 8; c.shadowOffsetY = 3;
    R.roundRect(gx, top, box, box, 13); c.fillStyle = barGrad(top, box, '#FFD968', '#FFAA24'); c.fill();
    c.restore();
    R.roundRect(gx, top, box, box, 13); c.lineWidth = 1.5; c.strokeStyle = '#F5A63A'; c.stroke();
    R.roundRect(gx + 7, top + 4, box - 14, box * 0.32, box * 0.16);
    c.fillStyle = 'rgba(255,255,255,0.38)'; c.fill();
    var cx = gx + box / 2, cy = top + box / 2 + 1;
    c.beginPath();
    if (!ru.target || ready) {                                 // play / go
      c.moveTo(cx - 7, cy - 10); c.lineTo(cx + 11, cy); c.lineTo(cx - 7, cy + 10);
    } else {                                                   // open, nothing picked: fold
      c.moveTo(cx - 12, cy - 6); c.lineTo(cx + 12, cy - 6); c.lineTo(cx, cy + 8);
    }
    c.closePath();
    c.lineJoin = 'round'; c.lineWidth = 2; c.strokeStyle = '#6B4424'; c.stroke();
    c.fillStyle = '#6B4424'; c.fill();
    c.restore();
    if (q.phase === 'ask') btn('rulopen', gx - 4, top - 4, box + 8, box + 8, 6);
  }

  function drawGapUI() {
    var q = G.gap, g = q.g, c = R.ctx, W = R.W, H = R.H;
    R.avoid = null;                    // drawRuler sets it again if the ruler is up
    if (q.phase === 'ask' && q.panel > 0.01) {
      var qq = g.q, gb = R.gridBox(g), ra = rulerAnchor();
      c.save();
      c.globalAlpha = q.panel;
      /* The question sits on a frosted glass pill with a ruler icon, in the
         strip between the HUD card and the fuel bar; where that strip is too
         narrow (a phone) it drops below the buttons, beside the ruler. */
      var rulerRight = ra.x + RULER_BOX / 2 + RULER_W / 2 + 16;
      var bandL = HUD_X + HUD_W + 14, bandR = W - 286, ty = 50, sh = 58;
      if (bandR - bandL < 420) { bandL = Math.max(rulerRight, 16); bandR = W - 16; ty = 150; sh = 52; }
      var pw = CG.clamp(bandR - bandL, 260, 580);
      var tx = CG.clamp((gb.left + gb.right) / 2, bandL + pw / 2, Math.max(bandL + pw / 2, bandR - pw / 2));
      var drop = (1 - q.panel) * -30, py = ty + drop;
      R.glass(tx - pw / 2, py - sh / 2, pw, sh, sh / 2);
      var ic = sh * 0.58, qs = Math.min(sh * 0.37, (pw - ic * 2.4 - 40) / 16.5);
      c.font = R.font(qs, false, R.CW);
      var qw = c.measureText('How many units should the plank be?').width;
      var gx0 = tx - (qw + ic * 1.9) / 2;
      R.rulerIcon(gx0 + ic * 0.4, py, ic);
      R.flick(gx0 + ic * 0.72, py + ic * 0.38, ic * 0.5, 1, 0.6);
      R.text('How many units should the plank be?', gx0 + ic * 1.35, py + 1, qs, R.NAVY, 'left', 0, false, R.CW);
      R.flick(gx0 + ic * 1.35 + qw + ic * 0.08, py, ic * 0.62, 1);
      if (q.tries > 0) {
        var bt = 'Try ' + (q.tries + 1), bs = 13;
        c.font = R.font(bs, false, R.CW);
        var bw = c.measureText(bt).width + 22, bxp = tx + pw / 2 - bw / 2 - 18, byp = py + sh / 2;
        R.roundRect(bxp - bw / 2, byp - 12, bw, 24, 12);
        c.fillStyle = barGrad(byp - 12, 24, '#FFC04D', '#FF8A1F'); c.fill();
        c.lineWidth = 1.5; c.strokeStyle = '#FFFFFF'; c.stroke();
        R.text(bt, bxp, byp + 1, bs, '#FFFFFF', 'center', 0, false, R.CW);
      }
      if (q.hint) {
        var hs = Math.min(16, pw / 30), hy = H - 62 - hs * 1.15;   // just above the tip, clear of the grid's top
        var X = R.X_COL, Y = R.Y_COL, Nv = R.NAVY;
        var hp = qq.dy === 0
          ? [['same height — just count across: ', Nv], [String(qq.dx), X]]
          : [[String(qq.dx), X], [' across, ', Nv], [String(qq.dy), Y], [g.b[1] > g.a[1] ? ' up' : ' down', Nv],
             ['   →   √(', Nv], [String(qq.dx), X], ['² + ', Nv], [String(qq.dy), Y], ['²)', Nv]];
        c.font = R.font(hs, false, R.CW);
        var hw = 0; hp.forEach(function (t) { hw += c.measureText(t[0]).width; });
        var lw = hs * 3.4, cw = Math.min(W - 32, hw + lw + hs * 2.2), cx0 = CG.clamp(tx, cw / 2 + 16, W - cw / 2 - 16);
        R.glass(cx0 - cw / 2, hy - hs * 1.2, cw, hs * 2.4, hs * 1.2);
        R.text('Hint', cx0 - cw / 2 + hs * 1.1, hy + 1, hs, '#F08A00', 'left', 0, false, R.CW);
        R.textRun(hp, cx0 + lw / 2, hy + 1, hs);
      }
      var ru = q.ruler;
      var tip = !ru.target ? 'tap the arrow to open the ruler'
              : ru.cursor && !q.wrong[ru.cursor] ? 'tap play to drop the plank'
              : 'tap the number the plank needs';
      c.restore();
      /* the ruler is the last thing to arrive, and the first thing the player
         can touch — nothing is tappable until the question is fully up */
      if (q.rulerIn > 0.01) {
        c.save();
        c.globalAlpha = q.rulerIn;
        c.font = R.font(15, false, R.CW);
        var tw2 = c.measureText(tip).width + 40;
        R.glass(W / 2 - tw2 / 2, H - 46, tw2, 34, 17, { edgeW: 1.5 });
        R.text(tip, W / 2, H - 28, 15, R.NAVY, 'center', 0, false, R.CW);
        drawRuler(q);
        c.restore();
      }
    } else if ((q.phase === 'spawn' || q.phase === 'place') && q.plank) {
      drawRuler(q);                    // folded, showing the number chosen, until the plank lands
    }
    if (q.fade > 0.005) {
      c.save();
      c.globalAlpha = q.fade;
      c.fillStyle = '#140E0A';
      c.fillRect(0, 0, W, H);
      c.restore();
    }
  }

  /* ruler controls: the arrow, a mark, or the keyboard. Nothing responds
     until the reveal has finished putting the ruler on screen — a keyboard
     player hammering Enter would otherwise answer a question still arriving. */
  function asking(q) { return q && q.phase === 'ask' && q.rulerIn > 0.5; }
  G.rulerToggle = function (open) {
    var q = G.gap;
    if (!asking(q)) return;
    q.ruler.target = open === undefined ? (q.ruler.target ? 0 : 1) : (open ? 1 : 0);
    A.sfx('click');
  };
  /* highlight a mark; the plank does not drop until the button confirms */
  G.rulerPick = function (k) {
    var q = G.gap;
    if (!asking(q) || k < 1 || k > CG.Gaps.RULER_MAX || q.wrong[k]) return;
    if (!q.ruler.target) q.ruler.target = 1;
    q.ruler.cursor = k;
    A.sfx('click');
  };
  G.rulerConfirm = function () {
    var q = G.gap;
    if (!asking(q)) return;
    var k = q.ruler.cursor;
    if (q.ruler.target && k && !q.wrong[k]) G.answer(k);
  };
  /* the amber button: open when folded, drop when a mark is lit, fold otherwise */
  G.rulerButton = function () {
    var q = G.gap;
    if (!asking(q)) return;
    if (!q.ruler.target) G.rulerToggle(true);
    else if (q.ruler.cursor && !q.wrong[q.ruler.cursor]) G.rulerConfirm();
    else G.rulerToggle(false);
  };
  G.rulerKey = function (k) {
    var q = G.gap, ru;
    if (!asking(q)) return false;
    ru = q.ruler;
    var N = CG.Gaps.RULER_MAX;
    if (k === 'Enter') { G.rulerButton(); return true; }
    if (k === 'ArrowUp' || k === 'ArrowDown') {
      var n0 = CG.clamp((ru.cursor || 0) + (k === 'ArrowUp' ? 1 : -1), 1, N);
      G.rulerPick(n0); if (!ru.target) ru.target = 1;
      return true;
    }
    if (k >= '0' && k <= '9') {
      /* two digits typed quickly make one number (1 then 3 -> 13) */
      var d = +k, n = ru.keyT > 0 ? ru.cursor * 10 + d : d;
      if (n < 1 || n > N) n = d;
      if (n >= 1 && n <= N) { G.rulerPick(n); ru.keyT = 0.8; }
      return true;
    }
    return false;
  };

  /* Chunky 3D pill: a dark lip underneath, a glossy gradient face, a fat ink
     outline, the icon on the left and an optional one-line promise under the
     label ("Hit the road and beat your best!"). */
  var BTN = {
    green:  { top: '#A6EC5E', bottom: '#4CAE22', lip: '#2E7A12', sub: '#EFFFD6' },
    orange: { top: '#FFD66E', bottom: '#FF9F1A', lip: '#C2620A', sub: '#FFF3D6' },
    blue:   { top: '#8CC4FF', bottom: '#3F7FD6', lip: '#244F93', sub: '#E3F0FF' }
  };
  var BTN_ALIAS = { '#7CB342': 'green', '#FFA000': 'orange', '#607D8B': 'blue' };

  function bigButton(id, cx, cy, w, h, label, colour, icon, sub, pulse) {
    var c = R.ctx, P = BTN[BTN_ALIAS[colour] || colour] || BTN.green;
    btn(id, cx - w / 2, cy - h / 2, w, h, h / 2);
    c.save();
    if (pulse) {
      var k = 1 + 0.025 * Math.sin(G.time * 4);
      c.translate(cx, cy); c.scale(k, k); c.translate(-cx, -cy);
    }
    var x = cx - w / 2, y = cy - h / 2, r = h / 2, d = Math.max(5, h * 0.1), ol = Math.max(3, h * 0.05);
    c.beginPath(); c.ellipse(cx, y + h + d + 2, w * 0.46, h * 0.16, 0, 0, CG.TAU);
    c.fillStyle = 'rgba(10,8,20,0.28)'; c.fill();
    R.roundRect(x, y + d, w, h, r); c.fillStyle = P.lip; c.fill();
    c.lineWidth = ol; c.strokeStyle = R.INK; c.stroke();
    R.roundRect(x, y, w, h, r); c.fillStyle = barGrad(y, h, P.top, P.bottom); c.fill();
    c.stroke();
    /* gloss */
    R.roundRect(x + r * 0.45, y + h * 0.09, w - r * 0.9, h * 0.34, h * 0.17);
    c.fillStyle = 'rgba(255,255,255,0.3)'; c.fill();
    var tx = cx, im = icon && CG.img[icon], avail = w;
    if (im) {
      var s = h * 0.66, ix = x + h * 0.14;
      c.drawImage(im, ix, cy - s / 2, s, s);
      tx = (ix + s + x + w) / 2 - h * 0.06; avail = x + w - (ix + s) - h * 0.3;
    }
    var fs = Math.min(sub ? h * 0.36 : h * 0.44, avail / Math.max(3, label.length * 0.62));
    var ly = sub ? cy - h * 0.1 : cy + 1;
    R.text(label, tx, ly + 2, fs, 'rgba(59,31,12,0.5)', 'center', fs * 0.24, true);
    R.text(label, tx, ly, fs, '#FFFFFF', 'center', fs * 0.24, true);
    if (sub) {
      var ss = Math.min(h * 0.155, avail / (sub.length * 0.55));
      R.text(sub, tx, cy + h * 0.24, ss, P.sub, 'center', 0);
    }
    c.restore();
  }

  /* One size knob per screen: every layout below is designed at 900x720
     and scaled, so a phone gets the same composition, smaller. */
  function uiScale() {
    return CG.clamp(Math.min(R.W / 900, R.H / 720), 0.55, 1.3);
  }

  /* A row of stats on one glass card: [{label, value, icon, col}] */
  function statStrip(cx, cy, w, h, cells, u) {
    var c = R.ctx, n = cells.length, cw = w / n, i;
    R.card(cx - w / 2, cy - h / 2, w, h, 16 * u);
    for (i = 0; i < n; i++) {
      var cl = cells[i], x0 = cx - w / 2 + i * cw;
      if (i) {
        c.fillStyle = 'rgba(170,200,255,0.22)';
        c.fillRect(x0, cy - h * 0.3, 1.5, h * 0.6);
      }
      var ix = x0 + 22 * u, iy = cy, is = 15 * u;
      if (cl.icon === 'coin' && CG.img.coin) {
        c.drawImage(CG.img.coin, 0, 0, CG.SHEETS.coin.frame, CG.SHEETS.coin.frame, ix - is, iy - is, is * 2, is * 2);
      } else if (cl.icon === 'crown') R.crown(ix, iy, is * 0.85);
      else if (cl.icon === 'flag') {
        c.save();
        c.lineWidth = 3 * u; c.strokeStyle = '#E8EEF8'; c.lineCap = 'round';
        c.beginPath(); c.moveTo(ix - is * 0.6, iy + is); c.lineTo(ix - is * 0.6, iy - is); c.stroke();
        c.fillStyle = '#FF6A4A';
        c.beginPath(); c.moveTo(ix - is * 0.6, iy - is); c.lineTo(ix + is, iy - is * 0.5);
        c.lineTo(ix - is * 0.6, iy); c.closePath(); c.fill();
        c.restore();
      } else if (cl.icon === 'pin') {
        c.save();
        c.beginPath(); c.arc(ix, iy - is * 0.3, is * 0.62, Math.PI * 0.85, Math.PI * 2.15);
        c.lineTo(ix, iy + is); c.closePath();
        c.fillStyle = '#5FB4FF'; c.fill();
        c.beginPath(); c.arc(ix, iy - is * 0.3, is * 0.25, 0, CG.TAU);
        c.fillStyle = '#10182E'; c.fill();
        c.restore();
      }
      var tx = ix + is + 10 * u;
      R.label(cl.label, tx, cy - 11 * u, 10.5 * u, '#A9C3E6');
      R.text(cl.value, tx, cy + 11 * u, 21 * u, cl.col || '#FFFFFF', 'left', 0);
    }
  }

  function dim(alpha) {
    var c = R.ctx;
    c.fillStyle = 'rgba(20,14,10,' + alpha + ')';
    c.fillRect(0, 0, R.W, R.H);
  }

  /* n filled of 3. `t` staggers them in on the stage-clear screen. */
  function starRow(cx, cy, n, size, t) {
    var c = R.ctx, im = CG.img.star, gap = size * 1.12, i, x, pop;
    for (i = 0; i < 3; i++) {
      x = cx + (i - 1) * gap;
      pop = t === undefined ? 1 : CG.clamp((t - 0.35 - i * 0.42) * 3.2, 0, 1);
      var sc = i < n ? (0.7 + 0.3 * pop) * (1 + 0.25 * Math.sin(pop * Math.PI)) : 1;
      c.save();
      c.translate(x, cy);
      c.scale(sc, sc);
      c.globalAlpha = i < n ? pop : 0.22;
      if (im) c.drawImage(im, -size / 2, -size / 2, size, size);
      else {
        c.beginPath(); c.arc(0, 0, size / 2, 0, CG.TAU);
        c.fillStyle = i < n ? '#FFD54F' : '#455A64'; c.fill();
      }
      c.restore();
    }
  }

  function drawTitle() {
    var c = R.ctx, W = R.W, H = R.H, u = uiScale();
    /* a soft wash behind the logo instead of dimming the whole scene */
    var wash = c.createLinearGradient(0, 0, 0, H * 0.42);
    wash.addColorStop(0, 'rgba(20,16,40,0.38)'); wash.addColorStop(1, 'rgba(20,16,40,0)');
    c.fillStyle = wash; c.fillRect(0, 0, W, H * 0.42);
    var ts = Math.min(124 * u, W * 0.14), ty = H * 0.17 + ts * 0.1;
    var tw = R.title([['CLIMB', 'gold'], ['GAME', 'blue']], W / 2, ty, ts, { t: G.time });
    R.sparks(W / 2, ty, tw / 2 + ts * 0.1, ts * 0.42, G.time);

    var bw = 330 * u, bh = 90 * u, py = Math.min(H * 0.8, H - bh / 2 - 34 * u);
    R.sparks(W / 2, py, bw / 2 + 6 * u, 26 * u, G.time);
    bigButton('play', W / 2, py, bw, bh, 'PLAY', 'green', 'iconPlay', null, true);

    iconBtn('mute', W - 46, 46, 26, G.muted ? 'soundOff' : 'soundOn', false);
  }

  /* ------------------------------------------------------------ stage map */
  function drawSelect() {
    var c = R.ctx, W = R.W, H = R.H, n = CG.Stages.length, u = uiScale();
    dim(0.5);
    var ts = Math.min(62 * u, W * 0.08);
    R.title([['CHOOSE A', 'gold'], ['CLIMB', 'blue']], W / 2, H * 0.1, ts, { wobble: 0.6 });
    R.ribbon(G.totalStars() + ' of ' + (n * 3) + ' stars collected', W / 2, H * 0.1 + ts * 0.85, Math.max(12, 16 * u));

    var cols = 4, rows = Math.ceil(n / cols);
    var gap = 18, cw = Math.min(250, (W - 80 - gap * (cols - 1)) / cols), ch = 118;
    var gx = (W - (cw * cols + gap * (cols - 1))) / 2, gy = H * 0.225;

    for (var i = 0; i < n; i++) {
      var st = CG.Stages[i], open = G.unlocked(i), rec = G.record(st.id);
      var x = gx + (i % cols) * (cw + gap), y = gy + Math.floor(i / cols) * (ch + gap);
      if (open) btn('s' + i, x, y, cw, ch, 16);
      R.card(x, y, cw, ch, 16, open ? { edge: 'rgba(198,242,106,0.55)' }
                                    : { top: 'rgba(30,36,52,0.6)', bottom: 'rgba(20,24,36,0.62)' });
      /* number medallion */
      c.beginPath(); c.arc(x + 26, y + 30, 16, 0, CG.TAU);
      c.fillStyle = open ? barGrad(y + 14, 32, '#FFE680', '#FFAE1F') : '#4A5468'; c.fill();
      c.lineWidth = 3; c.strokeStyle = R.INK; c.stroke();
      R.text(String(st.id), x + 26, y + 31, 19, open ? '#FFFFFF' : '#9AA6BA', 'center', open ? 4 : 0, true);
      R.text(open ? st.name : 'LOCKED', x + 50, y + 31, Math.min(19, (cw - 60) / (st.name.length * 0.52)),
             open ? '#FFF' : '#8190A8', 'left', 0, true);
      if (open) {
        R.text(st.sub, x + 16, y + 58, 13, '#A9C3E6', 'left', 0);
        starRow(x + cw / 2, y + 86, rec ? rec.s : 0, 26);
        if (rec) R.text(fmtTime(rec.t), x + cw - 14, y + 108, 13, '#C6F26A', 'right', 0);
      } else {
        R.text('clear stage ' + i + ' first', x + 16, y + 78, 14, '#8190A8', 'left', 0);
      }
    }

    var by = Math.min(gy + rows * (ch + gap) + 30, H - 56), bh = 64 * Math.min(1, u);
    if (G.endlessOpen()) {
      bigButton('endless', W / 2 - 130, by, 240, bh, 'ENDLESS', 'orange', null);
      bigButton('home', W / 2 + 130, by, 200, bh, 'HOME', 'blue', 'iconHome');
    } else {
      bigButton('home', W / 2, by, 240, bh, 'HOME', 'blue', 'iconHome');
    }
    iconBtn('mute', W - 46, 46, 26, G.muted ? 'soundOff' : 'soundOn', false);
  }

  /* A hanging wooden headline sign with up to two title lines and a strap
     under it. Returns the y of the sign's bottom edge. */
  function headline(l1, g1, l2, g2, strap, u) {
    var W = R.W, H = R.H;
    var sw = Math.min(560 * u, W - 32), s1 = Math.min(60 * u, sw / (l1.length * 0.62));
    var s2 = l2 ? Math.min(46 * u, sw / (l2.length * 0.62)) : 0;
    var sh = s1 * 1.35 + (l2 ? s2 * 1.2 : 0) + 34 * u;
    var cy = Math.max(sh / 2 + 18 * u, H * 0.06 + sh / 2);
    R.woodSign(W / 2, cy, sw, sh, { ropes: true });
    var y1 = cy - sh / 2 + 18 * u + s1 * 0.62;
    R.title(l1, W / 2, y1, s1, { grad: g1, t: G.time });
    if (l2) R.title(l2, W / 2, y1 + s1 * 0.62 + s2 * 0.72, s2, { grad: g2, wobble: 0.5 });
    if (strap) R.ribbon(strap, W / 2, cy + sh / 2 + 4 * u, Math.max(12, 17 * u), { maxW: W - 40 });
    return cy + sh / 2;
  }

  /* --------------------------------------------------------- stage clear */
  function drawWin() {
    var c = R.ctx, W = R.W, H = R.H, st = G.stage, u = uiScale();
    dim(0.5);
    var bottom = headline('STAGE CLEAR!', 'green', null, null, st.name, u);
    var sy = bottom + 70 * u;
    starRow(W / 2, sy, G.stars, 76 * u, G.winT);

    /* results: label | value | what the star needed, on a fixed grid so a
       long time or a four-digit coin count cannot collide */
    var pw = Math.min(470 * u, W - 32), px = W / 2 - pw / 2, rh = 34 * u, ly = sy + 70 * u;
    R.card(px, ly - 26 * u, pw, rh * 3 + 18 * u, 16 * u);
    var lab = px + 24 * u, val = px + pw * 0.58, goal = px + pw - 20 * u, fs = 22 * u;
    function row(y, name, v, good, need) {
      R.label(name, lab, y, 12 * u);
      R.text(v, val, y, fs, good ? '#C6F26A' : '#FFB4A8', 'right', 0);
      R.text(need, goal, y, 13 * u, '#8FA6C6', 'right', 0);
    }
    row(ly, 'time', fmtTime(G.time), G.time <= st.par, 'par ' + fmtTime(st.par, true));
    row(ly + rh, 'coins', String(G.coins), G.coins >= st.coins, 'goal ' + st.coins);
    row(ly + rh * 2, 'gaps', G.firstTry + ' / ' + G.gapCount, G.firstTry === G.gapCount, 'first try');
    var by = ly + rh * 3 + 20 * u;
    if (G.newBest) R.badge('NEW BEST TIME!', W / 2, by + 14 * u, 17 * u, G.winT);

    var last = G.stageIdx >= CG.Stages.length - 1, bh = 76 * u, y2 = Math.min(by + 80 * u, H - 150 * u);
    bigButton(last ? 'map' : 'next', W / 2 - 115 * u, y2, 250 * u, bh,
              last ? 'MAP' : 'NEXT', 'green', 'iconPlay', last ? null : 'On to the next climb', true);
    bigButton('retry', W / 2 + 125 * u, y2, 210 * u, bh, 'RETRY', 'orange', 'iconRestart', 'Chase 3 stars');
    bigButton('map', W / 2, y2 + bh + 22 * u, 220 * u, 56 * u, 'STAGE MAP', 'blue', 'iconHome');
  }

  function drawPaused() {
    var W = R.W, H = R.H, u = uiScale();
    dim(0.5);
    var bottom = headline('PAUSED', 'gold', null, null, 'Take a breather!', u);
    var y = Math.max(bottom + 90 * u, H * 0.42), bw = 320 * u;
    bigButton('resume', W / 2, y, bw, 82 * u, 'RESUME', 'green', 'iconPlay', 'Back on the road', true);
    bigButton('retry', W / 2, y + 108 * u, bw, 70 * u, 'RESTART', 'orange', 'iconRestart');
    bigButton(G.mode === 'stage' ? 'map' : 'home', W / 2, y + 200 * u, bw, 70 * u,
              G.mode === 'stage' ? 'STAGE MAP' : 'QUIT', 'blue', 'iconHome');
  }

  /* what went wrong, said the way a friend would: [headline, strap] */
  var REASON = {
    head: ['ROOF LANDING!', 'Keep the rubber side down!'],
    flipped: ['FLIPPED OVER!', 'Lean back on the big jumps!'],
    fuel: ['OUT OF FUEL!', 'Your ride needs a refill!']
  };

  function drawOver() {
    var c = R.ctx, W = R.W, H = R.H, u = uiScale();
    var why = REASON[G.reason] || ['CRASHED!', 'Shake it off and go again!'];
    var stage = G.mode === 'stage' && G.track;
    dim(0.5);
    var bottom = headline('WHOOPS!', 'gold', why[0], 'white',
                          stage ? G.stage.name + '  \u00b7  stage failed' : why[1], u);
    var y = bottom + 34 * u + 30 * u;
    if (stage) {
      R.label('route covered', W / 2, y - 26 * u, 13 * u, '#FFE7A8', 'center');
      R.title(Math.round(G.progress * 100) + '%', W / 2, y + 16 * u, 64 * u, { grad: 'gold', wobble: 0 });
    } else {
      R.label('distance', W / 2, y - 26 * u, 13 * u, '#FFE7A8', 'center');
      R.title(Math.round(G.dist) + ' m', W / 2, y + 16 * u, 64 * u, { grad: 'gold', wobble: 0 });
    }
    var yb = y + 70 * u;
    if (!stage && G.newBest) R.badge('NEW BEST!', W / 2, yb, 18 * u, G.time);

    var cells = stage
      ? [{ label: 'coins earned', value: '+' + G.coins, icon: 'coin', col: '#FFD54F' },
         { label: 'checkpoint', value: G.cpIdx >= 0 ? String(G.cpIdx + 1) : 'none', icon: 'flag' }]
      : [{ label: 'coins earned', value: '+' + G.coins, icon: 'coin', col: '#FFD54F' },
         { label: 'best', value: Math.round(G.best) + ' m', icon: 'crown' },
         { label: 'season', value: String(CG.Env.season || '').toUpperCase(), icon: 'pin' }];
    var sy = yb + (!stage && G.newBest ? 52 : 26) * u + 10 * u;
    statStrip(W / 2, sy, Math.min(cells.length * 170 * u, W - 32), 60 * u, cells, u);

    var ty = Math.min(sy + 100 * u, H - 180 * u), bh = 86 * u;
    R.sparks(W / 2, ty, 170 * u, 24 * u, G.time);
    bigButton('retry', W / 2, ty, 340 * u, bh, 'TRY AGAIN', 'green', 'iconRestart',
              'Hit the road and beat your best!', true);
    bigButton(stage ? 'map' : 'home', W / 2, ty + bh + 26 * u, 250 * u, 66 * u,
              stage ? 'STAGE MAP' : 'HOME', 'blue', 'iconHome', stage ? 'Pick another climb' : 'Back to main menu');
  }

  /* --------------------------------------------------------------- draw */
  function draw(dt) {
    var c = R.ctx;
    buttons.length = 0;
    R.begin();
    var q = G.gap;
    var chasmSrc = G.track || (G.mode === 'endless' ? CG.Endless : null);
    R.drawBackground();
    R.horizon();
    R.drawGroundHaze();
    R.drawProps(true);
    if (q) R.drawGrid(q.g, q.grid, q.axes);
    if (chasmSrc) R.drawChasmDepth(chasmSrc);
    R.drawTerrain();
    if (chasmSrc) R.drawChasmWalls(chasmSrc);
    R.drawProps(false);
    if (G.track) R.drawFinish(G.track, G.time);
    R.drawPickups(G.time);
    R.drawFX(false);
    R.drawPlanks(q && q.plank);
    if (q && q.plank && q.phase !== 'ask') {
      R.drawPlank(G.plankPose(), q.len + ' units');
    }
    if (q) R.drawGapPoints(q.g, q.ptA, q.hint && q.phase === 'ask', q.ptB);
    R.drawVehicle(G.v, dt);
    R.drawFX(true);
    R.drawForeground();
    R.drawGrade();
    R.drawWeather(dt);
    R.drawTexts();

    if (G.state === 'title') drawTitle();
    else if (G.state === 'select') drawSelect();
    else {
      drawHUD();
      if (q && G.state === 'play') drawGapUI();
      if (G.state === 'paused') drawPaused();
      else if (G.state === 'over') drawOver();
      else if (G.state === 'win') drawWin();
    }
  }

  /* --------------------------------------------------------------- loop */
  var last = 0, emaMs = 8, adjustAt = 0, showStats = false;

  /* If frames run long, render fewer pixels rather than dropping frames. */
  function autoQuality(now, ms) {
    emaMs += (ms - emaMs) * 0.1;
    if (now < adjustAt) return;
    if (emaMs > 21 && R.quality > 0.56) {
      adjustAt = now + 1600; R.setQuality(R.quality - 0.15); emaMs = 12;
    } else if (emaMs < 10.5 && R.quality < 1) {
      adjustAt = now + 3000; R.setQuality(R.quality + 0.15); emaMs = 12;
    }
  }

  function frame(ts) {
    var t0 = performance.now();
    var dt = last ? Math.min(0.05, (ts - last) / 1000) : 0.016;
    last = ts;
    if (G.state === 'play') {
      updatePlay(dt);
      updateCamera(dt, false);
      FX.update(dt);
    } else if (G.state === 'title' || G.state === 'select') {
      G.time += dt;
      stepPhysics(dt, false);
      updateCamera(dt * 0.6, false);
      FX.update(dt);
    } else if (G.state === 'win') {
      G.winT += dt;
      stepPhysics(dt, false, SLOWDOWN);      // the driver eases to a stop
      updateCamera(dt, false);
      FX.update(dt);
      A.drive(0, 0, 0, false);
      /* one chime per star, timed to the pop in starRow() */
      var want = 0;
      for (var si = 0; si < G.stars; si++) if (G.winT > 0.35 + si * 0.42) want++;
      if (want > G.starsPopped) { G.starsPopped = want; A.sfx('star'); }
    } else if (G.state === 'over') {
      G.time += dt;
      stepPhysics(dt, false);
      updateCamera(dt, false);
      FX.update(dt);
      A.drive(0, 0, 0, false);
    }
    if (G.state !== 'play' && A.screechV) A.screechRelease();
    CG.World.prune(R.cam.x - R.W / R.cam.z);
    draw(dt);
    if (showStats) {
      R.panel(R.W / 2 - 108, 8, 216, 30, 10, 'rgba(43,33,24,0.6)');
      R.text(emaMs.toFixed(1) + ' ms   q' + R.quality.toFixed(2) +
             '   ' + Math.round(1000 / Math.max(0.1, emaMs)) + ' fps',
             R.W / 2, 23, 17, '#AED581', 'center', 3);
    }
    autoQuality(t0, performance.now() - t0);
    requestAnimationFrame(frame);
  }

  /* -------------------------------------------------------------- input */
  function hit(b, x, y) {
    if (b.r >= b.h / 2) {                      // circular button
      var cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      return Math.hypot(x - cx, y - cy) <= b.w / 2 + 6;
    }
    return x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
  }

  function press(id) {
    A.sfx('click');
    if (id === 'rulopen') { G.rulerButton(); return; }
    if (id.slice(0, 3) === 'rul') {
      var k = +id.slice(3);
      if (G.gap && G.gap.ruler.cursor === k) G.rulerConfirm(); else G.rulerPick(k);   // twice = go
      return;
    }
    if (id.charAt(0) === 's' && id.length > 1 && id !== 'select') {
      var i = +id.slice(1);
      if (i === i && G.unlocked(i)) G.startStage(i);
      return;
    }
    switch (id) {
      case 'play': G.startEndless(); A.music(true); break;
      case 'retry': G.restart(); break;
      case 'next': G.startStage(G.stageIdx + 1); break;
      case 'map': G.toSelect(); break;
      case 'endless': G.startEndless(); break;
      case 'home': G.toTitle(); break;
      case 'pause': if (G.state === 'play') G.state = 'paused'; break;
      case 'resume': if (G.state === 'paused') G.state = 'play'; break;
      case 'mute':
        G.muted = !G.muted; A.setMuted(G.muted); save(); break;
    }
  }

  function toLogical(e) {
    var r = R.canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * R.W, y: (e.clientY - r.top) / r.height * R.H };
  }

  function onDown(e) {
    A.init(); A.resume();
    var p = toLogical(e), i, b;
    R.canvas.setPointerCapture && R.canvas.setPointerCapture(e.pointerId);
    /* UI first */
    for (i = buttons.length - 1; i >= 0; i--) {
      b = buttons[i];
      if (b.id === 'gas' || b.id === 'brake') continue;
      if (hit(b, p.x, p.y)) { pointers[e.pointerId] = b.id; press(b.id); return; }
    }
    if (G.state !== 'play') {
      /* a tap anywhere on the title screen starts a run */
      if (G.state === 'title') { pointers[e.pointerId] = 'play'; press('play'); }
      return;
    }
    if (G.gap && G.gap.phase !== 'drive' && G.gap.phase !== 'done') return;   // pedals are away
    /* whole bottom half is a pedal — forgiving on touch */
    var side = p.x > R.W / 2 ? 'gas' : 'brake';
    pointers[e.pointerId] = side;
    G.input[side] = 1;
  }

  function onUp(e) {
    var id = pointers[e.pointerId];
    delete pointers[e.pointerId];
    if (id === 'gas' || id === 'brake') {
      /* only release if no other pointer still holds that side */
      for (var k in pointers) if (pointers[k] === id) return;
      G.input[id] = 0;
    }
  }

  function syncKeys() {
    G.input.gas = (keys.right || keys.space) ? 1 : 0;
    G.input.brake = keys.left ? 1 : 0;
  }

  function onKey(e, dn) {
    var k = e.key;
    if (dn && G.state === 'play' && G.gap && G.gap.phase === 'ask' && G.rulerKey(k)) {
      e.preventDefault(); return;
    }
    if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = dn;
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = dn;
    else if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') keys.space = dn;
    else if (dn && (k === 'p' || k === 'P' || k === 'Escape')) {
      press(G.state === 'paused' ? 'resume' : 'pause');
    } else if (dn && (k === 'r' || k === 'R')) {
      if (G.state !== 'title') press('retry');
    } else if (dn && (k === 'm' || k === 'M')) press('mute');
    else if (dn && (k === 'Enter') && G.state !== 'play') {
      if (G.state === 'title') press('play');
      else if (G.state === 'win') press(G.stageIdx >= CG.Stages.length - 1 ? 'map' : 'next');
      else if (G.state === 'select') press('s' + G.stageIdx);
      else press('retry');
    } else return;
    if (dn) { A.init(); A.resume(); }
    e.preventDefault();
    syncKeys();
  }

  /* --------------------------------------------------------------- boot */
  /* Dev hooks: ?seed=123 replays an exact track, ?demo=1 auto-drives. */
  function urlOpts() {
    var o = {}, q = (location.search || '').replace(/^\?/, '').split('&');
    for (var i = 0; i < q.length; i++) {
      var kv = q[i].split('=');
      if (kv[0]) o[kv[0]] = kv.length > 1 ? decodeURIComponent(kv[1]) : '1';
    }
    return o;
  }

  CG.boot = function () {
    var canvas = document.getElementById('c');
    R.attach(canvas);
    load();
    A.muted = G.muted;

    window.addEventListener('resize', function () { R.resize(); });
    window.addEventListener('orientationchange', function () { setTimeout(R.resize, 120); });
    canvas.addEventListener('pointerdown', onDown);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    window.addEventListener('keydown', function (e) { onKey(e, true); });
    window.addEventListener('keyup', function (e) { onKey(e, false); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && G.state === 'play') G.state = 'paused';
    });

    var fill = document.getElementById('fill'), boot = document.getElementById('boot');
    var msg = document.getElementById('bootmsg');

    /* Never fail to a blank canvas — say what broke, on screen. */
    window.addEventListener('error', function (e) {
      boot.classList.remove('gone');
      boot.style.display = 'flex';
      msg.textContent = 'ERROR: ' + (e.message || e.type) +
        (e.lineno ? ' (line ' + e.lineno + ')' : '');
    });

    /* the canvas UI measures text every frame; make sure it measures the
       real faces, not the fallback, from the first title screen on */
    if (document.fonts && document.fonts.load) {
      document.fonts.load('40px "Lilita One"');
      document.fonts.load('900 20px "Nunito"');
    }

    var opts = urlOpts();
    showStats = !!opts.stats;
    if (opts.q) R.setQuality(+opts.q);
    CG.loadAssets(
      function (p) { fill.style.width = Math.round(p * 100) + '%'; },
      function (failed) {
        if (failed.length) msg.textContent = failed.length + ' asset(s) missing';
        CG.loadThemes();
        /* ?season=winter&clock=0.95&weather=snow pins the scene, for looking */
        if (opts.season || opts.clock || opts.weather) {
          CG.Env.force = { season: opts.season || undefined,
                           clock: opts.clock !== undefined ? +opts.clock : undefined,
                           weather: opts.weather || undefined };
        }
        G.toTitle();
        if (opts.demo || opts.seed || opts.stage) {
          if (opts.seed) {
            /* ?seed=123 is an endless replay of one exact noise field */
            G.startEndless();
            G.seed = (+opts.seed) | 0 || 1;
            CG.Terrain.setSeed(G.seed);
            CG.Terrain.setTrack(null);
            CG.Endless.reset(G.seed);
            CG.World.init(G.seed, null);
            G.v.reset(160);
            R.cam.x = G.v.x; R.cam.y = G.v.y;
          } else {
            G.startStage(((+opts.stage) | 0 || 1) - 1);
          }
          if (opts.demo) G.input.gas = 1;
        }
        requestAnimationFrame(frame);
        setTimeout(function () {
          boot.classList.add('gone');
          setTimeout(function () { boot.style.display = 'none'; }, 500);
        }, failed.length ? 900 : 180);
      }
    );
  };
})(CG);

CG.boot();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2F4A93">
<title>Climb Game</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #1b1410; color: #ECEFF1;
    font-family: "Nunito", "Baloo 2", "Trebuchet MS", "Avenir Next", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    touch-action: none; overscroll-behavior: none;
  }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: linear-gradient(#FBC58C, #2F4A93); z-index: 10;
    transition: opacity .45s ease; font-weight: 800; letter-spacing: .06em;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #bar { width: min(60vw, 320px); height: 14px; border-radius: 99px;
         background: rgba(43,33,24,.35); overflow: hidden;
         box-shadow: inset 0 2px 6px rgba(43,33,24,.4); }
  #fill { height: 100%; width: 0%; border-radius: 99px;
          background: linear-gradient(#FFD54F, #FFA000); transition: width .2s ease; }
  #boot h1 { margin: 0; font-size: clamp(28px, 7vw, 54px); text-shadow: 0 3px 0 #2B2118; }
  #boot p { margin: 0; font-size: 14px; opacity: .85; text-shadow: 0 2px 0 rgba(43,33,24,.5); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="boot">
  <h1>CLIMB</h1>
  <div id="bar"><div id="fill"></div></div>
  <p id="bootmsg">loading art&hellip;</p>
</div>
<script>
/* =====================================================================
   CLIMB — a side-scrolling physics climber.
   Single file by design: open index.html directly, no server needed.

   Layout of this script:
     PHYSICS-CORE   maths, procedural terrain, vehicle dynamics  (headless-
                    testable: tools/sim_test.js extracts this block verbatim
                    and runs it under Node, so it must not touch the DOM)
     ASSETS         image loading
     AUDIO          WebAudio engine/tyre/pickup synthesis, no audio files
     WORLD          deterministic chunked props, pickups, particles
     RENDER         parallax, terrain ribbon, vehicle assembly, HUD
     GAME           loop, camera, input, screens
   ===================================================================== */

/* ============================ PHYSICS-CORE-START ============================ */
/* Shared math + small helpers. No DOM access — this file must run under Node
   so the physics can be validated headlessly (see tools/sim_test.js). */
var CG = globalThis.CG = globalThis.CG || {};

CG.TAU = Math.PI * 2;

CG.clamp = function (v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; };
CG.lerp = function (a, b, t) { return a + (b - a) * t; };
CG.smoothstep = function (e0, e1, x) {
  var t = CG.clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
};
CG.sign = function (v) { return v < 0 ? -1 : v > 0 ? 1 : 0; };
CG.approach = function (cur, target, rate, dt) {
  // frame-rate independent exponential approach
  return target + (cur - target) * Math.exp(-rate * dt);
};

/* Deterministic hash noise — the terrain is a pure function of x, so the track
   is infinite and needs no stored heightmap. */
CG.hash1 = function (i, seed) {
  // Math.imul, not `*`: plain multiplication of two 32-bit ints exceeds 2^53,
  // silently loses the low bits and leaves the hash badly non-uniform.
  var h = (Math.imul(i | 0, 374761393) + Math.imul(seed | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = h ^ (h >>> 16);
  return (h >>> 0) / 4294967296;
};

/* Value noise with smoothstep interpolation: C1 continuous, so the terrain has
   no slope discontinuities for the wheels to catch on. */
CG.vnoise = function (x, seed) {
  var i = Math.floor(x), f = x - i;
  var a = CG.hash1(i, seed), b = CG.hash1(i + 1, seed);
  return a + (b - a) * (f * f * (3 - 2 * f));
};

/* Seeded RNG for world decoration (props, pickups) — mulberry32. */
CG.rng = function (seed) {
  var s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};

CG.fmt = function (n, d) { return n.toFixed(d === undefined ? 0 : d); };

/* Infinite procedural terrain.
   The surface is a PURE FUNCTION of x — nothing is stored, so the track is
   endless, deterministic per seed, and identical on every replay of that seed. */
(function (CG) {
  'use strict';

  CG.PPM = 50;          // pixels per metre (world scale, per the art brief)
  CG.BASE_Y = 300;      // surface y at the start line (y grows downward)

  var FEAT_SPACING = 1700;

  var Terrain = CG.Terrain = {
    seed: 1,
    track: null,

    setSeed: function (s) { this.seed = (s | 0) || 1; },

    /* A stage hands the terrain an authored pathway (see the PATHWAY module).
       With no track set the old endless noise field is used instead, which is
       what the title screen and the unlocked endless mode still run on. */
    setTrack: function (t) { this.track = t || null; },

    /* Sparse launch ramps / big rollers, laid down on top of the noise so the
       track has deliberate jumps instead of only rolling hills. */
    features: function (x) {
      var sum = 0, sd = this.seed * 7919;
      var k0 = Math.floor(x / FEAT_SPACING) - 1;
      for (var k = k0; k <= k0 + 2; k++) {
        if (k < 1) continue;
        var r1 = CG.hash1(k, 901 + sd), r2 = CG.hash1(k, 902 + sd), r3 = CG.hash1(k, 903 + sd);
        if (r1 < 0.42) continue;
        var cx = k * FEAT_SPACING + r2 * 1100;
        var w = 100 + r3 * 110;
        var t = (x - cx) / w;
        if (t < -3.5 || t > 5) continue;
        var amp = 30 + r1 * 80;
        sum += amp * Math.exp(-t * t);
        // A third of them are kickers: the ramp is followed by a dip, so the
        // ground falls away at the crest instead of catching the car again.
        if (r1 > 0.72) sum -= amp * 0.55 * Math.exp(-(t - 1.9) * (t - 1.9));
      }
      return sum;
    },

    /* Height above the base line. Grows rougher with distance. */
    elevation: function (x) {
      if (this.track) {
        /* fine grain on top of the authored curve: too small to change where
           the car lands, big enough that the ground is not visibly synthetic.
           A chasm part opts out: its two lips ARE the plotted points, and a
           point that is 3px off its own grid line is a point a child cannot
           read. */
        var part = this.track.at(x);
        if (part && part.exact) return this.track.elevation(x);
        return this.track.elevation(x) + CG.vnoise(x / 74, 67 + this.seed * 7919) * 3;
      }
      var sd = this.seed * 7919;
      var diff = 1 - Math.exp(-Math.max(0, x) / 7000);   // 0 -> 1 difficulty ramp
      var h = 0;
      // Difficulty rides mainly on the LONG wavelengths: that buys tall climbs
      // without creating walls the car physically cannot get up.
      // Amplitudes are chosen from the slope each octave contributes
      // (d/dx of smoothstep value noise ~= 0.5 * amp / wavelength).
      h += CG.vnoise(x / 1600, 11 + sd) * (128 + 320 * diff);
      h += CG.vnoise(x / 900, 23 + sd) * (100 + 102 * diff);
      h += CG.vnoise(x / 380, 37 + sd) * (48 + 24 * diff);
      h += CG.vnoise(x / 165, 53 + sd) * (14 + 7 * diff);
      h += CG.vnoise(x / 72, 67 + sd) * (3 + 2 * diff);
      h += this.features(x) * (0.45 + 0.55 * diff);
      return h;
    },

    /* Bare ground y in world space — the dirt, with no planks laid over it.
       The first 900px are flattened to the start height so the player always
       begins on level ground. The renderer draws THIS, so a chasm still looks
       like a chasm once it has been bridged. */
    ground: function (x) {
      var h = this.elevation(x);
      var s = CG.smoothstep(120, 1000, x);
      if (s < 1) h = CG.lerp(this.elevation(0), h, s);
      return CG.BASE_Y - h;
    },

    /* PLANKS — the bridges the player earns by answering. Each is a straight
       driving surface {x0,y0,x1,y1} (top edge, x0 < x1) laid over the ground;
       the car drives on whichever is higher, so a plank over a pit is a road
       and a plank that stops short is a road that ends in mid-air. Planks are
       part of the physics surface, not decoration: the vehicle, the bot in
       tools/stage_test.js and the game all see exactly the same thing. */
    planks: [],
    setPlanks: function (list) { this.planks = list || []; },
    addPlank: function (p) { this.planks.push(p); },

    /* Driving surface y in world space: ground, or a plank if one is higher. */
    y: function (x) {
      var y = this.ground(x), ps = this.planks, i, p;
      for (i = 0; i < ps.length; i++) {
        p = ps[i];
        if (x < p.x0 || x > p.x1) continue;
        var py = p.y0 + (x - p.x0) * (p.y1 - p.y0) / (p.x1 - p.x0);
        if (py < y) y = py;
      }
      return y;
    },

    /* Is x on a plank (rather than on the ground)? Used to tell a car that
       drove off the END of a short plank from one that never got on it. */
    onPlank: function (x) {
      var ps = this.planks, i;
      for (i = 0; i < ps.length; i++) if (x >= ps[i].x0 && x <= ps[i].x1) return ps[i];
      return null;
    },

    /* Ground-only sample, for placing props and drawing the dirt. */
    gsample: function (x, out) {
      out = out || {};
      var d = 1.5, y = this.ground(x);
      var m = (this.ground(x + d) - this.ground(x - d)) / (2 * d);
      var L = Math.sqrt(1 + m * m);
      out.x = x; out.y = y; out.m = m;
      out.nx = m / L; out.ny = -1 / L; out.tx = 1 / L; out.ty = m / L;
      out.ang = Math.atan2(m, 1);
      return out;
    },

    /* Surface point, slope and up-normal at x. */
    sample: function (x, out) {
      out = out || {};
      var d = 1.5;
      var y = this.y(x);
      var m = (this.y(x + d) - this.y(x - d)) / (2 * d);   // dy/dx
      var L = Math.sqrt(1 + m * m);
      out.x = x; out.y = y; out.m = m;
      out.nx = m / L; out.ny = -1 / L;      // unit normal, points up (-y)
      out.tx = 1 / L; out.ty = m / L;       // unit tangent, points +x
      out.ang = Math.atan2(m, 1);
      return out;
    }
  };
})(CG);

/* ================================== PATHWAY =================================
   Authored track parts ("the pathway"), stitched into a stage.

   A part is a height curve h(t), t in [0,1], measured RELATIVE to the height
   the previous part ended at. The contract that makes parts interchangeable:

       h(0) = 0        and      h'(0) = h'(1) = 0

   i.e. every part enters and leaves level, so any two parts join without a
   kink the wheels could catch on. INSIDE a part anything goes — a kicker
   wants a sharp lip, a drop-off wants a cliff. Those discontinuities are
   deliberate and always land away from a join.

   Everything here is a pure function of (stage plan, seed): no state, no
   stored heightmap, identical on every replay, and DOM-free so
   tools/sim_test.js can drive every part headlessly before it ships.        */
(function (CG) {
  'use strict';

  var TAU = CG.TAU, PI = Math.PI;
  function ss(t) { return t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t); }
  function sin2(t) { var s = Math.sin(PI * t); return s * s; }

  /* THE SLOPE BUDGET — these are the car's measured limits, from
     tools/sim_test.js, not taste:
         climbs a sustained 30 deg, stalls into wheelspin past 35,
         tops out at 76 km/h, brakes from that in 23 m.
     So every part keeps its SUSTAINED slope under 30 deg. The only ground
     steeper than that is a take-off lip (short, arrived at with speed, exits
     downhill) or a cliff face (which the car flies off, never up). And no pit
     is ever a trap: every hole has an escape ramp under 30 deg, so missing a
     jump costs time, never the run. tools/stage_test.js re-checks all of this
     on every stage, so a part that breaks the budget fails the build. */
  var MAX_TAN = 0.55;                    // tan(29 deg) — sustained ground
  var LIP_TAN = 0.80;                    // tan(39 deg) — take-off lips only

  /* Shortest length that keeps a height change of H inside a slope budget.
     `k` is the curve's peak derivative: 1.5 for smoothstep, PI for sin^2. */
  function fit(H, k, tan) { return Math.abs(H) * k / (tan || MAX_TAN); }

  /* Each builder takes (d, r): d = stage difficulty 0..1, r = seeded rng.
     Returns { len, h, tags } — tags drive decoration and pickup placement:
       rest  flat enough to park on        air   expect the car to leave the ground
       grind sustained traction demand     risk  a real chance of ending the run  */
  var PARTS = CG.PARTS = {

    /* Level ground. The run always opens on one so the player can settle. */
    start: function () {
      return { len: 1000, h: function () { return 0; }, tags: 'rest' };
    },

    flat: function (d, r) {
      var L = 460 + r() * 320;
      return { len: L, h: function () { return 0; }, tags: 'rest' };
    },

    /* Rolling whoops. The bread and butter: teaches throttle modulation,
       because flooring it here bounces the nose up and loses drive. */
    rollers: function (d, r) {
      var n = 2 + Math.floor(r() * 3), L = 620 + n * 300;
      var a = Math.min(30 + d * 58, MAX_TAN * L / (Math.PI * n));
      return { len: L, tags: 'flow',
               h: function (t) { return a * 0.5 * (1 - Math.cos(CG.TAU * n * t)); } };
    },

    /* Fast, shallow chatter — shakes the suspension without threatening. */
    washboard: function (d, r) {
      var n = 5 + Math.floor(r() * 4), L = 700 + n * 120;
      var a = Math.min(10 + d * 12, MAX_TAN * L / (Math.PI * n));
      return { len: L, tags: 'flow',
               h: function (t) { return a * 0.5 * (1 - Math.cos(CG.TAU * n * t)); } };
    },

    /* Sustained ascent. Net elevation gain — the stage climbs as it runs. */
    climb: function (d, r) {
      var H = 150 + d * 300 + r() * 90, L = Math.max(820 + H * 1.35, fit(H, 1.5));
      return { len: L, tags: 'grind',
               h: function (t) { return H * ss(t); } };
    },

    /* The payback: a long descent, free speed, easy to over-commit into. */
    descent: function (d, r) {
      var H = 140 + d * 260 + r() * 80, L = Math.max(780 + H * 1.15, fit(H, 1.5));
      return { len: L, tags: 'flow',
               h: function (t) { return -H * ss(t); } };
    },

    /* A big smooth hump. The far side is blind from the approach. */
    crest: function (d, r) {
      var H = 150 + d * 230 + r() * 70, L = Math.max(980, fit(H, Math.PI));
      return { len: L, tags: 'flow', h: function (t) { return H * sin2(t); } };
    },

    /* A bowl. Bottoms the suspension out at speed and compresses the exit. */
    basin: function (d, r) {
      var D = 150 + d * 250 + r() * 80, L = Math.max(900, fit(D, Math.PI));
      return { len: L, tags: 'flow', h: function (t) { return -D * sin2(t); } };
    },

    /* Ramp that falls away at the lip: the ground leaves before the car does,
       so this is the part that actually produces air time. The lip is the one
       place a steep face is allowed — it is short and it exits downhill. */
    kicker: function (d, r) {
      var H = 110 + d * 130 + r() * 50, pit = 60 + d * 80;
      var L = Math.max(900 + d * 300, fit(H, 1.7 / 0.45, LIP_TAN),
                       fit(H + pit, Math.PI));
      return { len: L, tags: 'air',
        h: function (t) {
          if (t < 0.45) return H * Math.pow(t / 0.45, 1.7);
          var u = (t - 0.45) / 0.55;
          return H * (1 - ss(u)) - pit * sin2(u);
        } };
    },

    /* Take-off lip, a hole, a landing ramp. Clear it and you keep your speed;
       miss it and you drive out of the bottom — slowly, and a checkpoint's
       worth of fuel poorer. Never a dead end. */
    gap: function (d, r) {
      var H = 100 + d * 90, D = 130 + d * 120;
      /* the escape ramp (t 0.55 -> 0.90) carries the whole depth plus the
         landing lip, and it is what sets the part's length */
      var L = Math.max(1200 + d * 500 + r() * 160, fit(D + H * 0.7, 1.5) / 0.35);
      return { len: L, tags: 'air risk',
        h: function (t) {
          if (t < 0.22) return H * Math.pow(t / 0.22, 1.8);        // take-off
          if (t < 0.55) {                                          // the hole
            var u = (t - 0.22) / 0.33;
            return H - (H + D) * ss(u);
          }
          if (t < 0.90) {                                          // escape ramp
            var w = (t - 0.55) / 0.35;
            return -D + (D + H * 0.7) * ss(w);
          }
          return H * 0.7 * (1 - ss((t - 0.90) / 0.10));
        } };
    },

    /* Rock steps. Each step needs momentum, not throttle — but no single step
       is steeper than the car can walk up from a standstill. */
    stairs: function (d, r) {
      var n = 3 + Math.floor(d * 3 + r()), rise = 55 + d * 55;
      var L = Math.max(300 * n + 380, n * fit(rise, 1.5));
      return { len: L, tags: 'grind risk',
        h: function (t) {
          var s = t * n, i = Math.floor(s), f = s - i;
          if (i >= n) return n * rise;
          return (i + ss(f)) * rise;
        } };
    },

    /* Flat, then the floor disappears. Punishes a nose-down landing — but the
       run-out below is long and level, so a good landing is rewarded with
       speed rather than a second obstacle. */
    dropoff: function (d, r) {
      var H = 150 + d * 150 + r() * 60, L = Math.max(1500, H * 4.6);
      return { len: L, tags: 'air risk',
        h: function (t) {
          if (t < 0.28) return 0;
          return -H * ss(Math.min(1, (t - 0.28) / 0.26));   // rest is run-out
        } };
    },

    /* Raised rest shelf. Checkpoints live here: level, generous, safe to
       respawn onto, and visibly a place to breathe. */
    shelf: function (d, r) {
      var H = 60 + d * 120, L = Math.max(900 + r() * 200, fit(H, 1.5) / 0.45);
      return { len: L, tags: 'rest',
               h: function (t) { return H * ss(Math.min(1, t / 0.45)); } };
    },

    /* Long level run-out so a player who crosses the line at speed can stop. */
    finish: function () {
      return { len: 1900, h: function () { return 0; }, tags: 'rest' };
    },

    /* THE CHASM — the part the game is now about.
       A level approach, a sheer drop, a pit, a sheer rise to the far lip
       (which may be higher or lower than the near one), and a level run-out.
       The two lips are the two points (x1,y1) and (x2,y2) of a distance-formula
       question, plotted on a grid CG.UNIT px per unit, and the only way across
       is a plank exactly sqrt(dx^2 + dy^2) units long. The car is stopped on
       the approach, asked, and the plank it earns becomes part of the driving
       surface (see Terrain.planks). Nothing here is random: the part is a pure
       function of the authored coordinates, so a question is the same on every
       replay and tools/stage_test.js can check every one of its three outcomes.
       `spec` is [x1, y1, x2, y2]; x2 must exceed x1. */
    chasm: function (d, r, spec) {
      var U = CG.UNIT, W = CG.CHASM;
      var dx = (spec[2] - spec[0]) * U, dyH = (spec[3] - spec[1]) * U;
      if (dx <= 0) throw new Error('chasm: x2 must be greater than x1');
      var floor = Math.min(0, dyH) - W.PIT;          // pit floor, relative height
      var L = W.APP + dx + W.RUN, wall = W.WALL;
      return { len: L, tags: 'rest math',
        gapX: [W.APP, W.APP + dx],                   // lips, relative to x0
        floor: floor, rise: dyH,
        h: function (t) {
          var x = t * L;
          if (x < W.APP) return 0;
          if (x < W.APP + wall) return floor * ss((x - W.APP) / wall);
          if (x < W.APP + dx - wall) return floor;
          if (x < W.APP + dx) return floor + (dyH - floor) * ss((x - (W.APP + dx - wall)) / wall);
          return dyH;
        } };
    }
  };

  /* Grid scale and chasm geometry, in world px. One unit is 72px, so the
     240px car spans about three units and the narrowest gap in the game (4
     units) is wider than the car — at a smaller scale a car that drove off a
     short plank simply rested its nose on the far wall, and the lesson was
     lost. PIT is deep enough that a wedged over-long plank (which digs
     sqrt(L^2 - dx^2) below the near lip) stays clear of the floor, and that a
     fall reads as a fall before the reset. */
  CG.UNIT = 72;
  /* STOP is where the car's centre is held: far enough back that the jeep's
     nose does not sit on the near point's label while the question is up. */
  CG.CHASM = { APP: 900, RUN: 640, PIT: 1500, WALL: 10, STOP: 250, ARM: 820, CHUTE: 600 };

  /* -------------------------------------------------------------- builder */
  /* plan: array of part names, plus the markers 'CP' (checkpoint on the part
     that follows) and 'FINISH' (the line is at the start of that part). */
  var Track = CG.Track = {};

  /* Landing insurance. Every part starts level by contract, but a part that
     RISES hard just after an air part still flips a car that is coming down
     fast — and that is a crash the player could not have avoided. So the
     builder inserts a run-out rather than trusting the plan to be careful.
     tools/stage_test.js is what found this, on GOLDEN SUMMIT. */
  var AIR = { kicker: 1, gap: 1, dropoff: 1 };
  var NO_LAND = { climb: 1, stairs: 1, crest: 1, shelf: 1, gap: 1, kicker: 1, chasm: 1 };

  /* A plan entry is a part name, a marker, or a chasm spec `{ c: [x1,y1,x2,y2] }`. */
  function nameOf(e) { return typeof e === 'string' ? e : 'chasm'; }

  function expand(plan) {
    var out = [], i, prev = '', n;
    for (i = 0; i < plan.length; i++) {
      n = nameOf(plan[i]);
      if (AIR[prev] && NO_LAND[n]) out.push('flat');
      out.push(plan[i]);
      if (n !== 'CP' && n !== 'FINISH') prev = n;
    }
    return out;
  }

  Track.build = function (plan, seed, d) {
    var rnd = CG.rng((seed >>> 0) || 1), parts = [], cps = [], chasms = [];
    var x = 0, y = 0, cpNext = false, finishX = -1, i, name, p, entry;
    plan = expand(plan);

    for (i = 0; i < plan.length; i++) {
      entry = plan[i];
      name = nameOf(entry);
      if (name === 'CP') { cpNext = true; continue; }
      if (name === 'FINISH') { finishX = -2; continue; }   // resolved below
      p = name === 'chasm' ? PARTS.chasm(d, rnd, entry.c) : (PARTS[name] || PARTS.flat)(d, rnd);
      var part = { name: name, x0: x, x1: x + p.len, len: p.len, y0: y,
                   h: p.h, tags: p.tags || '', cp: false, index: parts.length };
      if (name === 'chasm') {
        /* Everything the question needs, resolved to world space once. World y
           grows downward; grid y grows upward, hence the sign flips. */
        var U = CG.UNIT, c = entry.c;
        var ax = x + p.gapX[0], bx = x + p.gapX[1];

/* =================================== GAPS ===================================
   The distance-formula question at a chasm, and the plank each answer buys.

   Three outcomes, and each one is GEOMETRY rather than a verdict — the plank
   the player chose is laid into the world and the physics decides:
     exact   the plank's top edge runs lip to lip: a road
     short   it starts on the near lip, aims at the far one, and ends in the
             air, sagging, as an unsupported board would — the car drives off
             the end and falls
     long    it will not fit between the lips, so it wedges: near end on the
             near lip, far end jammed against the far wall sqrt(L^2 - dx^2)
             below it, a steep chute into a wall — the car pitches over
   DOM-free: tools/stage_test.js drives all three for every chasm in every
   stage before any of it ships.                                              */
(function (CG) {
  'use strict';

  var Gaps = CG.Gaps = {};

  /* The answer is read off a RULER, one unit at a time, so every chasm's
     distance must be a whole number: a horizontal gap, or a Pythagorean
     triple laid on its side. RULER_MAX is the longest plank the ruler
     offers; the longest gap in the game is 13. */
  Gaps.RULER_MAX = 14;

  /* What the panel and the hint need to know about a chasm. Throws on a
     gap whose distance is not whole — that is an authoring error, and it is
     better caught when the stage table loads than by a child at the ruler. */
  Gaps.question = function (gap) {
    var dx = Math.abs(gap.b[0] - gap.a[0]), dy = Math.abs(gap.b[1] - gap.a[1]);
    var sq = dx * dx + dy * dy, D = Math.round(Math.sqrt(sq));
    if (D * D !== sq) throw new Error('chasm ' + JSON.stringify(gap.a) + '->' + JSON.stringify(gap.b) +
                                      ': distance sqrt(' + sq + ') is not a whole number');
    if (D > Gaps.RULER_MAX) throw new Error('chasm distance ' + D + ' is longer than the ruler');
    return { dx: dx, dy: dy, sq: sq, D: D };
  };

  /* The plank a choice of `len` units produces, as a driving surface
     {x0,y0,x1,y1} (its top edge) plus `kind`. */
  Gaps.plankFor = function (gap, len) {
    var U = CG.UNIT, L = len * U;
    var ax = gap.ax, ay = gap.ay, bx = gap.bx, by = gap.by;
    var dx = bx - ax, dy = by - ay, D = Math.hypot(dx, dy);
    if (Math.abs(L - D) < 0.5) {
      return { x0: ax, y0: ay, x1: bx, y1: by, kind: 'exact', len: len };
    }
    if (L < D) {
      /* aimed at the far lip, drooping the more it falls short — and never
         allowed to end above the far lip, or a fast car could jump the rest
         and the lesson would be that short planks are fine */
      var ang = Math.atan2(dy, dx) + 0.12 + 0.22 * (D - L) / D;
      var ex = ax + Math.cos(ang) * L, ey = ay + Math.sin(ang) * L;
      if (ey < by + 40) ey = by + 40;
      return { x0: ax, y0: ay, x1: ex, y1: ey, kind: 'short', len: len };
    }
    /* too long: wedged, far end on the far wall below the far lip */
    var drop = Math.sqrt(Math.max(0, L * L - dx * dx));
    /* a chute deeper than CHUTE would leave the frame; an absurdly long plank
       is laid to that depth instead (and so reads a little shorter than its
       number — the only case where the geometry is not literal) */
    var wy = Math.min(ay + drop, Math.max(ay, by) + CG.CHASM.CHUTE);
    return { x0: ax, y0: ay, x1: bx, y1: wy, kind: 'long', len: len };
  };

  /* ---- what a wrong plank does to the car, shared by the game and the bot
     so tools/stage_test.js proves the very behaviour the player meets. ---- */
  Gaps.noseX = function (v) {              // front-bottom hull corner, world x
    var h = CG.VConst.hull[0];

  };

  /* SHORT: the board is supported at one end only. The moment the front
     wheel runs off its far end the board gives way and pivots about the lip,
     and the car goes down the chute it has become. */
  Gaps.shortTripped = function (v, p) { return Gaps.frontAxleX(v) > p.x1 - 20; };
  /* The instant the board goes, the car loses what was carrying it: its
     climb dies, its speed halves, the nose dips. Without this a car that was
     sprinting up a short plank kept its upward momentum and could fly the
     last half unit onto the far lip — which would teach the opposite lesson. */

    var th = Math.min(TIP_MAX, Math.atan2(p.y1 - p.y0, p.x1 - p.x0) + TIP_RATE * dt);
    p.x1 = p.x0 + Math.cos(th) * L;
    p.y1 = p.y0 + Math.sin(th) * L;
    p.tipped = true;
    return th >= TIP_MAX;
  };

     and pitches over onto its roof. */
  Gaps.longTripped = function (v, p) { return Gaps.noseX(v) > p.x1 - 8; };
  Gaps.wallFlip = function (v) { v.vx = 0; v.vy = -60; v.av = 6.5; };

  /* A wrong plank has done its work once the car is in the pit, wrecked, or
     has been past the point of no return for this long. */
  Gaps.FAIL_AFTER = 1.15;
  Gaps.failed = function (v, gap, since) {
    return v.crashed || v.y > Math.max(gap.ay, gap.by) + 130 || since > Gaps.FAIL_AFTER;
  };
})(CG);

/* Vehicle physics: rigid chassis + two wheels on kinematic suspension with a
   slip-based tyre model. DOM-free so tools/sim_test.js can validate it.

   Model, per substep:
     1. each wheel's suspension travel is solved from the terrain (a hard
        constraint), which sets the spring compression
     2. compression + damping gives the normal force N, applied along the
        terrain normal at the contact patch
     3. longitudinal force = clamp(C_SLIP * slip, +/- MU*N), where
        slip = omega*R - v_tangent. This is what produces wheelspin, skids,
        and the torque about the centre of mass that lifts the nose.
     4. chassis hull points get a stiff penalty spring so the body can't sink
   Local space: origin at the centre of mass, +x forward, +y down.           */
(function (CG) {
  'use strict';

  /* ---- art-space -> local-space mapping ----
     The numbers are MEASURED from the sprite by tools/import_car.py (it fits a
     circle to each wheel-arch edge and reports the centres); re-run it after
     any re-render and paste what it prints. Sprite: assets/vehicle/car_body.webp,
     1448x1086, the rally coupe with no wheels and a tinted cabin. */
  var WHEELBASE = 130;                    // world px between the axles
  var ARCH_REAR_X = 294.7, ARCH_FRONT_X = 1054.5;   // arch centres, art px
  var ART = WHEELBASE / (ARCH_FRONT_X - ARCH_REAR_X);   // art px -> world px
  var AXLE_MID_X = (ARCH_REAR_X + ARCH_FRONT_X) / 2, AXLE_Y = 709;
  var COM_ABOVE_AXLE = 18;                // centre of mass sits above the axles
  var COM_FORWARD = 12;                   // ...and ahead of the axle midpoint.
  var RIDE = 0;                           // body art sits this far ABOVE the
  // axle line. The jeep needed 17 here because its arches were cut high; this
  // body's arches are cut low, 40px above the sill, so with a 30px tyre
  // (175 art px) the lower third of the wheel already shows below the sill.
  // COM_FORWARD is a handling knob: moving mass forward lengthens gravity's
  // restoring arm about the rear contact, which is what stops full throttle
  // from backflipping the car on a climb. At +12 it holds to ~38 degrees.

  function L(ax, ay) {

             y: (ay - AXLE_Y) * ART + COM_ABOVE_AXLE - RIDE };

     line while the body rises above them. */

  var V = CG.VConst = {
    ART: ART,
    WHEELBASE: WHEELBASE,
    WHEEL_R: 30,
    MASS: 1,
    INERTIA: (245 * 245 + 88 * 88) / 12,     // 5647, from the body's bounding box
    GRAV: 1400,

    SUS_TRAVEL: 20,
    SUS_K: 90,                 // force per px of compression (mass == 1)
    SUS_C: 9,                  // damper
    N_MAX: 9000,               // impact clamp, keeps landings from exploding

    WHEEL_I: 435,              // spin inertia incl. reflected drivetrain inertia
    MU: 1.15,                  // tyre friction coefficient
    C_SLIP: 45,                // force per px/s of slip before saturation
    ROLL_RES: 0.018,

    T_STALL: 30000,            // max wheel torque (grip/gearing limited)
    W_IDLE: 9.5,               // omega below which torque is stall-limited
    W_REDLINE: 42,             // rev limiter; without it airborne wheels run away
    SPIN_DRAG: 8,              // free-spin drag on an airborne wheel
    T_BRAKE: 39000,
    REVERSE: 0.62,             // reverse is weaker than forward
    DRIVE_REAR: 0.5,           // torque split
    BOOST_MUL: 1.55,

    AIR_DRAG: 0.00022,
    AV_DAMP: 0.5,
    AIR_TORQUE: 5647 * 6.5,    // in-air pitch control (INERTIA x 6.5)

    axleRear: AX(ARCH_REAR_X),
    axleFront: AX(ARCH_FRONT_X),
    seat: L(700, 480),                     // cabin: where a ruler or a marker sits
    neck: L(700, 385),
    exhaust: L(40, 700),
    lamp: L(1400, 565),                    // the headlamp cluster, for night

    bodyW: (1442 - 9) * ART,
    bodyH: (755 - 242) * ART,

       screen, roof, rear glass, the wing (a car this shape rests on its wing
       and roof when it lands upside down), rear bumper, then the sill */

    var gas = input.gas || 0, brake = input.brake || 0;

    var dnx = -this.sa, dny = this.ca;      // chassis "down" axis in world space

    var contacts = 0;

    for (i = 0; i < 2; i++) {

      var any = this.y + w.ax * this.sa + w.ay * this.ca;

      /* free suspension extension when unloaded */
      var sFree = w.s + w.sv * dt;
      var accS = (V.SUS_K * (V.SUS_TRAVEL - w.s)) / 0.5 + V.GRAV * this.ca - V.SUS_C * w.sv / 0.5;
      sFree = CG.clamp(sFree + 0.5 * accS * dt * dt, 0, V.SUS_TRAVEL);

      /* solve travel against the terrain: d(s) is linear in s */
      var sNew = sFree;
      var px = anx + dnx * sFree, py = any + dny * sFree;
      this.t.sample(px, surf);
      var kdn = dnx * surf.nx + dny * surf.ny;        // == -1 when upright on flat
      var d = (px - surf.x) * surf.nx + (py - surf.y) * surf.ny;
      if (d < V.WHEEL_R && kdn < -0.3) {
        sNew = CG.clamp(sFree + (V.WHEEL_R - d) / kdn, 0, V.SUS_TRAVEL);
        /* re-sample at the corrected position: the wheel moved in x too */
        px = anx + dnx * sNew; py = any + dny * sNew;
        this.t.sample(px, surf);
        kdn = dnx * surf.nx + dny * surf.ny;
        d = (px - surf.x) * surf.nx + (py - surf.y) * surf.ny;
        if (d < V.WHEEL_R && kdn < -0.3) {
          sNew = CG.clamp(sNew + (V.WHEEL_R - d) / kdn, 0, V.SUS_TRAVEL);
          px = anx + dnx * sNew; py = any + dny * sNew;
        }
      }
      w.sv = (sNew - w.s) / dt;
      w.s = sNew;

      var onGround = comp > 0.15 && d < V.WHEEL_R + 1.5;
      w.contact = onGround;
      w.nx = surf.nx; w.ny = surf.ny;

      var Ntq = 0;
      if (onGround) {

        var N = CG.clamp(V.SUS_K * comp - V.SUS_C * w.sv, 0, V.N_MAX);

        /* contact patch and its velocity */
        var cpx = px - surf.nx * V.WHEEL_R, cpy = py - surf.ny * V.WHEEL_R;
        w.cpx = cpx; w.cpy = cpy;
        var rx = cpx - this.x, ry = cpy - this.y;
        var vcx = this.vx - this.av * ry, vcy = this.vy + this.av * rx;

        /* normal force along the terrain normal */
        fx += surf.nx * N; fy += surf.ny * N;
        tq += rx * (surf.ny * N) - ry * (surf.nx * N);

        /* longitudinal tyre force from slip */
        var vt = vcx * surf.tx + vcy * surf.ty;
        var slip = w.omega * V.WHEEL_R - vt;
        var lim = V.MU * N;
        var ft = CG.clamp(V.C_SLIP * slip, -lim, lim);
        w.slip = slip;
        w.skid = Math.min(1, Math.abs(slip) / 260) * (Math.abs(ft) >= lim * 0.92 ? 1 : 0.25);

        fx += surf.tx * ft; fy += surf.ty * ft;
        tq += rx * (surf.ty * ft) - ry * (surf.tx * ft);
        Ntq = -ft * V.WHEEL_R - V.ROLL_RES * N * V.WHEEL_R * CG.sign(w.omega);
      } else {

      }

        } else if (Math.abs(w.omega) < V.W_REDLINE || CG.sign(drive) !== CG.sign(w.omega)) {

      var hy = this.y + hl.x * this.sa + hl.y * this.ca;
      this.t.sample(hx, surf2);
      var hd = (hx - surf2.x) * surf2.nx + (hy - surf2.y) * surf2.ny;
      if (hd < 0) {
        var hrx = hx - this.x, hry = hy - this.y;
        var hvx = this.vx - this.av * hry, hvy = this.vy + this.av * hrx;
        var vn = hvx * surf2.nx + hvy * surf2.ny;
        var Nh = CG.clamp(-hd * 320 - vn * 34, 0, 14000);
        fx += surf2.nx * Nh; fy += surf2.ny * Nh;
        tq += hrx * (surf2.ny * Nh) - hry * (surf2.nx * Nh);
        /* body friction: scraping kills speed */
        var vth = hvx * surf2.tx + hvy * surf2.ty;
        var fh = CG.clamp(-vth * 1.2, -0.75 * Nh, 0.75 * Nh);
        fx += surf2.tx * fh; fy += surf2.ty * fh;
        tq += hrx * (surf2.ty * fh) - hry * (surf2.tx * fh);
        scraping = Math.max(scraping, Math.min(1, Math.abs(vth) / 300));
        hullHits++;
        if (-hd > 2) this.impact = Math.max(this.impact, Math.abs(vn) * 0.8);
      }
    }
    this.scrape = scraping;

    /* ------------------------------------------------------- driver's head */
    var hp = this.toWorld(V.head.x, V.head.y);
    this.t.sample(hp.x, surf2);
    if ((hp.x - surf2.x) * surf2.nx + (hp.y - surf2.y) * surf2.ny < V.headR) {
      this.crashed = true;
      this.crashReason = 'head';
    }

    /* ------------------------------------------------------------ integrate */
    /* Resting on the body counts as grounded, or an inverted car sliding on its
       roll bar reports itself airborne forever and keeps its air controls. */
    this.wheelsDown = contacts;
    this.onGround = contacts > 0 || hullHits > 0;
    if (this.onGround) {
      this.airTime = 0; this.groundTime += dt;
      if (this.spinArmed) { this.landedSpin = this.spin; this.spinArmed = false; }
      this.spin = 0;
    } else {
      this.airTime += dt; this.groundTime = 0;
      if (this.airTime > 0.25) {
        this.spinArmed = true;
        this.spin += this.av * dt;
        tq += drive > 0 ? -V.AIR_TORQUE * gas
           : drive < 0 ? V.AIR_TORQUE * brake : 0;

      glow.addColorStop(1, 'rgba(255,246,214,0)');
      c.globalAlpha = st;
      c.fillStyle = glow;
      c.fillRect(mx - rad * 4, my - rad * 4, rad * 8, rad * 8);
      c.fillStyle = '#FFF6D6';
      c.beginPath(); c.arc(mx, my, rad, 0, CG.TAU); c.fill();
      c.fillStyle = 'rgba(214,206,180,0.35)';
      c.beginPath(); c.arc(mx - rad * 0.3, my + rad * 0.15, rad * 0.28, 0, CG.TAU); c.fill();
      c.beginPath(); c.arc(mx + rad * 0.35, my - rad * 0.3, rad * 0.18, 0, CG.TAU); c.fill();
    }
    c.globalAlpha = 1;
  }

  R.drawBackground = function () {
    var c = R.ctx, E = CG.Env;
    var A = CG.themes[E.a] || CG.themes.spring, B = CG.themes[E.b] || A;
    if (!A) {
      c.fillStyle = '#2F4A93';
      c.fillRect(0, 0, R.W, R.H);
      return;
    }
    c.save();
    /* #2F4A93 is the top row of the spring sky; only seen if a sky is missing */
    c.fillStyle = '#2F4A93';
    c.fillRect(0, 0, R.W, R.H);
    drawSky(A, E.a, 1);
    if (E.mix > 0 && B !== A) drawSky(B, E.b, E.mix);
    drawNight(E.night);
    drawLayers(A, E.a, 1);
    if (E.mix > 0 && B !== A) drawLayers(B, E.b, E.mix);
    c.restore();
  };

  /* The horizon the ground haze sits on: the terrain averaged over 2 km
     around the camera, so the band rides the hills and ignores the bumps.
     (The middle-distance bushes that used to stand here are world props now —
     see the hedgerow in World.build — because a screen-space row cannot sit
     on a slope it is not attached to.) */
  R.horizon = function () {
    var t = 0, k;
    for (k = -6; k <= 6; k++) t += CG.Terrain.ground(R.cam.x + k * 170);
    R.hz = R.sy(t / 13);
    return R.hz;
  };

  /* Where the painted distance meets the ground the two simply stop against
     each other on a straight line all the way across. A short band of the
     sun's own warmth, sitting on that line and fading both ways, dissolves
     the cut the way haze does over real ground. */
  R.drawGroundHaze = function () {
    var c = R.ctx;
    var y = R.hz !== undefined ? R.hz : R.sy(CG.Terrain.ground(R.cam.x));
    if (y < -60 || y > R.H + 60) return;
    var e = R.cache.haze;
    if (!e || e.h !== R.H) {
      var g = c.createLinearGradient(0, -78, 0, 62);
      g.addColorStop(0.00, 'rgba(255,214,164,0)');
      g.addColorStop(0.55, 'rgba(255,214,164,0.15)');
      g.addColorStop(1.00, 'rgba(255,214,164,0)');
      e = R.cache.haze = { g: g, h: R.H };
    }
    c.save();
    c.globalAlpha = 1 - CG.Env.night * 0.85;       // no warm haze at night
    c.translate(0, y);
    c.fillStyle = e.g;
    c.fillRect(0, -78, R.W, 140);
    c.restore();
  };

  /* ------------------------------------------------------------ colour grade
     Every sprite in the game — jeep, driver, props, pickups — is painted for
     midday, and re-rendering thirty of them for one theme is not worth it. One
     pass over the finished world sells the hour instead: a warm screen for the
     low sun, a violet multiply for the shade it leaves behind. Drawn after the
     world and before the HUD, so the interface keeps its own contrast. */
  /* The grade is now a function of the hour and the weather rather than a
     fixed evening. By day it is nearly neutral; around sunrise and sunset a
     warm screen and a violet shade come up together (the old evening look,
     at its peak); at night a deep blue multiply takes most of the light out
     and the headlamps do the rest. Weather sits on top: rain greys and cools,
     fog lifts everything toward pale, snow lifts it toward cold white. */
  R.drawGrade = function () {
    var c = R.ctx, E = CG.Env, W = R.W, H = R.H;
    var wx = E.wx, rain = E.weather === 'rain' ? wx : 0;
    var fog = E.weather === 'fog' ? wx : 0, snow = E.weather === 'snow' ? wx : 0;
    c.save();
    c.globalCompositeOperation = 'screen';
    var warm = 0.03 + 0.15 * E.dusk;
    c.fillStyle = 'rgba(255,179,92,' + warm.toFixed(3) + ')';
    c.fillRect(0, 0, W, H);
    if (fog > 0 || snow > 0) {
      c.fillStyle = 'rgba(222,228,240,' + (0.16 * fog + 0.10 * snow).toFixed(3) + ')';
      c.fillRect(0, 0, W, H);
    }
    c.globalCompositeOperation = 'multiply';
    var cool = 0.03 + 0.09 * E.dusk;
    c.fillStyle = 'rgba(107,94,155,' + cool.toFixed(3) + ')';
    c.fillRect(0, 0, W, H);
    if (rain > 0) {
      c.fillStyle = 'rgba(96,112,140,' + (0.28 * rain).toFixed(3) + ')';
      c.fillRect(0, 0, W, H);
    }
    if (E.night > 0) {
      c.fillStyle = 'rgba(26,36,92,' + (0.62 * E.night).toFixed(3) + ')';
      c.fillRect(0, 0, W, H);
    }
    c.restore();
  };

  /* ---------------------------------------------------------------- weather
     Screen-space, and cheap: rain is a few hundred short lines slanted by the
     car's own speed, snow is soft dots on a slow sine drift with the bigger
     (nearer) flakes falling faster, fog is two pale bands that hug the ground
     line and breathe. The pools are sized by intensity, so a shower starts
     as a few drops and a storm fills in. */
  var drops = [], flakes = [];
  R.drawWeather = function (dt) {
    var E = CG.Env, c = R.ctx, W = R.W, H = R.H, i, p, n;
    if (E.weather === 'clear' || E.wx <= 0) return;
    var vx = CG.Game.v ? CG.Game.v.vx : 0;
    if (E.weather === 'rain') {
      n = Math.round(260 * E.wx * (W / 1200));
      while (drops.length < n) drops.push({ x: Math.random() * W, y: Math.random() * H, l: 14 + Math.random() * 16, s: 0.7 + Math.random() * 0.5 });
      if (drops.length > n) drops.length = n;
      var slant = -vx * 0.35 * dt;
      c.save();
      c.strokeStyle = 'rgba(205,222,255,0.42)';
      c.lineWidth = 1.5;
      c.beginPath();
      for (i = 0; i < drops.length; i++) {
        p = drops[i];
        p.y += (900 * p.s) * dt; p.x += slant * p.s - 40 * dt;
        if (p.y > H + 20) { p.y = -20 - Math.random() * 40; p.x = Math.random() * W; }
        if (p.x < -20) p.x += W + 40; else if (p.x > W + 20) p.x -= W + 40;
        var dx = (slant - 40 * dt) * 0.9, dy = 900 * p.s * dt;
        var k = p.l / Math.max(1, Math.hypot(dx, dy));
        c.moveTo(p.x, p.y);
        c.lineTo(p.x - dx * k, p.y - dy * k);
      }
      c.stroke();
      c.restore();
    } else if (E.weather === 'snow') {
      n = Math.round(220 * E.wx * (W / 1200));
      while (flakes.length < n) flakes.push({ x: Math.random() * W, y: Math.random() * H, r: 1.2 + Math.random() * 2.6, ph: Math.random() * 6.3 });
      if (flakes.length > n) flakes.length = n;
      c.save();
      c.fillStyle = 'rgba(255,255,255,0.85)';
      for (i = 0; i < flakes.length; i++) {
        p = flakes[i];
        p.ph += dt * 1.4;
        p.y += (40 + p.r * 28) * dt;
        p.x += Math.sin(p.ph) * 22 * dt - vx * 0.08 * dt * p.r;
        if (p.y > H + 10) { p.y = -10; p.x = Math.random() * W; }
        if (p.x < -10) p.x += W + 20; else if (p.x > W + 10) p.x -= W + 20;
        c.beginPath(); c.arc(p.x, p.y, p.r, 0, CG.TAU); c.fill();
      }
      c.restore();
    } else if (E.weather === 'fog') {
      var y = R.sy(CG.Terrain.ground(R.cam.x));
      var t = CG.Game.time || 0;
      c.save();
      for (i = 0; i < 2; i++) {
        var yy = y - 40 + i * 70 + Math.sin(t * 0.5 + i * 2) * 8;
        var g = c.createLinearGradient(0, yy - 90, 0, yy + 60);
        g.addColorStop(0, 'rgba(226,231,240,0)');
        g.addColorStop(0.5, 'rgba(226,231,240,' + (0.28 * E.wx).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(226,231,240,0)');
        c.fillStyle = g;
        c.fillRect(0, yy - 90, W, 150);
      }
      c.restore();
    }
  };

  R.drawForeground = function () {
    var E = CG.Env, c = R.ctx, h = 132;
    var A = CG.themes[E.a] || CG.themes.spring, B = CG.themes[E.b] || A;
    if (!A || !A.fgGrass) return;
    c.save();
    c.globalAlpha = 0.92;
    tileRow('fg@' + E.a, A.fgGrass, R.cam.x * 1.12, R.H + 14, h, false, 232 / 724);
    if (E.mix > 0 && B !== A && B.fgGrass) {
      c.globalAlpha = 0.92 * E.mix;
      tileRow('fg@' + E.b, B.fgGrass, R.cam.x * 1.12, R.H + 14, h, false, 232 / 724);
    }
    c.restore();
  };

  /* ---------------------------------------------------------------- terrain */
  function makeDirtPattern(src) {
    if (!src) return null;
    /* Downscaling in one step resamples the tile's edge pixels without their
       wrapped neighbours, which leaves a faint grid every tile. Lay the source
       out 3x3, scale that, then cut the centre tile: its edges then resample
       against real neighbouring content. */
    var big = document.createElement('canvas');
    big.width = big.height = patTile * 3;
    var bc = big.getContext('2d');
    for (var iy = 0; iy < 3; iy++) {
      for (var ix = 0; ix < 3; ix++) {
        bc.drawImage(src, ix * patTile, iy * patTile, patTile, patTile);
      }
    }
    var off = document.createElement('canvas');
    off.width = off.height = patTile;
    off.getContext('2d').drawImage(big, patTile, patTile, patTile, patTile,
                                   0, 0, patTile, patTile);
    return R.ctx.createPattern(off, 'repeat');
  }

  /* The cap is shaded ONCE into its own tile rather than per ribbon slice:
     a gradient drawn per slice compounds wherever slices overlap and leaves
     vertical ribbing. Baking it in also lets the bottom rows fade out, so the
     cap melts into the tiled soil instead of ending on a hard line. */
  function makeCapTile(tw, th, gt) {
    if (!gt) return null;
    /* Two copies side by side: a slice near the end of the tile can then read
       past the period without wrapping. Clamping the source x instead left a
       visible texture jump once every period. */
    var off = document.createElement('canvas');
    off.width = tw * 2; off.height = th;
    var oc = off.getContext('2d');
    oc.imageSmoothingQuality = 'high';
    oc.drawImage(gt, 0, 0, gt.width, GRASS_SRC_ROWS, 0, 0, tw, th);
    oc.drawImage(gt, 0, 0, gt.width, GRASS_SRC_ROWS, tw, 0, tw, th);
    var g = oc.createLinearGradient(0, 0, 0, th);
    g.addColorStop(0, 'rgba(43,33,24,0)');
    g.addColorStop(0.40, 'rgba(43,33,24,0.05)');
    g.addColorStop(1, 'rgba(43,33,24,0.32)');
    oc.fillStyle = g;
    /* BOTH copies: the ribbon reads past tw on purpose, so shading only the
       first one left every slice that crossed the period a shade lighter than
       its neighbours — a bright vertical band, one slice wide, once per 840
       world px of ground. */
    oc.fillRect(0, 0, off.width, th);
    /* The cap must stay FULLY OPAQUE. Slices have to overlap to be watertight
       (see drawTerrain), and any semi-transparent rows would double up in the
       overlaps as dark streaks. So the bottom rows are blended in RGB toward
       the tiled soil's mean tone instead of toward transparency: the join is
       then a texture change with no tonal step, and no alpha to compound. */
    var top = th * 0.88;
    var g2 = oc.createLinearGradient(0, top, 0, th);
    g2.addColorStop(0, 'rgba(' + SOIL_RGB + ',0)');
    g2.addColorStop(1, 'rgba(' + SOIL_RGB + ',1)');
    oc.fillStyle = g2;
    oc.fillRect(0, top, off.width, th - top);
    return off;
  }

  /* Rebuilt only when the quantised zoom step changes, so the ribbon can blit
     the cap at 1:1 without resampling the source rows per slice. */
  function capFor(z, name, pack) {
    var qz = Math.round(z * 40) / 40;
    var e = R.cache['cap@' + name];
    if (e && e.qz === qz) return e;
    var tw = Math.max(8, Math.round(GRASS_WORLD_W * qz));
    var th = Math.max(2, Math.round(GRASS_CAP * qz));
    var cv = makeCapTile(tw, th, pack.grassTop);
    if (!cv) return null;
    e = { qz: qz, c: cv, w: tw, h: th, per: tw / GRASS_WORLD_W };
    R.cache['cap@' + name] = e;
    return e;
  }

  /* Surface polyline across the view, reused by the fill and the ribbon. */
  var pts = [];
  R.buildSurface = function () {
    var z = R.cam.z, step = 10 / z;   // 10 screen px per ribbon slice
    var wl = R.cam.x - (R.W / 2 + 30) / z, wr = R.cam.x + (R.W / 2 + 30) / z;
    var n = 0, x;
    for (x = wl; x <= wr + step; x += step) {
      var p = pts[n] || (pts[n] = {});
      p.wx = x; p.wy = CG.Terrain.ground(x);
      p.x = R.sx(x); p.y = R.sy(p.wy);
      n++;
    }
    pts.length = n;
    return pts;
  };

  /* The soil fill for one season's pack, inside the clip the caller set. */
  function fillDirt(pack, name, alpha) {
    var c = R.ctx, z = R.cam.z;
    var pat = dirtPats[name];
    if (pat === undefined) pat = dirtPats[name] = makeDirtPattern(pack.dirt);
    c.globalAlpha = alpha;
    if (pat) {
      /* World-locked: the soil scrolls at exactly the surface's rate. A
         screen-locked soil was tried (quieter under the grass) and rejected:
         with the grass line streaming past a texture that stands still, the
         two rates disagree and the sense of speed goes with them. */
      var ox = -(R.cam.x * z) % patTile, oy = -(R.cam.y * z) % patTile;
      c.fillStyle = pat;
      c.translate(ox, oy);
      c.fillRect(-ox - patTile, -oy - patTile, R.W + patTile * 2, R.H + patTile * 2);
      c.translate(-ox, -oy);
    } else {
      c.fillStyle = '#8D6E63';
      c.fillRect(0, 0, R.W, R.H);
    }
  }

  /* Grass cap: a ribbon of slices, each rotated to the local slope so the
     strip follows the ground exactly.

     Each slice is a rectangle rotated about ITS OWN surface point, so where
     the terrain curves, neighbouring slices splay apart and open a thin
     wedge down to the full depth of the cap — which showed up as dark
     streaks hanging into the soil. The fix is to overrun each slice by CAP_PAD
     at both ends so neighbours always overlap by more than any wedge can
     open. The overrun is applied to the source and destination equally, so
     the blit stays 1:1, and the cap is opaque, so overlapping is invisible. */
  function drawCap(p, cap, alpha) {
    var c = R.ctx, i;
    c.globalAlpha = alpha;
    for (i = 0; i < p.length - 1; i++) {
      var a = p[i], b = p[i + 1];
      var dx = b.x - a.x, dy = b.y - a.y;
      var len = Math.sqrt(dx * dx + dy * dy);
      if (len < 0.2) continue;
      if (Math.abs(dy) > Math.abs(dx) * 1.8) continue;     // a chasm wall: bare rock
      var sw = len + CAP_PAD * 2;
      if (sw > cap.w) continue;
      var srcX = (a.wx * cap.per - CAP_PAD) % cap.w;
      if (srcX < 0) srcX += cap.w;
      c.save();
      c.translate(a.x, a.y);
      c.rotate(Math.atan2(dy, dx));
      c.drawImage(cap.c, srcX, 0, sw, cap.h, -CAP_PAD, 0, sw, cap.h);
      c.restore();
    }
  }

  /* The ground is drawn for this season, then again for the next one at the
     crossfade weight, so the soil and the grass change with the hills rather
     than snapping over at a line. Outside a crossfade that is one pass. */
  R.drawTerrain = function () {
    var c = R.ctx, p = R.buildSurface(), i, z = R.cam.z, E = CG.Env;
    var A = CG.themes[E.a] || CG.themes.spring, B = CG.themes[E.b] || A;
    if (!p.length || !A) return;
    var two = E.mix > 0 && B !== A;

    /* dirt body: everything under the surface */
    c.save();
    c.beginPath();
    c.moveTo(p[0].x - 4, p[0].y);
    for (i = 1; i < p.length; i++) c.lineTo(p[i].x, p[i].y);
    c.lineTo(p[p.length - 1].x + 4, R.H + 10);
    c.lineTo(p[0].x - 4, R.H + 10);
    c.closePath();
    c.clip();
    fillDirt(A, E.a, 1);
    if (two) fillDirt(B, E.b, E.mix);
    c.globalAlpha = 1;
    /* A little screen-space depth under the cap's own shading. Cached, and
       only over the lower part of the screen where it is actually visible. */
    if (!R.cache.deep) {
      var g = c.createLinearGradient(0, R.H * 0.42, 0, R.H);
      g.addColorStop(0, 'rgba(43,33,24,0)');
      g.addColorStop(1, 'rgba(43,33,24,0.32)');
      R.cache.deep = g;
    }
    c.fillStyle = R.cache.deep;
    c.fillRect(0, R.H * 0.42, R.W, R.H * 0.58);
    c.restore();

    c.save();
    var capA = capFor(z, E.a, A);
    if (capA) drawCap(p, capA, 1);
    if (two) {
      var capB = capFor(z, E.b, B);
      if (capB) drawCap(p, capB, E.mix);
    }
    c.restore();
  };

  /* ------------------------------------------------------------------ props */
  function drawOnGround(img, x, y, ang, h, flip, alpha) {
    var c = R.ctx, z = R.cam.z;
    var w = h * (img.width / img.height);
    c.save();
    c.translate(R.sx(x), R.sy(y));
    c.rotate(ang);
    c.scale(z * (flip ? -1 : 1), z);
    if (alpha !== undefined) c.globalAlpha = alpha;
    c.drawImage(img, -w / 2, -h + 3, w, h);
    c.restore();
  }

  R.drawProps = function (back) {
    var wl = R.cam.x - (R.W / 2 + 200) / R.cam.z, wr = R.cam.x + (R.W / 2 + 200) / R.cam.z;
    CG.World.each(wl, wr, function (ch) {
      for (var i = 0; i < ch.props.length; i++) {
        var pr = ch.props[i];
        if (!!pr.back !== !!back) continue;
        if (pr.x < wl - 120 || pr.x > wr + 120) continue;
        var im = CG.img[pr.kind];
        if (im) drawOnGround(im, pr.x, pr.y, pr.ang, pr.h, pr.flip);
        if (pr.marker || pr.label) {
          var c = R.ctx;
          c.save();
          c.translate(R.sx(pr.x), R.sy(pr.y) - pr.h * R.cam.z - 10);
          if (pr.label) R.text(pr.label, 0, 0, 15 * R.cam.z, '#FFE082', 'center', 3);
          else if (pr.cp) R.text('CHECK ' + pr.marker, 0, 0, 20, '#AED581', 'center', 4);
          else R.text(String(pr.marker * 160) + 'm', 0, 0, 20, '#FFF9C4', 'center', 4);
          c.restore();
        }
      }
    });
  };

  /* ----------------------------------------------------------- finish gate */
  /* Drawn, not sprited: it has to stay crisp at any zoom and it is the single
     most important thing on the track to be able to read from far away. */
  R.drawFinish = function (track, time) {
    if (!track) return;
    var c = R.ctx, z = R.cam.z, x = track.finishX;
    if (x < R.cam.x - (R.W / 2 + 300) / z || x > R.cam.x + (R.W / 2 + 300) / z) return;
    var gy = CG.Terrain.ground(x), sxp = R.sx(x), syp = R.sy(gy);
    var h = 240 * z, w = 150 * z, post = 13 * z, band = 52 * z;
    c.save();
    /* posts */
    c.fillStyle = '#ECEFF1';
    c.strokeStyle = '#2B2118'; c.lineWidth = 3 * z;
    c.fillRect(sxp - w / 2 - post, syp - h, post, h);
    c.strokeRect(sxp - w / 2 - post, syp - h, post, h);
    c.fillRect(sxp + w / 2, syp - h, post, h);
    c.strokeRect(sxp + w / 2, syp - h, post, h);
    /* checkered banner, gently waving */
    var cols = 8, rows = 3, cw = (w + post * 2) / cols, chh = band / rows;
    var x0 = sxp - w / 2 - post, y0 = syp - h;
    for (var i = 0; i < cols; i++) {
      var wave = Math.sin(time * 2.2 + i * 0.7) * 4 * z;
      for (var j = 0; j < rows; j++) {
        c.fillStyle = ((i + j) & 1) ? '#2B2118' : '#F5F5F5';
        c.fillRect(x0 + i * cw, y0 + j * chh + wave, cw + 1, chh + 1);
      }
    }
    c.strokeRect(x0, y0, w + post * 2, band);
    R.text('FINISH', sxp, y0 + band + 34 * z, 30 * z, '#FFD54F', 'center', 5 * z);
    c.restore();
  };

  /* ---------------------------------------------------------------- pickups */
  R.drawPickups = function (time) {
    var c = R.ctx, z = R.cam.z;
    var wl = R.cam.x - (R.W / 2 + 90) / z, wr = R.cam.x + (R.W / 2 + 90) / z;
    var sheet = CG.SHEETS.coin;
    CG.World.each(wl, wr, function (ch) {
      for (var i = 0; i < ch.picks.length; i++) {
        var p = ch.picks[i];
        if (p.x < wl - 60 || p.x > wr + 60 || CG.World.isTaken(p.id)) continue;
        var bob = Math.sin(time * 2.4 + p.ph) * 5;
        var sx = R.sx(p.x), sy = R.sy(p.y) + bob * z;
        var h = CG.PICK_H[p.type] * z;
        if (p.type === 'coin') {
          var im = CG.img.coin;
          if (!im) continue;
          var fr = Math.floor(time * 11 + p.ph * 3) % sheet.frames;
          c.drawImage(im, fr * sheet.frame, 0, sheet.frame, sheet.frame,
                      sx - h / 2, sy - h / 2, h, h);
        } else {
          var im2 = CG.img[p.type];
          if (!im2) continue;
          var w = h * (im2.width / im2.height);
          /* soft glow so pickups read against busy grass — one pre-rendered
             sprite, rather than a fresh radial gradient per pickup per frame */
          var gl = R.glow();
          var gs = h * 1.9;
          c.drawImage(gl, sx - gs / 2, sy - gs / 2, gs, gs);
          c.drawImage(im2, sx - w / 2, sy - h / 2, w, h);
        }
      }
    });
  };

  R.glow = function () {
    if (R.cache.glow) return R.cache.glow;
    var cv = document.createElement('canvas');
    cv.width = cv.height = 128;
    var cx = cv.getContext('2d');
    var g = cx.createRadialGradient(64, 64, 2, 64, 64, 62);
    g.addColorStop(0, 'rgba(255,245,180,0.55)');
    g.addColorStop(0.55, 'rgba(255,245,180,0.22)');
    g.addColorStop(1, 'rgba(255,245,180,0)');
    cx.fillStyle = g;
    cx.fillRect(0, 0, 128, 128);
    R.cache.glow = cv;
    return cv;
  };

  /* ------------------------------------------------------- coordinate grid
     The lesson, drawn into the world. Grid lines are one CG.UNIT apart in
     world space, the axes run through the gap's own origin, and the whole
     thing sits BEHIND the terrain so the cliffs cut it off exactly where a
     real plotted picture would — the points on the lips then sit on the grid
     the way they do in the textbook. Faded in and out by `alpha`. */
  var MINUS = '\u2212';
  R.coord = function (n) { return (n < 0 ? MINUS : '') + Math.abs(n); };
  R.pair = function (p) { return '(' + R.coord(p[0]) + ', ' + R.coord(p[1]) + ')'; };

  var X_COL = '#F59E0B', Y_COL = '#1E5BD6', KEY = 'rgba(255,255,255,0.95)', NAVY = '#1A3C8C';

  /* text with a light halo: dark numbers that stay legible over the pane */
  function haloText(str, x, y, size, fill, align) {
    var c = R.ctx;
    c.font = '800 ' + size + 'px "Nunito", "Trebuchet MS", system-ui, sans-serif';
    c.textAlign = align || 'center'; c.textBaseline = 'middle';
    c.lineJoin = 'round'; c.lineWidth = size * 0.28; c.strokeStyle = KEY;
    c.strokeText(str, x, y);
    c.fillStyle = fill; c.fillText(str, x, y);
  }
  R.haloText = haloText;

  /* The grid pane on screen, so the title can sit over it. */
  R.gridBox = function (gap) {
    var U = CG.UNIT, z = R.cam.z;
    var minGX = Math.min(gap.a[0], gap.b[0]) - 2, maxGX = Math.max(gap.a[0], gap.b[0]) + 2;
    var minGY = Math.min(gap.a[1], gap.b[1]) - 4, maxGY = Math.max(gap.a[1], gap.b[1]) + 6;
    return { minGX: minGX, maxGX: maxGX, minGY: minGY, maxGY: maxGY,
             left: R.sx(gap.ox + minGX * U) - 0.5 * U * z, right: R.sx(gap.ox + maxGX * U) + 0.5 * U * z,
             top: Math.max(104, R.sy(gap.oy - maxGY * U) - 0.5 * U * z),
             bottom: R.sy(gap.oy - minGY * U) + 0.5 * U * z };
  };

  R.drawGrid = function (gap, alpha) {
    if (!gap || alpha <= 0.01) return;
    var c = R.ctx, z = R.cam.z, U = CG.UNIT, b = R.gridBox(gap);
    var left = b.left, right = b.right, top = b.top, bottom = b.bottom, i, x, y;
    c.save();
    c.globalAlpha = alpha;
    /* the frosted pane */
    R.roundRect(left, top, right - left, bottom - top, 18 * z);
    c.fillStyle = 'rgba(190,222,250,0.46)'; c.fill();
    c.lineWidth = 2.5; c.strokeStyle = 'rgba(255,255,255,0.75)'; c.stroke();
    c.save();
    R.roundRect(left, top, right - left, bottom - top, 18 * z); c.clip();
    c.lineWidth = 1.5;
    c.strokeStyle = 'rgba(255,255,255,0.72)';
    c.beginPath();
    for (i = b.minGX; i <= b.maxGX; i++) {
      x = Math.round(R.sx(gap.ox + i * U)) + 0.5;
      c.moveTo(x, top); c.lineTo(x, bottom);
    }
    for (i = b.minGY; i <= b.maxGY; i++) {
      y = Math.round(R.sy(gap.oy - i * U)) + 0.5;
      c.moveTo(left, y); c.lineTo(right, y);
    }
    c.stroke();
    c.restore();
    /* THE NUMBER LINE: a thick orange x-axis and blue y-axis, arrowheads at
       both ends just past the pane, a tick every unit, a number every two */
    var ax = R.sx(gap.ox), ay = R.sy(gap.oy), arrow = 16 * z, tick = 7 * z, big = 11 * z;
    var fs = Math.max(13, 17 * z), over = 0.6 * U * z;
    var every = 2;
    function axisLine(x0, y0, x1, y1, col) {
      c.lineCap = 'round';
      c.lineWidth = 9; c.strokeStyle = KEY;
      c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
      c.lineWidth = 5.5; c.strokeStyle = col;
      c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
    }
    function arrowHead(x0, y0, dx, dy, col) {
      c.beginPath();
      c.moveTo(x0 + dx * arrow, y0 + dy * arrow);
      c.lineTo(x0 - dy * arrow * 0.6, y0 + dx * arrow * 0.6);
      c.lineTo(x0 + dy * arrow * 0.6, y0 - dx * arrow * 0.6);
      c.closePath();
      c.fillStyle = col; c.fill();
      c.lineWidth = 2.5; c.strokeStyle = KEY; c.lineJoin = 'round'; c.stroke();
    }
    var xL = left - over, xR = right + over;
    var yT = Math.max(top - over, 112), yB = bottom + over;
    var showY = ay > yT + 40;
    axisLine(xL, ay, xR, ay, X_COL);
    arrowHead(xR, ay, 1, 0, X_COL); arrowHead(xL, ay, -1, 0, X_COL);
    if (showY) {
      axisLine(ax, yB, ax, yT, Y_COL);
      arrowHead(ax, yT, 0, -1, Y_COL); arrowHead(ax, yB, 0, 1, Y_COL);
    }
    c.lineCap = 'butt';
    c.strokeStyle = X_COL; c.lineWidth = 3;
    c.beginPath();
    for (i = b.minGX; i <= b.maxGX; i++) {
      if (i === 0) continue;
      x = R.sx(gap.ox + i * U); var t = i % every ? tick : big;
      c.moveTo(x, ay - t); c.lineTo(x, ay + t);
    }
    c.stroke();
    if (showY) {
      c.strokeStyle = Y_COL;
      c.beginPath();
      for (i = b.minGY; i <= b.maxGY; i++) {
        if (i === 0) continue;
        y = R.sy(gap.oy - i * U); if (y < yT + 8) continue;
        var t2 = i % every ? tick : big;
        c.moveTo(ax - t2, y); c.lineTo(ax + t2, y);
      }
      c.stroke();
    }
    for (i = b.minGX; i <= b.maxGX; i++) {
      if (i === 0 || i % every) continue;
      haloText(R.coord(i), R.sx(gap.ox + i * U), ay + big + fs * 0.85, fs, NAVY, 'center');
    }
    if (showY) for (i = b.minGY; i <= b.maxGY; i++) {
      if (i === 0 || i % every) continue;
      y = R.sy(gap.oy - i * U); if (y < yT + 8) continue;
      haloText(R.coord(i), ax - big - fs * 0.5, y, fs, NAVY, 'right');
    }
    /* axis letters in little white badges */
    function badge(txt, x, y, col) {
      var w = fs * 1.8, h = fs * 1.7;
      R.roundRect(x - w / 2, y - h / 2, w, h, 7);
      c.fillStyle = 'rgba(255,255,255,0.95)'; c.fill();
      c.lineWidth = 1.5; c.strokeStyle = 'rgba(255,255,255,1)'; c.stroke();
      R.text(txt, x, y + 1, fs * 1.35, col, 'center', 0);
    }
    badge('x', xR + arrow + fs * 0.6, ay - fs * 1.5, X_COL);
    if (showY) badge('y', ax + fs * 1.6, yT + fs * 0.3, Y_COL);
    c.restore();
  };

  /* The pit of every chasm in view, darkening towards its floor. The
     background layers stop well above a pit this deep and would otherwise
     show through as a flat wall of colour; the shadow is what makes the hole
     read as a hole. Drawn before the terrain, so the walls sit over it. */
  R.drawChasmDepth = function (track) {
    if (!track || !track.chasms.length) return;
    var c = R.ctx, z = R.cam.z, i, g;
    var wl = R.cam.x - (R.W / 2 + 100) / z, wr = R.cam.x + (R.W / 2 + 100) / z;
    for (i = 0; i < track.chasms.length; i++) {
      g = track.chasms[i];
      if (g.bx < wl || g.ax > wr) continue;
      var x0 = R.sx(g.ax) - 2, x1 = R.sx(g.bx) + 2;
      var lip = Math.min(g.ay, g.by), top = R.sy(lip), bot = R.sy(lip + 1000);
      /* the valley far below: the parallax art ends a few hundred px down, so
         beneath it a river-blue floor fades up into the haze */
      var vt = R.sy(lip + 260), vb = R.sy(lip + 1000);
      var valley = c.createLinearGradient(0, vt, 0, vb);
      valley.addColorStop(0, 'rgba(70,140,190,0)');
      valley.addColorStop(0.35, 'rgba(70,140,190,0.85)');
      valley.addColorStop(0.7, 'rgba(40,95,140,1)');
      valley.addColorStop(1, 'rgba(18,40,65,1)');
      c.fillStyle = valley;
      c.fillRect(x0, vt, x1 - x0, Math.max(0, Math.min(R.H + 40, vb) - vt));
      var grad = c.createLinearGradient(0, top, 0, bot);
      grad.addColorStop(0, 'rgba(150,190,225,0.0)');
      grad.addColorStop(0.25, 'rgba(120,165,205,0.22)');       // distance haze
      grad.addColorStop(0.6, 'rgba(40,70,105,0.62)');
      grad.addColorStop(1, 'rgba(12,20,34,0.96)');
      c.fillStyle = grad;
      c.fillRect(x0, top, x1 - x0, Math.max(0, Math.min(R.H + 40, bot) - top));
    }
  };

  /* Rock faces on the two walls, over the dirt: a cliff is cut stone, not a
     slice through a flowerbed. Lit on the pit side, cracked at intervals. */
  R.drawChasmWalls = function (track) {
    if (!track || !track.chasms.length) return;
    var c = R.ctx, z = R.cam.z, i, g, k;
    var wl = R.cam.x - (R.W / 2 + 100) / z, wr = R.cam.x + (R.W / 2 + 100) / z;
    var W = 44 * z;
    function face(sx, lipY, side) {         // side +1: face looks to +x (near wall)
      var top = R.sy(lipY) + 2, bot = R.H + 10, x0 = side > 0 ? sx - W : sx;
      if (top > bot) return;
      var grad = c.createLinearGradient(x0, 0, x0 + W, 0);
      if (side > 0) { grad.addColorStop(0, '#8D6743'); grad.addColorStop(0.75, '#B08856'); grad.addColorStop(1, '#D4AA6E'); }
      else { grad.addColorStop(0, '#D4AA6E'); grad.addColorStop(0.25, '#B08856'); grad.addColorStop(1, '#8D6743'); }
      c.fillStyle = grad;
      c.fillRect(x0, top, W, bot - top);
      /* strata and cracks, seeded by the wall's world x so they do not crawl */
      var rnd = CG.rng(Math.floor(sx / z + R.cam.x) | 0), y = top + 10 * z, n = 0;
      c.strokeStyle = 'rgba(70,40,20,0.45)'; c.lineWidth = 2 * z;
      c.beginPath();
      while (y < bot && n++ < 60) {
        var len = W * (0.4 + rnd() * 0.6), xs = side > 0 ? x0 + W - len : x0;
        c.moveTo(xs, y); c.lineTo(xs + len, y + (rnd() - 0.5) * 8 * z);
        y += (26 + rnd() * 48) * z;
      }
      c.stroke();
      /* depth shade down the face */
      var g2 = c.createLinearGradient(0, top, 0, top + 900 * z);
      g2.addColorStop(0, 'rgba(0,0,0,0)'); g2.addColorStop(1, 'rgba(10,15,25,0.85)');
      c.fillStyle = g2; c.fillRect(x0, top, W, bot - top);
      /* the lip's own edge */
      c.fillStyle = 'rgba(255,240,200,0.35)';
      c.fillRect(side > 0 ? sx - 3 * z : sx, top - 2, 3 * z, Math.min(bot - top, 900 * z));
    }
    for (i = 0; i < track.chasms.length; i++) {
      g = track.chasms[i];
      if (g.bx < wl || g.ax > wr) continue;
      face(R.sx(g.ax), g.ay, 1);
      face(R.sx(g.bx), g.by, -1);
    }
  };

  /* The two plotted points, their labels and (when `legs`) the right
     triangle under the hypotenuse with its legs measured — the hint. Drawn in
     front of the terrain: these must never be hidden. */
  R.drawGapPoints = function (gap, alpha, legs) {
    if (!gap || alpha <= 0.01) return;
    var c = R.ctx, z = R.cam.z, U = CG.UNIT;
    var ax = R.sx(gap.ax), ay = R.sy(gap.ay), bx = R.sx(gap.bx), by = R.sy(gap.by);
    c.save();
    c.globalAlpha = alpha;
    if (legs) {
      var q = gap.q, cx = bx, cy = ay;              // the corner under B, level with A
      c.setLineDash([6 * z, 5 * z]);
      c.lineWidth = 2.5;
      c.strokeStyle = '#FFF176';
      c.beginPath(); c.moveTo(ax, ay); c.lineTo(cx, cy); c.lineTo(bx, by); c.stroke();
      c.strokeStyle = '#FF8A65';
      c.beginPath(); c.moveTo(ax, ay); c.lineTo(bx, by); c.stroke();
      c.setLineDash([]);
      R.text(String(q.dx), (ax + cx) / 2, cy + 18 * z, 17 * z, '#FFF176', 'center', 4);
      if (q.dy) R.text(String(q.dy), cx + 16 * z, (cy + by) / 2, 17 * z, '#FFF176', 'left', 4);
    }
    var r = 9 * z;
    [[ax, ay, gap.a, 'right'], [bx, by, gap.b, 'left']].forEach(function (p) {
      c.beginPath(); c.arc(p[0], p[1], r + 4, 0, CG.TAU);
      c.fillStyle = 'rgba(255,255,255,0.35)'; c.fill();
      c.beginPath(); c.arc(p[0], p[1], r, 0, CG.TAU);
      c.fillStyle = '#9C27B0'; c.fill();
      c.lineWidth = 2.5; c.strokeStyle = '#FFF'; c.stroke();
      var txt = R.pair(p[2]), fs = Math.max(15, 22 * z);
      c.font = '800 ' + fs + 'px "Nunito", "Trebuchet MS", system-ui, sans-serif';
      var tw = c.measureText(txt).width + fs * 1.0, th = fs * 1.5;
      var lx = p[0], ly = p[1] - r - 8 * z - th / 2;
      R.roundRect(lx - tw / 2, ly - th / 2, tw, th, th / 2);
      c.fillStyle = 'rgba(255,255,255,0.96)'; c.fill();
      c.lineWidth = 3; c.strokeStyle = '#8E24AA'; c.stroke();
      R.text(txt, lx, ly + 1, fs, '#5E1B8A', 'center', 0);
    });
    c.restore();
  };

  /* A plank. `pose` is the midpoint of its TOP edge, its angle, its length in
     world px, and a scale/alpha for the spawn pop. The body hangs below the
     top edge, so a placed plank's top is exactly the driving surface. */
  var PLANK_T = 16;
  R.PLANK_T = PLANK_T;
  R.drawPlank = function (pose, label) {
    var c = R.ctx, z = R.cam.z, L = pose.len, T = PLANK_T;
    if (L < 2) return;
    c.save();
    c.translate(R.sx(pose.x), R.sy(pose.y));
    c.rotate(pose.ang);
    var sc = (pose.scale === undefined ? 1 : pose.scale) * z;
    c.scale(sc, sc);
    c.globalAlpha = pose.alpha === undefined ? 1 : pose.alpha;
    /* shadow / underside */
    c.fillStyle = 'rgba(43,33,24,0.35)';
    R.roundRect(-L / 2 + 3, 4, L, T + 2, 4); c.fill();
    /* body */
    var g = c.createLinearGradient(0, 0, 0, T);
    g.addColorStop(0, '#D9A05B'); g.addColorStop(0.5, '#B87A3A'); g.addColorStop(1, '#8A5424');
    c.fillStyle = g;
    R.roundRect(-L / 2, 0, L, T, 3); c.fill();
    c.lineWidth = 2; c.strokeStyle = '#5B3616'; c.stroke();
    /* grain */
    c.strokeStyle = 'rgba(90,50,20,0.35)'; c.lineWidth = 1;
    c.beginPath();
    for (var i = 1; i < 3; i++) { c.moveTo(-L / 2 + 6, T * i / 3 + 1); c.lineTo(L / 2 - 6, T * i / 3 - 1); }
    c.stroke();
    /* bracing straps every ~unit so the length can be counted by eye */
    c.fillStyle = 'rgba(70,40,15,0.45)';
    var n = Math.max(1, Math.round(L / CG.UNIT));
    for (var k = 1; k < n; k++) c.fillRect(-L / 2 + k * (L / n) - 1.5, 0, 3, T);
    /* top highlight */
    c.fillStyle = 'rgba(255,240,200,0.35)';
    c.fillRect(-L / 2 + 2, 1, L - 4, 2);
    if (label) {
      c.rotate(-pose.ang);
      R.text(label, 0, -20, 19, '#FFE082', 'center', 4);
    }
    c.restore();
  };

  /* Planks already fixed into the world (see Terrain.planks). */
  R.drawPlanks = function (skip) {
    var ps = CG.Terrain.planks, i, p;
    var wl = R.cam.x - (R.W / 2 + 400) / R.cam.z, wr = R.cam.x + (R.W / 2 + 400) / R.cam.z;
    for (i = 0; i < ps.length; i++) {
      p = ps[i];
      if (p === skip || p.x1 < wl || p.x0 > wr) continue;
      R.drawPlank({ x: (p.x0 + p.x1) / 2, y: (p.y0 + p.y1) / 2,
                    ang: Math.atan2(p.y1 - p.y0, p.x1 - p.x0), len: Math.hypot(p.x1 - p.x0, p.y1 - p.y0) });
    }
  };

  /* ---------------------------------------------------------------- vehicle */
  R.drawVehicle = function (v, dt) {
    var c = R.ctx, z = R.cam.z, ART = V.ART, i, w;
    var car = CG.img.car, wheel = CG.img.wheel;
    c.save();
    c.translate(R.sx(v.x), R.sy(v.y));
    c.rotate(v.a);
    c.scale(z, z);

    /* wheels first — they sit behind the chassis and protrude below the arches */
    if (wheel) {
      var wd = 2 * V.WHEEL_R * (wheel.width / (2 * 587));   // 587px = tyre radius in art
      for (i = 0; i < 2; i++) {
        w = v.wheels[i];
        c.save();
        c.translate(w.ax, w.ay + w.s);
        c.rotate(w.ang || 0);
        c.drawImage(wheel, -wd / 2, -wd / 2, wd, wd);
        c.restore();
      }
    }
    if (car) {
      c.drawImage(car, V.bodyOrigin.x, V.bodyOrigin.y,
                  car.width * ART, car.height * ART);
    }
    /* no driver: the cabin is tinted glass, and the car is the character */

    /* headlamps: a cone of light ahead of the lamp cluster once it gets dark,
       additive so it lifts whatever it falls on rather than painting over it */
    var night = CG.Env.night;
    if (night > 0.04) {
      var lx = V.lamp.x, ly = V.lamp.y, len = 300, spread = 58;
      c.save();
      c.globalCompositeOperation = 'lighter';
      var g = c.createLinearGradient(lx, ly, lx + len, ly);
      g.addColorStop(0, 'rgba(255,238,170,' + (0.34 * night).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(255,238,170,0)');
      c.fillStyle = g;
      c.beginPath();
      c.moveTo(lx, ly - 6);
      c.lineTo(lx + len, ly - spread);
      c.lineTo(lx + len, ly + spread * 0.7);
      c.lineTo(lx, ly + 8);
      c.closePath();
      c.fill();
      var gl = c.createRadialGradient(lx, ly, 2, lx, ly, 26);
      gl.addColorStop(0, 'rgba(255,246,200,' + (0.9 * night).toFixed(3) + ')');
      gl.addColorStop(1, 'rgba(255,246,200,0)');
      c.fillStyle = gl;
      c.fillRect(lx - 26, ly - 26, 52, 52);
      c.restore();
    }
    c.restore();
  };

  /* --------------------------------------------------------------------- fx */
  R.drawFX = function (front) {
    var c = R.ctx, z = R.cam.z, i;
    for (i = 0; i < CG.FX.parts.length; i++) {
      var p = CG.FX.parts[i];
      if (!!p.front !== !!front) continue;
      var sh = CG.SHEETS[p.sheet], im = CG.img[p.sheet];
      if (!im || !sh) continue;
      var f = CG.clamp(Math.floor(p.t / p.life * sh.frames), 0, sh.frames - 1);
      var s = p.size * z;
      c.save();
      c.globalAlpha = CG.clamp(1.15 - p.t / p.life, 0, 1);
      c.translate(R.sx(p.x), R.sy(p.y));
      c.rotate(p.rot);
      c.drawImage(im, f * sh.frame, 0, sh.frame, sh.frame, -s / 2, -s / 2, s, s);
      c.restore();
    }
  };

  R.drawTexts = function () {
    var c = R.ctx;
    for (var i = 0; i < CG.FX.texts.length; i++) {
      var t = CG.FX.texts[i];
      var k = t.t / t.life;
      c.save();
      c.globalAlpha = CG.clamp(1.6 - k * 1.8, 0, 1);
      R.text(t.str, R.sx(t.x), R.sy(t.y), (t.big ? 34 : 23) * (1 + k * 0.25),
             t.col, 'center', 5);
      c.restore();
    }
  };

  /* ------------------------------------------------------------- ui helpers */
  R.text = function (str, x, y, size, fill, align, outline) {
    var c = R.ctx;
    c.font = '800 ' + size + 'px "Nunito", "Trebuchet MS", system-ui, sans-serif';
    c.textAlign = align || 'left';
    c.textBaseline = 'middle';
    if (outline) {
      c.lineWidth = outline;
      c.lineJoin = 'round';
      c.strokeStyle = 'rgba(43,33,24,0.92)';
      c.strokeText(str, x, y);
    }
    c.fillStyle = fill;
    c.fillText(str, x, y);
  };

  R.roundRect = function (x, y, w, h, r) {
    var c = R.ctx;
    if (w < 0) { x += w; w = -w; }            // a squeezed layout must never throw mid-frame
    if (h < 0) { y += h; h = -h; }
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  };

  R.panel = function (x, y, w, h, r, fill, alpha) {
    var c = R.ctx;
    c.save();
    c.globalAlpha = alpha === undefined ? 1 : alpha;
    R.roundRect(x, y, w, h, r);
    c.fillStyle = fill || 'rgba(43,33,24,0.42)';
    c.fill();
    c.restore();
  };
})(CG);

/* ================================== STAGES ==================================
   The objective. A run is one stage: reach the flag before the fuel or the
   lives run out. Three stars per stage — finishing is one, the par time is the
   second, the coin goal is the third — so a stage stays worth replaying after
   it is beaten.

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Distance Formula">
  <!-- The game in one mark: two plotted points and the distance between
       them. The right-angled legs are held faint so they appear as the
       icon gets bigger and never muddy it at 16px, where all that has
       to read is two dots and a line. -->
  <rect width="64" height="64" rx="15" fill="#213258"/>
  <g stroke="#FFF1E2" stroke-opacity=".14" stroke-width="1.6">
    <path d="M16 5V59M32 5V59M48 5V59M5 16H59M5 32H59M5 48H59"/>
  </g>
  <path d="M18 46H46V18" fill="none" stroke="#2F8F6F" stroke-opacity=".8"
        stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M18 46L46 18" fill="none" stroke="#FFF1E2"
        stroke-width="6" stroke-linecap="round"/>
  <g fill="#FFC93D" stroke="#213258" stroke-width="2.6">
    <circle cx="18" cy="46" r="7.5"/>
    <circle cx="46" cy="18" r="7.5"/>
  </g>
</svg>
